<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Targets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
body{padding:16px}

.hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.hdr-label{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e4002b}
.hdr-sub{font-size:.72rem;color:#666;font-variant-numeric:tabular-nums}

/* Target list */
.target-list{display:flex;flex-direction:column;gap:4px}
.target-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;transition:background .15s}
.target-row:hover{background:#141414}
.tile{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile svg{width:22px;height:22px;fill:#fff}
.tr-main{flex:1;min-width:0}
.tr-name{font-size:.88rem;font-weight:700;color:#f0f0f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.tr-date{font-size:.72rem;color:#666;font-variant-numeric:tabular-nums;margin-top:2px;font-family:'SF Mono','Fira Code',Consolas,monospace}
.tr-id{font-size:.66rem;color:#3a3a3a;font-variant-numeric:tabular-nums;font-family:'SF Mono','Fira Code',Consolas,monospace;flex-shrink:0}

/* Detail */
.det-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dh-txt{min-width:0}
.dh-name{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-meta{font-size:.72rem;color:#666;margin-top:2px;font-variant-numeric:tabular-nums;font-family:'SF Mono','Fira Code',Consolas,monospace}
.phases-section{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;margin-bottom:9px}
.phase-row{display:flex;align-items:stretch;margin-bottom:7px;border-radius:10px;overflow:hidden}
.phase-type{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.56rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:8px 0;min-height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;width:24px}
.pt-warmup{background:#0d2d42;color:#5aa0d8}
.pt-cooldown{background:#0d2d18;color:#57c46b}
.pt-work{background:#2a0409;color:#ff5566}
.pt-repeat{background:#1e0d2a;color:#b07de0}
.phase-body{flex:1;background:#141414;padding:9px 13px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.phase-stat{display:flex;flex-direction:column;gap:2px}
.ps-val{font-size:.84rem;font-weight:800;font-variant-numeric:tabular-nums;color:#f0f0f0;font-family:'SF Mono','Fira Code',Consolas,monospace}
.ps-lbl{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4a4a4a}
.repeat-count{font-size:.76rem;font-weight:800;color:#b07de0;padding:3px 8px;background:#1e0d2a;border-radius:6px;margin-left:auto;flex-shrink:0}

/* Created confirmation (red hero style) */
.created-card{background:linear-gradient(140deg,#e4002b 0%,#c40023 100%);border-radius:16px;padding:20px;color:#fff}
.cc-label{display:flex;align-items:center;gap:6px;font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-bottom:12px}
.cc-check{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.cc-check svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc-name{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.cc-datetime{font-size:.82rem;opacity:.9;font-variant-numeric:tabular-nums;margin-bottom:10px;font-family:'SF Mono','Fira Code',Consolas,monospace}
.cc-id{font-size:.7rem;opacity:.7;font-family:'SF Mono','Fira Code',Consolas,monospace}

.empty-state{color:#4a4a4a;font-size:.8rem;font-style:italic;padding:16px 0}
.loading{color:#4a4a4a;font-size:.8rem;font-style:italic;padding:16px 0}
.fade-in{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-label" id="hdr-label">Training Targets</span>
  <span class="hdr-sub" id="hdr-sub"></span>
</div>
<div id="root" class="loading">Loading…</div>

<script>
const pending = new Map(); let msgId = 0;
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && pending.has(m.id)) {
    const {resolve,reject} = pending.get(m.id); pending.delete(m.id);
    m.error ? reject(new Error(m.error?.message ?? "RPC error")) : resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent);
});
function rpc(method, params) {
  const id = ++msgId;
  return new Promise((resolve,reject) => { pending.set(id,{resolve,reject}); window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*"); });
}
rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"polar-targets-ui",version:"3.0"},appCapabilities:{availableDisplayModes:["inline"]}})
  .then(()=>window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*"));

const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const SPORT_GLYPHS = {
  run:'<path d="M13.5,5.5C14.59,5.5 15.5,4.58 15.5,3.5C15.5,2.38 14.59,1.5 13.5,1.5C12.39,1.5 11.5,2.38 11.5,3.5C11.5,4.58 12.39,5.5 13.5,5.5M9.89,19.38L10.89,15L13,17V23H15V15.5L12.89,13.5L13.5,10.5C14.79,12 16.79,13 19,13V11C17.09,11 15.5,10 14.69,8.58L13.69,7C13.29,6.38 12.69,6 12,6C11.69,6 11.5,6.08 11.19,6.08L6,8.28V13H8V9.58L9.79,8.88L8.19,17L3.29,16L2.89,18L9.89,19.38Z"/>',
  ride:'<path d="M5,20.5A3.5,3.5 0 0,1 1.5,17A3.5,3.5 0 0,1 5,13.5A3.5,3.5 0 0,1 8.5,17A3.5,3.5 0 0,1 5,20.5M5,12A5,5 0 0,0 0,17A5,5 0 0,0 5,22A5,5 0 0,0 10,17A5,5 0 0,0 5,12M14.8,10H19V8.2H15.8L13.86,4.93C13.57,4.43 13,4.1 12.4,4.1C11.93,4.1 11.5,4.29 11.2,4.6L7.5,8.29C7.19,8.6 7,9 7,9.5C7,10.13 7.33,10.66 7.85,10.97L11.2,13V18H13V11.5L10.75,9.85L13.07,7.5M19,20.5A3.5,3.5 0 0,1 15.5,17A3.5,3.5 0 0,1 19,13.5A3.5,3.5 0 0,1 22.5,17A3.5,3.5 0 0,1 19,20.5M19,12A5,5 0 0,0 14,17A5,5 0 0,0 19,22A5,5 0 0,0 24,17A5,5 0 0,0 19,12M16,4.8C17,4.8 17.8,4 17.8,3C17.8,2 17,1.2 16,1.2C15,1.2 14.2,2 14.2,3C14.2,4 15,4.8 16,4.8Z"/>',
  swim:'<path d="M2,18C4.22,17 6.44,16 8.67,16C10.89,16 13.11,18 15.33,18C17.56,18 19.78,16 22,16V19C19.78,19 17.56,21 15.33,21C13.11,21 10.89,19 8.67,19C6.44,19 4.22,20 2,21V18M8.67,13C7.89,13 7.12,13.12 6.35,13.32L11.27,9.88L10.23,8.64C10.09,8.47 10,8.24 10,8C10,7.66 10.17,7.35 10.44,7.17L16.16,3.17L17.31,4.8L12.47,8.19L17.7,14.42C16.91,14.75 16.12,15 15.33,15C13.11,15 10.89,13 8.67,13M18,7A2,2 0 0,1 20,9A2,2 0 0,1 18,11A2,2 0 0,1 16,9A2,2 0 0,1 18,7Z"/>',
  hike:'<path d="M17.47 8.67H19V23H17.47V12.6C16.67 12.44 15.92 12.14 15.21 11.71S13.9 10.78 13.39 10.2L12.77 13.27L15 15.47V23H13V17L10.76 14.8L8.89 23H6.73C6.73 23 9.86 7.22 9.89 7.09C10 6.61 10.22 6.24 10.59 6C10.96 5.73 11.33 5.6 11.71 5.6C12.1 5.6 12.46 5.69 12.79 5.87C13.13 6.04 13.39 6.29 13.58 6.61L14.64 8.24C14.93 8.78 15.32 9.25 15.81 9.63S16.86 10.3 17.47 10.5V8.67M8.55 5.89L7.4 5.65C6.83 5.5 6.31 5.62 5.84 5.94C5.38 6.26 5.1 6.7 5 7.28L4.19 11.26C4.16 11.55 4.22 11.81 4.38 12.05C4.54 12.29 4.75 12.42 5 12.46L7.21 12.89L8.55 5.89M13 1C11.9 1 11 1.9 11 3S11.9 5 13 5 15 4.11 15 3 14.11 1 13 1Z"/>',
  walk:'<path d="M14.12,10H19V8.2H15.38L13.38,4.87C13.08,4.37 12.54,4.03 11.92,4.03C11.74,4.03 11.58,4.06 11.42,4.11L6,5.8V11H7.8V7.33L9.91,6.67L6,22H7.8L10.67,13.89L13,17V22H14.8V15.59L12.31,11.05L13.04,8.18M14,3.8C15,3.8 15.8,3 15.8,2C15.8,1 15,0.2 14,0.2C13,0.2 12.2,1 12.2,2C12.2,3 13,3.8 14,3.8Z"/>',
  gym:'<path d="M20.57,14.86L22,13.43L20.57,12L17,15.57L8.43,7L12,3.43L10.57,2L9.14,3.43L7.71,2L5.57,4.14L4.14,2.71L2.71,4.14L4.14,5.57L2,7.71L3.43,9.14L2,10.57L3.43,12L7,8.43L15.57,17L12,20.57L13.43,22L14.86,20.57L16.29,22L18.43,19.86L19.86,21.29L21.29,19.86L19.86,18.43L22,16.29L20.57,14.86Z"/>',
  ski:'<path d="M17.92 13.32C17.67 13.28 16.71 13 16.46 12.89L14.39 19.37L11.3 18.24L13.5 12.47L10.45 9L13 7.54C13.45 8.67 14.17 9.62 15.12 10.4S17.16 11.67 18.38 11.86L19.5 8.43L18.06 7.96L17.54 9.56C16.88 9.28 16.3 8.86 15.8 8.32C15.3 7.77 14.94 7.13 14.72 6.41L14.39 5.33C14.27 4.93 14.04 4.61 13.71 4.37C13.38 4.14 13 4 12.63 3.97C12.24 3.94 11.86 4 11.5 4.21L8 6.23C7.63 6.44 7.36 6.74 7.19 7.12C7 7.5 6.96 7.88 7 8.29S7.26 9.06 7.54 9.37L11.11 13.08L9.42 17.54L2.47 15.05L2 16.46L16.04 21.58C16.82 21.86 17.65 22 18.53 22C19.15 22 19.76 21.92 20.36 21.77C20.95 21.61 21.5 21.39 22 21.11L20.87 20C20.12 20.33 19.34 20.5 18.53 20.5C17.87 20.5 17.21 20.39 16.55 20.17L15.8 19.89L17.92 13.32M19 3C19 4.11 18.11 5 17 5S15 4.11 15 3 15.9 1 17 1 19 1.9 19 3Z"/>',
  esport:'<path d="M7,6H17A6,6 0 0,1 23,12A6,6 0 0,1 17,18C15.22,18 13.63,17.23 12.53,16H11.47C10.37,17.23 8.78,18 7,18A6,6 0 0,1 1,12A6,6 0 0,1 7,6M6,9V11H4V13H6V15H8V13H10V11H8V9H6M15.5,12A1.5,1.5 0 0,0 14,13.5A1.5,1.5 0 0,0 15.5,15A1.5,1.5 0 0,0 17,13.5A1.5,1.5 0 0,0 15.5,12M18.5,9A1.5,1.5 0 0,0 17,10.5A1.5,1.5 0 0,0 18.5,12A1.5,1.5 0 0,0 20,10.5A1.5,1.5 0 0,0 18.5,9Z"/>',
  generic:'<path d="M16.5,5.5A2,2 0 0,0 18.5,3.5A2,2 0 0,0 16.5,1.5A2,2 0 0,0 14.5,3.5A2,2 0 0,0 16.5,5.5M12.9,19.4L13.9,15L16,17V23H18V15.5L15.9,13.5L16.5,10.5C17.89,12.09 19.89,13 22,13V11C20.24,11.03 18.6,10.11 17.7,8.6L16.7,7C16.34,6.4 15.7,6 15,6C14.7,6 14.5,6.1 14.2,6.1L9,8.3V13H11V9.6L12.8,8.9L11.2,17L6.3,16L5.9,18L12.9,19.4M4,9A1,1 0 0,1 3,8A1,1 0 0,1 4,7H7V9H4M5,5A1,1 0 0,1 4,4A1,1 0 0,1 5,3H10V5H5M3,13A1,1 0 0,1 2,12A1,1 0 0,1 3,11H7V13H3Z"/>',
};
const SPORT_COLORS = { run:"#e4002b", ride:"#f77f00", swim:"#0099cc", hike:"#57a05a", gym:"#8a8a8a", ski:"#00b4d8", generic:"#e4002b" };
function sportKey(name){
  const n = String(name??"").toLowerCase();
  if(n.includes("run")||n.includes("course")||n.includes("footing")) return "run";
  if(n.includes("cycl")||n.includes("bik")||n.includes("velo")||n.includes("vélo")||n.includes("ride")) return "ride";
  if(n.includes("swim")||n.includes("natation")) return "swim";
  if(n.includes("hik")||n.includes("rando")||n.includes("walk")||n.includes("marche")) return "hike";
  if(n.includes("gym")||n.includes("strength")||n.includes("muscu")||n.includes("renfor")||n.includes("fonctionnel")) return "gym";
  if(n.includes("ski")||n.includes("nordic")) return "ski";
  return "generic";
}
function sportTile(name){
  const k = sportKey(name);
  return `<div class="tile" style="background:${SPORT_COLORS[k]}"><svg viewBox="0 0 24 24">${SPORT_GLYPHS[k]}</svg></div>`;
}

function fmtDateTime(iso) {
  if (!iso) return "—";
  const s = String(iso);
  const date = s.slice(0,10).split("-");
  const time = s.slice(11,16);
  const d = `${parseInt(date[2])} ${MONTHS_SHORT[parseInt(date[1])-1]} ${date[0]}`;
  return time ? `${d} · ${time}` : d;
}
function fmtDurStr(hms) {
  const p = String(hms ?? "").split(":").map(Number);
  if (p.length !== 3 || p.some(isNaN)) return String(hms ?? "");
  const [h,m,s] = p;
  return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}
function fmtGoal(p) {
  if (!p) return null;
  const gt = p.goalType ?? p.goal_type;
  if (gt === "DISTANCE" || (p.distance != null && gt !== "DURATION")) {
    const v = Number(p.distance ?? p.distance?.value ?? 0);
    if (!v) return null;
    return v >= 1000 ? (v/1000).toFixed(1)+"km" : v+"m";
  }
  if (gt === "DURATION" || p.duration) {
    const dur = p.duration?.value ?? p.duration;
    return dur ? fmtDurStr(dur) : null;
  }
  return null;
}
function fmtZone(p) {
  if (!p) return null;
  const lo = Number(p.lowerZone ?? p.lower_zone?.value ?? 0);
  const hi = Number(p.upperZone ?? p.upper_zone?.value ?? 0);
  if (lo > 0 && hi > 0) return `Z${lo}${lo!==hi?`–${hi}`:""}`;
  const it = p.intensityType ?? p.intensity_type;
  if (it && it !== "NONE") return String(it).replace(/_/g," ").toLowerCase();
  return null;
}

function render(sc) {
  if (!sc) return;
  const root = document.getElementById("root");
  const label = document.getElementById("hdr-label");
  const sub = document.getElementById("hdr-sub");
  root.className = "";

  if (sc.type === "target_list") {
    label.textContent = "Training Targets";
    sub.textContent = `${sc.from} → ${sc.to}`;
    const targets = sc.targets ?? [];
    if (!targets.length) { root.innerHTML = `<div class="empty-state">No targets in this period.</div>`; return; }
    root.innerHTML = `<div class="target-list fade-in">${targets.map(t => `
      <div class="target-row">
        ${sportTile(t.title)}
        <div class="tr-main">
          <div class="tr-name">${esc(t.title || "(unnamed)")}</div>
          <div class="tr-date">${esc(fmtDateTime(t.start))}</div>
        </div>
        <div class="tr-id">#${esc(t.id)}</div>
      </div>`).join("")}</div>`;
    return;
  }

  if (sc.type === "target_detail") {
    const t = sc.target ?? {};
    label.textContent = "Target";
    sub.textContent = `#${sc.id}`;
    root.innerHTML = `<div class="fade-in">
      <div class="det-head">${sportTile(t.name)}<div class="dh-txt"><div class="dh-name">${esc(t.name || "—")}</div>${t.datetime?`<div class="dh-meta">${esc(fmtDateTime(t.datetime))}</div>`:""}</div></div>
      ${renderPhases(t.exerciseTargets ?? t.exercise_targets ?? [])}
    </div>`;
    return;
  }

  if (sc.type === "target_created") {
    label.textContent = "Target Created";
    sub.textContent = "";
    root.innerHTML = `<div class="created-card fade-in">
      <div class="cc-label"><span class="cc-check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>Scheduled</div>
      <div class="cc-name">${esc(sc.name)}</div>
      <div class="cc-datetime">${esc(fmtDateTime(sc.datetime))}</div>
      <div class="cc-id">ID ${esc(sc.id)}</div>
    </div>`;
    return;
  }
}

function renderPhases(exercises) {
  if (!exercises.length) return `<div class="empty-state">No phase data.</div>`;
  let out = `<div class="phases-section">Phases</div>`;
  for (const ex of exercises) {
    for (const ph of (ex.phases ?? [])) {
      const ptype = ph.phaseType ?? ph.phase_type ?? ph.type ?? "PHASE";
      if (ptype === "REPEAT") {
        const work = (ph.phases ?? [])[0];
        const rec  = (ph.phases ?? [])[1];
        out += `<div class="phase-row">
          <div class="phase-type pt-repeat">Rep</div>
          <div class="phase-body">
            <span class="repeat-count">×${esc(ph.repeatCount ?? ph.repeat_count)}</span>
            ${work ? phaseStats(work, "Work") : ""}
            ${rec  ? phaseStats(rec,  "Rest") : ""}
          </div>
        </div>`;
      } else {
        const name = ph.name ?? ptype;
        const ln = name.toLowerCase();
        const isWarm = ln.includes("warm") || ln.includes("échauff") || ln.includes("echauff");
        const isCool = ln.includes("cool") || ln.includes("calme") || ln.includes("retour");
        const cls = isWarm ? "pt-warmup" : isCool ? "pt-cooldown" : "pt-work";
        out += `<div class="phase-row">
          <div class="phase-type ${cls}">${isWarm?"Warm":isCool?"Cool":"Work"}</div>
          <div class="phase-body">${phaseStats(ph, null)}</div>
        </div>`;
      }
    }
  }
  return out;
}

function phaseStats(p, label) {
  const stats = [];
  if (label) stats.push({v: label, l: "type"});
  const goal = fmtGoal(p); if (goal) stats.push({v: goal, l: "goal"});
  const zone = fmtZone(p); if (zone) stats.push({v: zone, l: "zone"});
  if (!stats.length) return "";
  return stats.map(s => `<div class="phase-stat"><div class="ps-val">${esc(s.v)}</div><div class="ps-lbl">${esc(s.l)}</div></div>`).join("");
}
</script>
</body>
</html>
