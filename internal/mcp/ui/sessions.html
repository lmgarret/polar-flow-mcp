<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Sessions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
body{padding:16px}

/* ── Header ── */
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.hdr-label{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e4002b}
.hdr-range{font-size:.72rem;color:#666;font-variant-numeric:tabular-nums}

/* ── Sport tile (shared) ── */
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile svg{width:24px;height:24px;fill:#fff}
.tile.sm{width:30px;height:30px;border-radius:9px}
.tile.sm svg{width:17px;height:17px}

/* ── Day-grouped list ── */
.day-group{margin-bottom:14px}
.day-head{font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;padding:0 2px 8px;border-bottom:1px solid #171717;margin-bottom:8px;font-variant-numeric:tabular-nums}
.sess-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:10px;cursor:pointer;transition:background .15s}
.sess-row:hover{background:#141414}
.sess-row.active{background:#160305}
.sr-main{flex:1;min-width:0}
.sr-name{font-size:.9rem;font-weight:700;color:#f0f0f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.sr-sub{display:flex;align-items:center;gap:7px;margin-top:3px}
.sr-time{font-size:.72rem;color:#666;font-variant-numeric:tabular-nums;font-family:'SF Mono','Fira Code',Consolas,monospace}
.chip{font-size:.56rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:#2a0409;color:#ff5566}
.sr-right{text-align:right;flex-shrink:0}
.sr-dur{font-size:1rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#f0f0f0;font-family:'SF Mono','Fira Code',Consolas,monospace}
.sr-dist{font-size:.7rem;color:#666;font-variant-numeric:tabular-nums;margin-top:2px;font-family:'SF Mono','Fira Code',Consolas,monospace}

/* ── Inline expand slot ── */
.slot{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .3s}
.slot.open{max-height:1200px;opacity:1;margin-top:8px}

/* ── Summary header (sport tile + name + date) ── */
.sum-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-txt{min-width:0}
.sh-name{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-date{font-size:.72rem;color:#666;margin-top:2px;font-variant-numeric:tabular-nums}
.sum-close{margin-left:auto;background:none;border:none;color:#555;cursor:pointer;font-size:1rem;padding:2px 6px;line-height:1;transition:color .15s;align-self:flex-start}
.sum-close:hover{color:#f0f0f0}

/* ── Red hero stat panel ── */
.hero{background:linear-gradient(140deg,#e4002b 0%,#c40023 100%);border-radius:16px;padding:20px 18px;display:grid;grid-template-columns:1fr 1fr;gap:22px 14px}
.hero-cell{color:#fff;min-width:0}
.hc-top{display:flex;align-items:center;justify-content:space-between;height:26px;margin-bottom:8px}
.hc-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.hc-badge{font-size:.55rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:rgba(0,0,0,.2);padding:2px 6px;border-radius:5px}
.hc-val{font-size:1.7rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-unit{font-size:.8rem;font-weight:700;margin-left:3px;opacity:.82}
.hc-lbl{font-size:.68rem;font-weight:600;opacity:.82;margin-top:6px}

/* ── HR zones ── */
.zones{margin-top:16px}
.zones-label{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;margin-bottom:9px}
.zone-bar{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.zb-label{font-size:.64rem;font-weight:800;width:18px;text-align:center;flex-shrink:0}
.zb-track{flex:1;height:7px;background:#1a1a1a;border-radius:4px;overflow:hidden}
.zb-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.zb-time{font-size:.64rem;font-variant-numeric:tabular-nums;color:#666;width:38px;text-align:right;flex-shrink:0;font-family:'SF Mono','Fira Code',Consolas,monospace}
.z1f{background:#5aa0d8}.z2f{background:#57c46b}.z3f{background:#e3bd2e}.z4f{background:#ee7326}.z5f{background:#e4002b}
.zb-label.zc1{color:#5aa0d8}.zb-label.zc2{color:#57c46b}.zb-label.zc3{color:#e3bd2e}.zb-label.zc4{color:#ee7326}.zb-label.zc5{color:#e4002b}

/* ── Laps table ── */
.laps-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:6px}
.laps-table th{text-align:right;font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4a4a4a;padding:0 6px 9px;border-bottom:1px solid #1e1e1e}
.laps-table th:first-child{text-align:left}
.laps-table td{text-align:right;padding:7px 6px;border-bottom:1px solid #141414;font-variant-numeric:tabular-nums;color:#ccc;font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:.74rem}
.laps-table td:first-child{text-align:left;color:#666}
.laps-table tr:last-child td{border-bottom:none}

/* ── States ── */
.loading{color:#4a4a4a;font-size:.8rem;font-style:italic;padding:20px 0}
.empty-state{color:#4a4a4a;font-size:.8rem;font-style:italic;padding:12px 0}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #2a2a2a;border-top-color:#e4002b;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-label" id="hdr-label">Training Log</span>
  <span class="hdr-range" id="hdr-range"></span>
</div>
<div id="root" class="loading">Loading…</div>

<script>
// ── RPC bridge ──────────────────────────────────────────
const pending = new Map(); let msgId = 0;
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && pending.has(m.id)) {
    const { resolve, reject } = pending.get(m.id); pending.delete(m.id);
    m.error ? reject(new Error(m.error?.message ?? "RPC error")) : resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") onToolResult(m.params?.structuredContent);
});
function rpc(method, params) {
  const id = ++msgId;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  });
}
rpc("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "polar-sessions-ui", version: "3.0" }, appCapabilities: { availableDisplayModes: ["inline"] } })
  .then(() => window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*"));

// ── Helpers ────────────────────────────────────────────
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function fmtDur(secs) {
  const s = Math.round(Number(secs) || 0);
  if (!s) return "—";
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  return `${m}:${String(sec).padStart(2,"0")}`;
}
function fmtDist(m) {
  const v = Number(m) || 0;
  if (!v) return "—";
  return v >= 1000 ? { n:(v/1000).toFixed(2), u:"km" } : { n:String(Math.round(v)), u:"m" };
}
function fmtDistFlat(m) {
  const d = fmtDist(m); return typeof d === "string" ? d : d.n + d.u;
}
function fmtPace(dist, secs) {
  if (!dist || !secs || dist < 100) return null;
  const secPer = (Number(secs) / Number(dist)) * 1000;
  const m = Math.floor(secPer/60), s = Math.round(secPer%60);
  return `${m}:${String(s).padStart(2,"0")}`;
}
function fmtDateLong(iso) {
  if (!iso) return "";
  const p = iso.slice(0,10).split("-");
  const d = new Date(iso.slice(0,10)+"T00:00:00");
  return `${WEEKDAYS[d.getDay()]} ${parseInt(p[2])} ${MONTHS_SHORT[parseInt(p[1])-1]} ${p[0]}`;
}
function fmtTime(iso) { return String(iso ?? "").slice(11,16); }

// Parse ISO-8601 duration ("PT35M23.512S") to seconds.
function isoDurToSecs(str) {
  const m = /^P(?:\d+D)?T(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?$/.exec(String(str ?? ""));
  if (!m) return 0;
  return (parseFloat(m[1])||0)*3600 + (parseFloat(m[2])||0)*60 + (parseFloat(m[3])||0);
}
// List items give integer **milliseconds**; the summary gives an ISO string.
function durToSecs(v) {
  if (v == null) return 0;
  if (typeof v === "string") return v.startsWith("P") ? isoDurToSecs(v) : (Number(v)||0)/1000;
  return Number(v) / 1000;
}
function firstExercise(s) {
  const ex = s?.exercises;
  if (!ex || typeof ex !== "object") return null;
  const k = Object.keys(ex)[0];
  return k ? ex[k] : null;
}
function sessionDate(s) {
  const raw = s.start_time ?? s.startDate ?? s.date_time ?? s.start ?? "";
  return String(raw).slice(0,10);
}

// Category arrives as sport_category (convert.SportCategory); the UI only
// maps it to a glyph, colour and label. Falls back to generic when absent
// (e.g. the raw session-details view).
function sportCat(s){ const c = s && s.sport_category; return (c && SPORT_GLYPHS[c]) ? c : "generic"; }
function sportInfo(s){ const c=sportCat(s); return {color:SPORT_COLORS[c], label:CAT_LABEL[c], cat:c}; }
function sportTile(s, small){ const c=sportCat(s); return `<div class="tile${small?" sm":""}" style="background:${SPORT_COLORS[c]}"><svg viewBox="0 0 24 24">${SPORT_GLYPHS[c]}</svg></div>`; }

function heroCell(icon, val, unit, label, badge) {
  return `<div class="hero-cell">
    <div class="hc-top"><span class="hc-icon"><svg viewBox="0 0 24 24">${METRIC_GLYPHS[icon] ?? ""}</svg></span>${badge?`<span class="hc-badge">${esc(badge)}</span>`:""}</div>
    <div class="hc-val">${esc(val)}${unit?`<span class="hc-unit">${esc(unit)}</span>`:""}</div>

// ── State ──────────────────────────────────────────────
let openRow = null;

// ── Tool result dispatch ───────────────────────────────
function onToolResult(sc) {
  if (!sc) return;
  if (sc.type === "session_list") renderDayList(sc);
  else if (sc.type === "session_summary") renderDirectSummary(sc);
  else if (sc.type === "session_details") renderDirectDetails(sc);
}

// ── Day-grouped list ───────────────────────────────────
function renderDayList(sc) {
  const sessions = sc.sessions ?? [];
  document.getElementById("hdr-label").textContent = "Training Log";
  document.getElementById("hdr-range").textContent = sessions.length ? `${sessions.length} session${sessions.length>1?"s":""}` : "";

  if (!sessions.length) {
    document.getElementById("root").className = "";
    document.getElementById("root").innerHTML = `<div class="empty-state">No sessions in this period.</div>`;
    return;
  }

  // Group by date, newest day first, newest session first within a day.
  const byDate = {};
  for (const s of sessions) { const d = sessionDate(s); if (d) (byDate[d] = byDate[d] ?? []).push(s); }
  const days = Object.keys(byDate).sort().reverse();

  window.__sessIndex = {}; // id → session, for click handlers
  let html = `<div class="fade-in">`;
  for (const day of days) {
    const items = byDate[day].sort((a,b) => String(b.start_time??"").localeCompare(String(a.start_time??"")));
    html += `<div class="day-group"><div class="day-head">${esc(fmtDateLong(day))}</div>`;
    for (const s of items) {
      const id = s.id ?? s.exercise_id;
      window.__sessIndex[id] = s;
      const info = sportInfo(s);
      const name = s.sport_name ?? s.sportName ?? info.label;
      const dur = s.session_duration_s ?? durToSecs(s.duration);
      const dist = s.distance_m ?? s.distance ?? 0;
      const phases = s.has_training_target ? `<span class="chip">Phases</span>` : "";
      html += `<div class="sess-row" id="row-${esc(id)}" onclick="toggleRow('${esc(id)}')">
        ${sportTile(s)}
        <div class="sr-main">
          <div class="sr-name">${esc(name)}</div>
          <div class="sr-sub"><span class="sr-time">${esc(fmtTime(s.start_time))}</span>${phases}</div>
        </div>
        <div class="sr-right">
          <div class="sr-dur">${esc(fmtDur(dur))}</div>
          ${dist ? `<div class="sr-dist">${esc(fmtDistFlat(dist))}</div>` : ""}
        </div>
      </div>
      <div class="slot" id="slot-${esc(id)}"></div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  const root = document.getElementById("root");
  root.className = "";
  root.innerHTML = html;
}

function toggleRow(id) {
  const row = document.getElementById("row-"+id);
  const slot = document.getElementById("slot-"+id);
  if (!slot) return;
  if (openRow === id) {
    slot.classList.remove("open"); slot.innerHTML = "";
    row.classList.remove("active"); openRow = null; return;
  }
  if (openRow) {
    const prev = document.getElementById("slot-"+openRow);
    if (prev) { prev.classList.remove("open"); prev.innerHTML = ""; }
    document.getElementById("row-"+openRow)?.classList.remove("active");
  }
  openRow = id;
  row.classList.add("active");
  slot.classList.add("open");
  fetchSummary(window.__sessIndex[id], slot);
}

async function fetchSummary(session, slot) {
  const id = session?.id ?? session?.exercise_id;
  if (!id) { slot.innerHTML = `<div class="empty-state">No session ID available.</div>`; return; }
  slot.innerHTML = `<div class="loading"><span class="spinner"></span>Loading…</div>`;
  try {
    const result = await rpc("tools/call", { name: "get_training_session_summary", arguments: { session_id: Number(id) } });
    const sc = result?.structuredContent;
    slot.innerHTML = summaryHTML(sc?.summary ?? sc?.data ?? sc, session, false);
  } catch (err) {
    slot.innerHTML = `<div class="empty-state">Could not load session: ${esc(err.message)}</div>`;
  }
}

// ── Summary → red hero panel ───────────────────────────
function summaryHTML(s, fallback, withHeader) {
  if (!s) return `<div class="empty-state">No data returned.</div>`;
  const ex = firstExercise(s);
  const hr = ex?.trainingStatistic?.HEART_RATE ?? {};
  const name = s.name ?? (s.trainingSessionName && s.trainingSessionName.trim() ? s.trainingSessionName : null)
    ?? fallback?.sport_name ?? fallback?.sportName ?? sportInfo(fallback ?? ex ?? s).label ?? "Session";
  const dateStr = sessionDate(s) || sessionDate(fallback ?? {}) || "";
  const dur = s.session_duration_s ?? fallback?.session_duration_s ?? durToSecs(s.duration ?? ex?.duration ?? fallback?.duration);
  const dist = s.distance_m ?? s.distance ?? ex?.distance ?? fallback?.distance_m ?? fallback?.distance ?? 0;
  const hrAvg = s.hr_avg ?? s.hrAverage ?? hr.avg ?? fallback?.hr_avg;
  const hrMax = s.hr_max ?? s.hrMax ?? hr.max;
  const kcal = s.calories ?? s.kiloCalories ?? ex?.calories ?? fallback?.calories;
  const load = s.training_load ?? s.trainingLoad;
  const pace = fmtPace(dist, dur);
  const distF = dist ? fmtDist(dist) : null;

  const cells = [];
  cells.push(heroCell("duration", fmtDur(dur), "", "Duration", null));
  if (distF) cells.push(heroCell("distance", distF.n, distF.u, "Distance", null));
  if (pace)  cells.push(heroCell("gauge", pace, "min/km", "Pace", "Avg"));
  if (hrAvg) cells.push(heroCell("heart", hrAvg, "bpm", "Heart Rate", "Avg"));
  if (hrMax) cells.push(heroCell("heart", hrMax, "bpm", "Heart Rate", "Max"));
  if (kcal)  cells.push(heroCell("flame", Math.round(kcal), "kcal", "Calories", null));
  if (load)  cells.push(heroCell("load", Math.round(load), "", "Training Load", null));

  const zones = s.heart_rate_zones ?? s.hr_zones ?? [];
  let zonesHTML = "";
  if (zones.length) {
    const maxZone = Math.max(...zones.map(z => Number(z.duration_in_seconds ?? z.in_zone ?? 0)), 1);
    zonesHTML = `<div class="zones"><div class="zones-label">Heart Rate Zones</div>${zones.map((z,i)=>{
      const t = Number(z.duration_in_seconds ?? z.in_zone ?? 0);
      const pct = Math.max(2, Math.round(t/maxZone*100));
      return `<div class="zone-bar"><span class="zb-label zc${i+1}">Z${i+1}</span><div class="zb-track"><div class="zb-fill z${i+1}f" style="width:${pct}%"></div></div><span class="zb-time">${fmtDur(t)}</span></div>`;
    }).join("")}</div>`;
  }

  const header = withHeader ? `<div class="sum-head">
      ${sportTile(fallback ?? ex ?? s)}
      <div class="sh-txt"><div class="sh-name">${esc(name)}</div>${dateStr?`<div class="sh-date">${esc(fmtDateLong(dateStr))}</div>`:""}</div>
    </div>` : "";

  return `<div class="fade-in">${header}<div class="hero">${cells.join("")}</div>${zonesHTML}</div>`;
}

// ── Direct summary (single tool call, no list) ─────────
function renderDirectSummary(sc) {
  document.getElementById("hdr-label").textContent = "Session Summary";
  document.getElementById("hdr-range").textContent = "";
  const root = document.getElementById("root");
  root.className = "";
  root.innerHTML = summaryHTML(sc.summary ?? sc.data ?? sc, null, true);
}

// ── Direct details (laps) ──────────────────────────────
function renderDirectDetails(sc) {
  document.getElementById("hdr-label").textContent = "Session Details";
  document.getElementById("hdr-range").textContent = "";
  const det = sc.details ?? {};
  const exObj = det.exercises ?? {};
  const ex = exObj[Object.keys(exObj)[0]] ?? null;

  const zonesObj = det.zones ?? {};
  let hrZones = [];
  for (const k of Object.keys(zonesObj)) { const hr = zonesObj[k]?.HEART_RATE; if (hr?.length) { hrZones = hr; break; } }

  const lapsObj = det.laps ?? {};
  let laps = [];
  for (const k of Object.keys(lapsObj)) {
    const block = lapsObj[k] || {};
    const arr = (block.automaticLaps?.length ? block.automaticLaps : block.manualLaps) ?? [];
    laps = laps.concat(arr);
  }

  const hrStat = ex?.trainingStatistic?.HEART_RATE ?? {};
  const dur = durToSecs(ex?.duration);
  const dist = ex?.distance ?? 0;
  const pace = fmtPace(dist, dur);
  const distF = dist ? fmtDist(dist) : null;
  const cells = [];
  if (dur) cells.push(heroCell("duration", fmtDur(dur), "", "Duration", null));
  if (distF) cells.push(heroCell("distance", distF.n, distF.u, "Distance", null));
  if (pace) cells.push(heroCell("gauge", pace, "min/km", "Pace", "Avg"));
  if (hrStat.avg) cells.push(heroCell("heart", hrStat.avg, "bpm", "Heart Rate", "Avg"));
  if (hrStat.max) cells.push(heroCell("heart", hrStat.max, "bpm", "Heart Rate", "Max"));
  if (ex?.calories) cells.push(heroCell("flame", Math.round(ex.calories), "kcal", "Calories", null));

  const maxZ = Math.max(...hrZones.map(z => isoDurToSecs(z.inZone)), 1);
  const zonesHTML = hrZones.length ? `<div class="zones"><div class="zones-label">Heart Rate Zones</div>${hrZones.map((z,i)=>{
    const t = isoDurToSecs(z.inZone);
    const idx = Math.min(5, Math.max(1, Number(z.zoneIndex || i+1)));
    const pct = Math.max(2, Math.round(t/maxZ*100));
    return `<div class="zone-bar"><span class="zb-label zc${idx}">Z${idx}</span><div class="zb-track"><div class="zb-fill z${idx}f" style="width:${pct}%"></div></div><span class="zb-time">${fmtDur(t)}</span></div>`;
  }).join("")}</div>` : "";

  const lapsHTML = laps.length ? `<div class="zones-label" style="margin-top:18px">Laps</div>
    <table class="laps-table"><thead><tr><th>Lap</th><th>Time</th><th>Dist</th><th>Avg HR</th><th>Max HR</th></tr></thead>
    <tbody>${laps.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(fmtDur(durToSecs(l.duration)))}</td><td>${esc(fmtDistFlat(l.distance??0))}</td><td>${esc(l.heartRate?.average??l.hrAvg??"—")}</td><td>${esc(l.heartRate?.maximum??l.hrMax??"—")}</td></tr>`).join("")}</tbody></table>` : "";

  const root = document.getElementById("root");
  root.className = "";
  if (!cells.length && !zonesHTML && !lapsHTML) { root.innerHTML = `<div class="empty-state">No detailed data available.</div>`; return; }
  const nm = ex?.sportParent ? ex.sportParent.charAt(0)+ex.sportParent.slice(1).toLowerCase() : sportInfo(ex ?? {}).label;
  root.innerHTML = `<div class="fade-in">
    <div class="sum-head">${sportTile(ex ?? {})}<div class="sh-txt"><div class="sh-name">${esc(nm)}</div></div></div>
    ${cells.length ? `<div class="hero">${cells.join("")}</div>` : ""}
    ${zonesHTML}${lapsHTML}
  </div>`;
}
</script>
