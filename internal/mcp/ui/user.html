<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Info</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
body{padding:12px 14px;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.hdr-label{display:none}
.card{display:flex;align-items:center;gap:16px;background:#111;border:1px solid #1c1c1c;border-radius:14px;padding:13px 18px}
.avatar{width:48px;height:48px;border-radius:14px;background:linear-gradient(140deg,#e4002b,#c40023);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.03em}
.who{min-width:0}
.profile-name{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-email{font-size:.74rem;color:#666;font-family:'SF Mono','Fira Code',Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fields{display:flex;gap:10px;margin-left:auto;flex-shrink:0}
.chip{background:#161616;border:1px solid #1e1e1e;border-radius:10px;padding:7px 14px}
.pf-key{font-size:.56rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4a4a4a;display:block;margin-bottom:3px}
.pf-val{font-size:.84rem;color:#ddd;font-family:'SF Mono','Fira Code',Consolas,monospace}
.loading{color:#4a4a4a;font-size:.8rem;font-style:italic}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Portrait / narrow (mobile iframe) ── */
@media (max-width:520px){
  body{display:block;min-height:0}
  /* Chips drop to a full-width row below the name instead of being pinned right */
  .card{flex-wrap:wrap}
  .fields{margin-left:0;width:100%}
  .chip{flex:1 1 auto}
}
</style>
</head>
<body>
<span class="hdr-label">Polar Account</span>
<div id="root" class="loading">Loading…</div>
<script>
const pending = new Map(); let msgId = 0;
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && pending.has(m.id)) {
    const {resolve,reject} = pending.get(m.id); pending.delete(m.id);
    m.error ? reject(new Error(m.error?.message ?? "RPC error")) : resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") render(extractPayload(m.params));
});
function rpc(method, params) {
  const id = ++msgId;
  return new Promise((resolve,reject) => { pending.set(id,{resolve,reject}); window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*"); });
}
// Current MCP-app hosts (Claude Desktop, 2026-07) drop structuredContent from
// the tool-result they forward to the iframe, so the data is read from the
// tagged {"type":...} JSON text block the server also emits. structuredContent
// is still preferred for hosts that honour it.
function extractPayload(params) {
  if (params && params.structuredContent) return params.structuredContent;
  const content = (params && params.content) || [];
  for (let i = content.length - 1; i >= 0; i--) {
    const c = content[i];
    if (c && c.type === "text" && typeof c.text === "string" && c.text.trim()[0] === "{") {
      try { const p = JSON.parse(c.text); if (p && typeof p.type === "string") return p; } catch (_) {}
    }
  }
  return null;
}
rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"polar-user-ui",version:"3.0"},appCapabilities:{availableDisplayModes:["inline"]}})
  .then(()=>window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*"));

const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function render(sc) {
  if (!sc || sc.type !== "user_info") return;
  const d = sc.data ?? sc;
  const firstName = d.first_name ?? "", lastName = d.last_name ?? "";
  const name = [firstName, lastName].filter(Boolean).join(" ") || d.email?.split("@")[0] || "Athlete";
  const initials = [firstName[0], lastName[0]].filter(Boolean).join("").toUpperCase() || name[0]?.toUpperCase() || "A";
  const fields = [
    d.country ? {k:"Country", v: d.country} : null,
    {k:"Account ID", v: String(d.id ?? "—")},
  ].filter(Boolean);
  document.getElementById("root").className = "";
  document.getElementById("root").innerHTML = `<div class="card fade-in">
    <div class="avatar">${esc(initials)}</div>
    <div class="who">
      <div class="profile-name">${esc(name)}</div>
      <div class="profile-email">${esc(d.email ?? "")}</div>
    </div>
    <div class="fields">${fields.map(f=>`
      <div class="chip"><span class="pf-key">${esc(f.k)}</span><span class="pf-val">${esc(f.v)}</span></div>`).join("")}
    </div>
  </div>`;
}
</script>
</body>
</html>
