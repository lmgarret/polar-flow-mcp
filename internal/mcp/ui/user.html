<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Info</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
body{padding:16px}
.hdr-label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#d9232e;margin-bottom:16px;display:block}
.profile-card{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:20px;max-width:320px}
.avatar{width:44px;height:44px;border-radius:50%;background:#1e0606;border:2px solid #d9232e;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#d9232e;margin-bottom:14px;letter-spacing:-.02em}
.profile-name{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.profile-email{font-size:.78rem;color:#555;margin-bottom:14px;font-family:'SF Mono','Fira Code',Consolas,monospace}
.profile-fields{display:flex;flex-direction:column;gap:6px;border-top:1px solid #1a1a1a;padding-top:12px}
.pf-row{display:flex;justify-content:space-between;align-items:baseline}
.pf-key{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#444}
.pf-val{font-size:.78rem;color:#aaa;font-family:'SF Mono','Fira Code',Consolas,monospace}
.loading{color:#444;font-size:.8rem;font-style:italic}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<span class="hdr-label">Polar Account</span>
<div id="root" class="loading">Loading…</div>
<script>
const pending = new Map(); let msgId = 0;
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && pending.has(m.id)) {
    const {resolve,reject} = pending.get(m.id); pending.delete(m.id);
    m.error ? reject(new Error(m.error?.message ?? "RPC error")) : resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent);
});
function rpc(method, params) {
  const id = ++msgId;
  return new Promise((resolve,reject) => { pending.set(id,{resolve,reject}); window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*"); });
}
rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"polar-user-ui",version:"2.0"},appCapabilities:{availableDisplayModes:["inline"]}})
  .then(()=>window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*"));

const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function render(sc) {
  if (!sc || sc.type !== "user_info") return;
  const d = sc.data ?? sc;
  const firstName = d.first_name ?? "", lastName = d.last_name ?? "";
  const name = [firstName, lastName].filter(Boolean).join(" ") || d.email?.split("@")[0] || "Athlete";
  const initials = [firstName[0], lastName[0]].filter(Boolean).join("").toUpperCase() || name[0]?.toUpperCase() || "A";
  const fields = [
    d.country ? {k:"Country", v: d.country} : null,
    {k:"Account ID", v: String(d.id ?? "—")},
  ].filter(Boolean);
  document.getElementById("root").innerHTML = `<div class="profile-card fade-in">
    <div class="avatar">${esc(initials)}</div>
    <div class="profile-name">${esc(name)}</div>
    <div class="profile-email">${esc(d.email ?? "")}</div>
    <div class="profile-fields">${fields.map(f=>`
      <div class="pf-row">
        <span class="pf-key">${esc(f.k)}</span>
        <span class="pf-val">${esc(f.v)}</span>
      </div>`).join("")}
    </div>
  </div>`;
}
</script>
</body>
</html>
