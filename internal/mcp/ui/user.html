<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Info</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
body{padding:16px}
.hdr-label{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e4002b;margin-bottom:16px;display:block}
.profile-card{background:#111;border:1px solid #1c1c1c;border-radius:16px;padding:22px;max-width:340px}
.avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(140deg,#e4002b,#c40023);display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:800;color:#fff;margin-bottom:16px;letter-spacing:-.03em}
.profile-name{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
.profile-email{font-size:.78rem;color:#666;margin-bottom:16px;font-family:'SF Mono','Fira Code',Consolas,monospace}
.profile-fields{display:flex;flex-direction:column;gap:2px;border-top:1px solid #1a1a1a;padding-top:6px}
.pf-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid #151515}
.pf-row:last-child{border-bottom:none}
.pf-key{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4a4a4a}
.pf-val{font-size:.82rem;color:#ccc;font-family:'SF Mono','Fira Code',Consolas,monospace}
.loading{color:#4a4a4a;font-size:.8rem;font-style:italic}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<span class="hdr-label">Polar Account</span>
<div id="root" class="loading">Loading…</div>
<script>
const pending = new Map(); let msgId = 0;
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && pending.has(m.id)) {
    const {resolve,reject} = pending.get(m.id); pending.delete(m.id);
    m.error ? reject(new Error(m.error?.message ?? "RPC error")) : resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent);
});
function rpc(method, params) {
  const id = ++msgId;
  return new Promise((resolve,reject) => { pending.set(id,{resolve,reject}); window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*"); });
}
rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"polar-user-ui",version:"3.0"},appCapabilities:{availableDisplayModes:["inline"]}})
  .then(()=>window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*"));

const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function render(sc) {
  if (!sc || sc.type !== "user_info") return;
  const d = sc.data ?? sc;
  const firstName = d.first_name ?? "", lastName = d.last_name ?? "";
  const name = [firstName, lastName].filter(Boolean).join(" ") || d.email?.split("@")[0] || "Athlete";
  const initials = [firstName[0], lastName[0]].filter(Boolean).join("").toUpperCase() || name[0]?.toUpperCase() || "A";
  const fields = [
    d.country ? {k:"Country", v: d.country} : null,
    {k:"Account ID", v: String(d.id ?? "—")},
  ].filter(Boolean);
  document.getElementById("root").className = "";
  document.getElementById("root").innerHTML = `<div class="profile-card fade-in">
    <div class="avatar">${esc(initials)}</div>
    <div class="profile-name">${esc(name)}</div>
    <div class="profile-email">${esc(d.email ?? "")}</div>
    <div class="profile-fields">${fields.map(f=>`
      <div class="pf-row"><span class="pf-key">${esc(f.k)}</span><span class="pf-val">${esc(f.v)}</span></div>`).join("")}
    </div>
  </div>`;
}
</script>
</body>
</html>
