<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
body{padding:16px}
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.hdr-label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#d9232e}
.hdr-sub{font-size:.72rem;color:#555}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.stat-box{background:#111;border:1px solid #1a1a1a;border-radius:7px;padding:12px 10px 10px}
.stat-val{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-family:'SF Mono','Fira Code',Consolas,monospace;color:#f0f0f0}
.stat-lbl{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#444;margin-top:4px}
.section-label{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#444;margin:14px 0 8px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.br-label{font-size:.75rem;color:#888;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.br-track{flex:1;height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden}
.br-fill{height:100%;border-radius:3px;min-width:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.br-fill-a{background:#d9232e}
.br-fill-b{background:#4a90d9}
.br-val{font-size:.7rem;color:#444;min-width:48px;text-align:right;font-variant-numeric:tabular-nums;font-family:'SF Mono','Fira Code',Consolas,monospace;flex-shrink:0}
.zone-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.zone-pill{border-radius:4px;padding:5px 10px;font-size:.72rem;font-weight:700;color:#fff;text-align:center;font-variant-numeric:tabular-nums;font-family:'SF Mono','Fira Code',Consolas,monospace}
.z1p{background:#1a3a4a;color:#60a0d0}.z2p{background:#1a3a1a;color:#60c060}.z3p{background:#3a3210;color:#d4b420}.z4p{background:#3a2010;color:#e06020}.z5p{background:#2a0d0d;color:#d9232e}
.empty-state{color:#444;font-size:.8rem;font-style:italic;padding:12px 0}
.loading{color:#444;font-size:.8rem;font-style:italic}
.fade-in{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hdr"><span class="hdr-label">Training Progress</span><span class="hdr-sub" id="hdr-sub"></span></div>
<div id="root" class="loading">Loading…</div>
<script>
const pending = new Map(); let msgId = 0;
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && pending.has(m.id)) {
    const {resolve,reject} = pending.get(m.id); pending.delete(m.id);
    m.error ? reject(new Error(m.error?.message ?? "RPC error")) : resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent);
});
function rpc(method, params) {
  const id = ++msgId;
  return new Promise((resolve,reject) => { pending.set(id,{resolve,reject}); window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*"); });
}
rpc("ui/initialize",{clientInfo:{name:"polar-progress-ui",version:"2.0"},appCapabilities:{}})
  .then(()=>window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*"));

const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function fmtDur(secs) {
  const s=Math.round(Number(secs)||0); if(!s) return "0m";
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h>0 ? `${h}h` : `${m}m`;
}
function fmtDist(m) {
  const v=Number(m)||0; if(!v) return "—";
  return v>=1000 ? (v/1000).toFixed(0)+"km" : v+"m";
}
function barList(items, cls) {
  if (!items?.length) return "";
  const max = Math.max(...items.map(i=>Number(i.value??i.duration??i.count??0)),1);
  return items.map(item => {
    const val = Number(item.value??item.duration??item.count??0);
    const pct = Math.max(2, Math.round(val/max*100));
    const lbl = item.sport_name??item.name??item.label??item.benefit??"—";
    const isSeconds = item.unit==="SECONDS" || item.duration;
    const valStr = isSeconds ? fmtDur(val) : item.unit==="METERS" ? fmtDist(val) : String(val);
    return `<div class="bar-row">
      <span class="br-label">${esc(lbl)}</span>
      <div class="br-track"><div class="br-fill ${cls}" style="width:${pct}%"></div></div>
      <span class="br-val">${esc(valStr)}</span>
    </div>`;
  }).join("");
}

function render(sc) {
  if (!sc || sc.type !== "progress_summary") return;
  const d = sc.data ?? {};
  document.getElementById("hdr-sub").textContent = [d.from_date, d.to_date].filter(Boolean).join(" → ");

  const sessions = d.number_of_sessions ?? d.sessions ?? 0;
  const dur  = d.total_duration_s ?? d.duration ?? 0;
  const dist = d.total_distance_m ?? d.distance ?? 0;
  const kcal = d.total_kcal ?? d.calories ?? 0;
  const avgHR = d.average_heart_rate ?? 0;

  const statBoxes = [
    {v: String(sessions), l: "Sessions"},
    dur  ? {v: fmtDur(dur),  l: "Total Time"} : null,
    dist ? {v: fmtDist(dist), l: "Distance"}  : null,
    kcal ? {v: String(kcal), l: "Calories"}   : null,
    avgHR ? {v: avgHR+" bpm", l: "Avg HR"}    : null,
  ].filter(Boolean);

  const sports   = d.sport_breakdown ?? d.sports ?? d.activity_breakdown ?? [];
  const zones    = d.heart_rate_zones ?? d.hr_zones ?? d.zone_breakdown ?? [];
  const benefits = d.training_benefit_breakdown ?? d.benefits ?? [];

  const zonesHTML = zones.length ? `
    <div class="section-label">Heart Rate Zones</div>
    <div class="zone-row">${zones.map((z,i)=>{
      const t=Number(z.duration_in_seconds??z.duration??z.in_zone??0);
      return `<div class="zone-pill z${i+1}p">Z${i+1}<br>${fmtDur(t)}</div>`;
    }).join("")}</div>` : "";

  document.getElementById("root").innerHTML = `<div class="fade-in">
    <div class="stats-grid">${statBoxes.map(s=>`
      <div class="stat-box"><div class="stat-val">${esc(s.v)}</div><div class="stat-lbl">${esc(s.l)}</div></div>`).join("")}
    </div>
    ${sports.length   ? `<div class="section-label">By Sport</div>${barList(sports,"br-fill-a")}` : ""}
    ${zonesHTML}
    ${benefits.length ? `<div class="section-label">Training Benefits</div>${barList(benefits,"br-fill-b")}` : ""}
  </div>`;
}
</script>
</body>
</html>
