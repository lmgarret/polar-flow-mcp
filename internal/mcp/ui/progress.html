<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
body{padding:16px}
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.hdr-label{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e4002b}
.hdr-sub{font-size:.72rem;color:#666;font-variant-numeric:tabular-nums}

/* Red hero panel */
.hero{background:linear-gradient(140deg,#e4002b 0%,#c40023 100%);border-radius:16px;padding:20px 18px;display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;margin-bottom:18px}
.hero-cell{color:#fff;min-width:0}
.hc-top{height:26px;margin-bottom:8px;display:flex;align-items:center}
.hc-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.hc-val{font-size:1.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-unit{font-size:.8rem;font-weight:700;margin-left:3px;opacity:.82}
.hc-lbl{font-size:.68rem;font-weight:600;opacity:.82;margin-top:6px}

.section-label{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;margin:16px 0 9px}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.br-tile{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.br-label{font-size:.76rem;color:#aaa;min-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.br-track{flex:1;height:7px;background:#181818;border-radius:4px;overflow:hidden}
.br-fill{height:100%;border-radius:4px;min-width:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.br-val{font-size:.7rem;color:#666;min-width:50px;text-align:right;font-variant-numeric:tabular-nums;font-family:'SF Mono','Fira Code',Consolas,monospace;flex-shrink:0}
.empty-state{color:#4a4a4a;font-size:.8rem;font-style:italic;padding:12px 0}
.loading{color:#4a4a4a;font-size:.8rem;font-style:italic}
.fade-in{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="hdr"><span class="hdr-label">Training Progress</span><span class="hdr-sub" id="hdr-sub"></span></div>
<div id="root" class="loading">Loading…</div>
<script>
const pending = new Map(); let msgId = 0;
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && pending.has(m.id)) {
    const {resolve,reject} = pending.get(m.id); pending.delete(m.id);
    m.error ? reject(new Error(m.error?.message ?? "RPC error")) : resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent);
});
function rpc(method, params) {
  const id = ++msgId;
  return new Promise((resolve,reject) => { pending.set(id,{resolve,reject}); window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*"); });
}
rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"polar-progress-ui",version:"3.0"},appCapabilities:{availableDisplayModes:["inline"]}})
  .then(()=>window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*"));

const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function fmtDurH(secs) { const s=Math.round(Number(secs)||0); if(!s) return {n:"0",u:"m"}; const h=Math.floor(s/3600), m=Math.floor((s%3600)/60); return h>0?{n:String(h),u:"h"}:{n:String(m),u:"m"}; }
function fmtDurShort(secs){ const d=fmtDurH(secs); return d.n+d.u; }
function fmtDistKm(m){ const v=Number(m)||0; if(!v) return {n:"0",u:"km"}; return v>=1000?{n:(v/1000).toFixed(1),u:"km"}:{n:String(Math.round(v)),u:"m"}; }
function fmtDistFlat(m){ const d=fmtDistKm(m); return d.n+d.u; }
function prettyLabel(s){ return String(s ?? "—").toLowerCase().replace(/_/g," ").replace(/\b\w/g, c=>c.toUpperCase()); }

// Sport → color (shared vocabulary with sessions.html)
function sportColor(name){
  const n = String(name??"").toLowerCase();
  if(n.includes("run")||n.includes("course")||n.includes("footing")) return "#e4002b";
  if(n.includes("cycl")||n.includes("bik")||n.includes("velo")||n.includes("vélo")||n.includes("ride")) return "#f77f00";
  if(n.includes("swim")||n.includes("natation")) return "#0099cc";
  if(n.includes("hik")||n.includes("rando")||n.includes("walk")||n.includes("marche")) return "#57a05a";
  if(n.includes("gym")||n.includes("strength")||n.includes("muscu")||n.includes("renfor")) return "#8a8a8a";
  if(n.includes("ski")||n.includes("nordic")) return "#00b4d8";
  return "#e4002b";
}

const METRIC_GLYPHS = {
  count:'<path d="M3 5h.01" /><path d="M3 12h.01" /><path d="M3 19h.01" /><path d="M8 5h13" /><path d="M8 12h13" /><path d="M8 19h13" />',
  duration:'<line x1="10" x2="14" y1="2" y2="2" /><line x1="12" x2="15" y1="14" y2="11" /><circle cx="12" cy="14" r="8" />',
  distance:'<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z" /><path d="m14.5 12.5 2-2" /><path d="m11.5 9.5 2-2" /><path d="m8.5 6.5 2-2" /><path d="m17.5 15.5 2-2" />',
  flame:'<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" />',
  ascent:'<path d="m8 3 4 8 5-5 5 15H2L8 3z" />',
};
function heroCell(icon, val, unit, label) {
  return `<div class="hero-cell">
    <div class="hc-top"><span class="hc-icon"><svg viewBox="0 0 24 24">${METRIC_GLYPHS[icon]??""}</svg></span></div>
    <div class="hc-val">${esc(val)}${unit?`<span class="hc-unit">${esc(unit)}</span>`:""}</div>
    <div class="hc-lbl">${esc(label)}</div>
  </div>`;
}

// items: [{label, value, color?}]. `fmt` renders the numeric value.
function barList(items, fixedColor, fmt) {
  if (!items?.length) return "";
  const max = Math.max(...items.map(i=>Number(i.value)||0), 1);
  return items.map(item => {
    const val = Number(item.value) || 0;
    const pct = Math.max(2, Math.round(val/max*100));
    const color = item.color ?? fixedColor;
    return `<div class="bar-row">
      <span class="br-tile" style="background:${color}"></span>
      <span class="br-label">${esc(item.label)}</span>
      <div class="br-track"><div class="br-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="br-val">${esc(fmt(val))}</span>
    </div>`;
  }).join("");
}

function render(sc) {
  if (!sc || sc.type !== "progress_summary") return;
  const d = sc.data ?? {};
  document.getElementById("hdr-sub").textContent = [d.from_date ?? d.from, d.to_date ?? d.to].filter(Boolean).join(" → ");

  const sessions = d.number_of_sessions ?? d.totalTrainingSessionCount ?? 0;
  const durS = d.total_duration_s ?? (d.totalDuration ? (Number(d.totalDuration.millis)/1000 || Number(d.totalDuration.standardSeconds) || 0) : 0);
  const dist = d.total_distance_m ?? d.totalDistance ?? 0;
  const kcal = d.total_kcal ?? d.totalCalories ?? 0;
  const ascent = d.total_ascent_m ?? d.totalAscent ?? 0;

  const durH = fmtDurH(durS), distK = fmtDistKm(dist);
  const cells = [heroCell("count", String(sessions), "", "Sessions")];
  if (durS) cells.push(heroCell("duration", durH.n, durH.u, "Total Time"));
  if (dist) cells.push(heroCell("distance", distK.n, distK.u, "Distance"));
  if (kcal) cells.push(heroCell("flame", Math.round(kcal), "kcal", "Calories"));
  if (ascent) cells.push(heroCell("ascent", Math.round(ascent), "m", "Ascent"));

  const sd = d.sport_breakdown ?? d.sportDistributions ?? {};
  const sportSrc = sd.distance?.length ? sd.distance : (sd.duration ?? []);
  const sportIsDist = !!sd.distance?.length;
  const sports = sportSrc.map(x => { const label = x.sportName ?? x.nameForChart ?? "—"; return { label, value: Number(x.valueForChart)||0, color: sportColor(label) }; });

  const benefits = (d.training_benefit_breakdown ?? d.trainingBenefitDistributionList ?? []).map(x => ({
    label: prettyLabel(x.nameForChart ?? x.trainingBenefit), value: Number(x.trainingBenefitTotal)||0,
  }));

  document.getElementById("root").className = "";
  document.getElementById("root").innerHTML = `<div class="fade-in">
    <div class="hero">${cells.join("")}</div>
    ${sports.length   ? `<div class="section-label">By Sport</div>${barList(sports, "#e4002b", sportIsDist ? fmtDistFlat : v=>fmtDurShort(v/1000))}` : ""}
    ${benefits.length ? `<div class="section-label">Training Benefits</div>${barList(benefits, "#4a90d9", v=>fmtDurShort(v/1000))}` : ""}
  </div>`;
}
</script>
</body>
</html>
