<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
body{padding:12px 14px;overflow-x:hidden}
.hdr{display:none}
.hdr-label{font-size:.64rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e4002b}
.hdr-sub{font-size:.68rem;color:#666;font-variant-numeric:tabular-nums}

/* Red hero panel — single horizontal row of stat cells */
.hero{background:linear-gradient(140deg,#e4002b 0%,#c40023 100%);border-radius:14px;padding:11px 6px;display:flex;justify-content:space-around;gap:6px}
.hero-cell{color:#fff;min-width:0;flex:1;text-align:center;padding:0 6px}
.hero-cell + .hero-cell{border-left:1px solid rgba(255,255,255,.18)}
.hc-top{margin-bottom:5px;display:flex;justify-content:center}
.hc-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.hc-val{font-size:1.35rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap}
.hc-unit{font-size:.72rem;font-weight:700;margin-left:2px;opacity:.82}
.hc-lbl{font-size:.6rem;font-weight:600;opacity:.82;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* By-sport breakdown — horizontal chip strip */
.sport-strip{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:3px}
.sp-chip{display:flex;align-items:center;gap:7px;background:#141414;border:1px solid #1e1e1e;border-radius:9px;padding:6px 11px;flex-shrink:0}
.sp-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.sp-name{font-size:.72rem;color:#ccc;white-space:nowrap}
.sp-val{font-size:.72rem;color:#777;font-variant-numeric:tabular-nums;font-family:'SF Mono','Fira Code',Consolas,monospace}
.strip-lbl{font-size:.56rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4a4a4a;align-self:center;flex-shrink:0;margin-right:2px}
.sport-strip{scrollbar-width:thin;scrollbar-color:#3a3a3a #161616}
::-webkit-scrollbar{height:9px}::-webkit-scrollbar-track{background:#161616;border-radius:5px}::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px}::-webkit-scrollbar-thumb:hover{background:#4a4a4a}
.empty-state{color:#4a4a4a;font-size:.8rem;font-style:italic;padding:12px 0}
.loading{color:#4a4a4a;font-size:.8rem;font-style:italic}
.fade-in{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Portrait / narrow (mobile iframe) ── */
@media (max-width:520px){
  body{display:block;min-height:0}
  /* Hero cells wrap to 2+ rows instead of being crushed into one */
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));row-gap:11px}
  .hero-cell+.hero-cell{border-left:none}
  /* By-sport chips wrap instead of scrolling sideways */
  .sport-strip{flex-wrap:wrap;overflow-x:visible}
}
/* Notice card — rejections, "nothing to show" statements, cancellations */
.notice{display:flex;gap:12px;align-items:flex-start;background:#111;border:1px solid #1c1c1c;border-left:3px solid var(--nc);border-radius:12px;padding:12px 14px;animation:fadeIn .22s ease}
.notice-ico{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--nbg)}
.notice-ico svg{width:15px;height:15px;stroke:var(--nc);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.notice-body{min-width:0}
.notice-kind{font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--nc);margin-bottom:3px}
.notice-msg{font-size:.8rem;line-height:1.4;color:#d0d0d0;white-space:pre-wrap;overflow-wrap:anywhere}
.notice-error{--nc:#ff5566;--nbg:#2a0409}
.notice-notice{--nc:#5aa0d8;--nbg:#0d2d42}
.notice-cancelled{--nc:#8a8a8a;--nbg:#1c1c1c}
</style>
</head>
<body>
<div class="hdr"><span class="hdr-label">Training Progress</span><span class="hdr-sub" id="hdr-sub"></span></div>
<div id="root" class="loading">Loading…</div>
<script>
const pending = new Map(); let msgId = 0;
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && pending.has(m.id)) {
    const {resolve,reject} = pending.get(m.id); pending.delete(m.id);
    m.error ? reject(new Error(m.error?.message ?? "RPC error")) : resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") dispatch(m.params, render);
  else if (m.method === "ui/notifications/tool-cancelled") { gotResult = true; renderNotice("cancelled", "The tool call was cancelled."); }
});
function rpc(method, params) {
  const id = ++msgId;
  return new Promise((resolve,reject) => { pending.set(id,{resolve,reject}); window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*"); });
}
// Current MCP-app hosts (Claude Desktop, 2026-07) drop structuredContent from
// the forwarded tool-result, so read the tagged {"type":...} JSON text block the
// server also emits. structuredContent is still preferred when the host sends it.
function extractPayload(params) {
  if (params && params.structuredContent) return params.structuredContent;
  const content = (params && params.content) || [];
  for (let i = content.length - 1; i >= 0; i--) {
    const c = content[i];
    if (c && c.type === "text" && typeof c.text === "string" && c.text.trim()[0] === "{") {
      try { const p = JSON.parse(c.text); if (p && typeof p.type === "string") return p; } catch (_) {}
    }
  }
  return null;
}
// ── Notices ────────────────────────────────────────────
// A tool call that has no data to show — a rejected argument, "No target with
// id 7.", a declined confirmation — used to leave this app on "Loading…".
// Every result now renders: data payloads go to the view, everything else to a
// notice card. Error results carry no payload (only text), plain statements get
// a {"type":"notice"} payload from the server, and a host that drops
// structuredContent still leaves the text block to read.
const NOTICE_META = {
  error:     {label: "Rejected",        icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/>'},
  notice:    {label: "Nothing to show", icon: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.5h.01"/>'},
  cancelled: {label: "Cancelled",       icon: '<circle cx="12" cy="12" r="9"/><path d="m8.5 8.5 7 7"/><path d="m15.5 8.5-7 7"/>'},
};
function resultText(params) {
  const c = ((params && params.content) || []).find(c => c && c.type === "text" && typeof c.text === "string");
  return c ? c.text : "";
}
function noticeHTML(kind, message) {
  const m = NOTICE_META[kind] ?? NOTICE_META.notice;
  const e = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return `<div class="notice notice-${kind in NOTICE_META ? kind : "notice"}" role="status">
    <div class="notice-ico"><svg viewBox="0 0 24 24">${m.icon}</svg></div>
    <div class="notice-body"><div class="notice-kind">${m.label}</div><div class="notice-msg">${e(message || "No data to display.")}</div></div>
  </div>`;
}
function renderNotice(kind, message) {
  const root = document.getElementById("root");
  root.className = "";
  root.innerHTML = noticeHTML(kind, message);
}
// noticeFor returns the notice a tool result should show instead of the view,
// or null when it carries a data payload for the view.
function noticeFor(params) {
  if (params && params.isError) return {kind: "error", message: resultText(params)};
  const p = extractPayload(params);
  if (p && p.type === "notice") return {kind: p.kind ?? "notice", message: p.message ?? resultText(params)};
  if (!p) return {kind: "notice", message: resultText(params)};
  return null;
}
let gotResult = false;
function dispatch(params, view) {
  gotResult = true;
  const n = noticeFor(params);
  if (n) renderNotice(n.kind, n.message);
  else view(extractPayload(params));
}
// Nothing arrived (host never forwarded the result): say so instead of a
// spinner forever. A late result still replaces this.
setTimeout(() => { if (!gotResult) renderNotice("notice", "No data received from the tool yet."); }, 20000);
rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"polar-progress-ui",version:"3.0"},appCapabilities:{availableDisplayModes:["inline"]}})
  .then(()=>window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*"));

const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function fmtDurH(secs) { const s=Math.round(Number(secs)||0); if(!s) return {n:"0",u:"m"}; const h=Math.floor(s/3600), m=Math.floor((s%3600)/60); return h>0?{n:String(h),u:"h"}:{n:String(m),u:"m"}; }
function fmtDurShort(secs){ const d=fmtDurH(secs); return d.n+d.u; }
function fmtDistKm(m){ const v=Number(m)||0; if(!v) return {n:"0",u:"km"}; return v>=1000?{n:(v/1000).toFixed(1),u:"km"}:{n:String(Math.round(v)),u:"m"}; }
function fmtDistFlat(m){ const d=fmtDistKm(m); return d.n+d.u; }
function prettyLabel(s){ return String(s ?? "—").toLowerCase().replace(/_/g," ").replace(/\b\w/g, c=>c.toUpperCase()); }

// Sport bar colour by category. The backend supplies sport_categories
// (name → category) on the progress payload; the UI maps category → colour.
const SPORT_COLORS = {"run":"#e4002b","walk":"#57a05a","hike":"#4b8b3b","motor":"#607d8b","cycle":"#f77f00","swim":"#0099cc","row":"#2aa198","strength":"#8a8a8a","yoga":"#9b6dd0","ski":"#00b4d8","snow":"#4dd0e1","skate":"#6ab7ff","racquet":"#a3c644","ball":"#e67e22","golf":"#6bbf59","combat":"#c0392b","climb":"#b5651d","dance":"#e84393","water":"#00a5a5","horse":"#8d6e63","generic":"#8a8a8a"};

const METRIC_GLYPHS = {
  count:'<path d="M3 5h.01" /><path d="M3 12h.01" /><path d="M3 19h.01" /><path d="M8 5h13" /><path d="M8 12h13" /><path d="M8 19h13" />',
  duration:'<line x1="10" x2="14" y1="2" y2="2" /><line x1="12" x2="15" y1="14" y2="11" /><circle cx="12" cy="14" r="8" />',
  distance:'<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z" /><path d="m14.5 12.5 2-2" /><path d="m11.5 9.5 2-2" /><path d="m8.5 6.5 2-2" /><path d="m17.5 15.5 2-2" />',
  flame:'<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" />',
  ascent:'<path d="m8 3 4 8 5-5 5 15H2L8 3z" />',
};
function heroCell(icon, val, unit, label) {
  return `<div class="hero-cell">
    <div class="hc-top"><span class="hc-icon"><svg viewBox="0 0 24 24">${METRIC_GLYPHS[icon]??""}</svg></span></div>
    <div class="hc-val">${esc(val)}${unit?`<span class="hc-unit">${esc(unit)}</span>`:""}</div>
    <div class="hc-lbl">${esc(label)}</div>
  </div>`;
}

function render(sc) {
  if (!sc || sc.type !== "progress_summary") return;
  const d = sc.data ?? {};
  document.getElementById("hdr-sub").textContent = [d.from_date ?? d.from, d.to_date ?? d.to].filter(Boolean).join(" → ");

  const sessions = d.number_of_sessions ?? d.totalTrainingSessionCount ?? 0;
  const durS = d.total_duration_s ?? (d.totalDuration ? (Number(d.totalDuration.millis)/1000 || Number(d.totalDuration.standardSeconds) || 0) : 0);
  const dist = d.total_distance_m ?? d.totalDistance ?? 0;
  const kcal = d.total_kcal ?? d.totalCalories ?? 0;
  const ascent = d.total_ascent_m ?? d.totalAscent ?? 0;

  const durH = fmtDurH(durS), distK = fmtDistKm(dist);
  const cells = [heroCell("count", String(sessions), "", "Sessions")];
  if (durS) cells.push(heroCell("duration", durH.n, durH.u, "Total Time"));
  if (dist) cells.push(heroCell("distance", distK.n, distK.u, "Distance"));
  if (kcal) cells.push(heroCell("flame", Math.round(kcal), "kcal", "Calories"));
  if (ascent) cells.push(heroCell("ascent", Math.round(ascent), "m", "Ascent"));

  const cats = d.sport_categories ?? {};
  const sd = d.sport_breakdown ?? d.sportDistributions ?? {};
  const sportSrc = sd.distance?.length ? sd.distance : (sd.duration ?? []);
  const sportIsDist = !!sd.distance?.length;
  const sports = sportSrc.map(x => { const label = x.sportName ?? x.nameForChart ?? "—"; return { label, value: Number(x.valueForChart)||0, color: SPORT_COLORS[cats[label]] ?? SPORT_COLORS.generic }; })
    .sort((a,b)=>b.value-a.value);

  const chips = sports.map(s => `<div class="sp-chip">
    <span class="sp-dot" style="background:${s.color}"></span>
    <span class="sp-name">${esc(s.label)}</span>
    <span class="sp-val">${esc(sportIsDist ? fmtDistFlat(s.value) : fmtDurShort(s.value/1000))}</span>
  </div>`).join("");

  document.getElementById("root").className = "";
  document.getElementById("root").innerHTML = `<div class="fade-in">
    <div class="hero">${cells.join("")}</div>
    ${sports.length ? `<div class="sport-strip"><span class="strip-lbl">By Sport</span>${chips}</div>` : ""}
  </div>`;
}
</script>
</body>
</html>
