          type: string
          description: Optional display nickname; null when unset.
          nullable: true
        id:
          type: integer
          format: int64
          description: Numeric user ID. Use as `userId` in POST /api/training/history.
          example: 11111111
        pictureUrl:
          type: string
          format: uri
          description: Profile photo URL; null when no photo has been uploaded.
          nullable: true
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: FR
    LocalizationInfo:
      type: object
      description: 'The signed-in user''s locale and display-formatting preferences, returned under `localizationInfo` in
        `GET /api/account/users/current/user`. These drive how the Flow UI renders dates, times and units — they do not change
        the wire format of API payloads (which use fixed formats regardless). Captured 2026-05-29 (capture 17-current-user.json).

        '
      properties:
        firstDayOfWeek:
          type: string
          enum:
          - MONDAY
          - SUNDAY
          - SATURDAY
          description: First day shown in calendar/week views.
          example: MONDAY
        measurementUnit:
          type: string
          enum:
          - METRIC
          - IMPERIAL
          description: Unit system for displayed distances/weights (display only — API stays metric).
          example: METRIC
        dateFormat:
          type: string
          enum:
          - DAY_MONTH_YEAR
          - MONTH_DAY_YEAR
          - YEAR_MONTH_DAY
          description: Field ordering for rendered dates.
          example: DAY_MONTH_YEAR
        dateSeparator:
          type: string
          enum:
          - HYPHEN
          - SLASH
          - DOT
          description: Separator character between date fields (`-`, `/`, `.`).
          example: HYPHEN
        timeFormat:
          type: string
          enum:
          - TIMEFORMAT_24
          - TIMEFORMAT_12
          description: 24-hour vs 12-hour clock display.
          example: TIMEFORMAT_24
        timeFormatSeparator:
          type: string
          enum:
