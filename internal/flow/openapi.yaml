        dateFormat:
          type: string
          enum:
          - DAY_MONTH_YEAR
          - MONTH_DAY_YEAR
          - YEAR_MONTH_DAY
          description: Field ordering for rendered dates.
          example: DAY_MONTH_YEAR
        dateSeparator:
          type: string
          enum:
          - HYPHEN
          - SLASH
          - DOT
          description: Separator character between date fields (`-`, `/`, `.`).
          example: HYPHEN
        timeFormat:
          type: string
          enum:
          - TIMEFORMAT_24
          - TIMEFORMAT_12
          description: 24-hour vs 12-hour clock display.
          example: TIMEFORMAT_24
        timeFormatSeparator:
          type: string
          enum:
          - COLON
          - PERIOD
          description: Separator between hours and minutes (`:` or `.`).
          example: COLON
        timeZone:
          type: string
          description: UTC offset, e.g. `"-02:00"` or `"+02:00"`.
          example: -02:00
        flowLanguage:
          type: string
