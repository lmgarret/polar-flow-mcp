        feeling:
          type: number
          description: 'User-selected feeling on Polar''s **inverted** 0–1 scale: 0.19 = best

            ("Au top"), 0.39, 0.59, 0.79, 0.99 = worst ("Mal"). `0.0` = cleared /

            invalid input; null when never set. See `TrainingSessionEdit.feeling`.

            '
          nullable: true
        note:
          type: string
          nullable: true
        latitude:
          type: number
          description: Session start latitude; null for manual sessions.
          nullable: true
        longitude:
          type: number
          nullable: true
        startDate:
          type: string
          description: 'ISO 8601 without timezone, e.g. `"2026-05-25T08:00:00"`.

            '
        stopTime:
          type: string
          description: ISO 8601 without timezone.
        duration:
          type: string
          description: '⚠ ISO 8601 duration string (e.g. `"PT30M"`). Distinct from the

            **integer seconds** in POST /api/training/create, **integer

            milliseconds** in POST /api/training/history, and **HH:MM:SS**

            in training-target endpoints.

            '
        distance:
          type: number
          description: 'Metres. ⚠ Often null at the top level even when populated

            inside `exercises[i].distance`.

            '
          nullable: true
        kiloCalories:
          type: integer
          nullable: true
        trainingLoad:
          type: number
          nullable: true
        trainingBenefit:
          type: string
