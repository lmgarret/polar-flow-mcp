              description: 'Down-sampled activity intensity timeline (length ≤

                `maxSampleCount`). Empty on a device-less account. Per the web UI

                (bundle read 2026-09-30, no populated capture): `{time, value}`,

                `time` an epoch ms holding the local wall clock as if UTC, `value`

                the activity level compared against `activityZoneLimits` (below

                `activityZoneLimits[1]` reads as non-wear). # TODO: verify on a

                device-synced account.

                '
            activityTimelineIcons:
              type: array
              items: {}
              description: 'Icons overlaid on the timeline. Per the web UI: `{activityTimelineIconType, localTime, distance,
                duration, kiloCalories, sportName, url, hr}`, types incl. `ACTIVITY_TIMELINE_ICON_TYPE_SLEEP` / `…_WAKE_UP`.
                # TODO: verify'
            activityZoneLimits:
              type: array
              items:
                type: number
                format: float
              minItems: 7
              maxItems: 7
              description: 'Seven floats defining the upper bounds of activity-intensity

                zones for this user/day. Server-synthesized from physical

                profile even without device data.

                '
            heartRateTimelineSamples:
              type: array
              items: {}
              description: '24h HR samples (down-sampled to ≤ `maxSampleCount`). Empty on device-less account. Per the web
                UI: `{time, value}` like `activityTimelineSamples`, `value` in bpm, `0` = gap. # TODO: verify'
            heartRateSummary:
              type: object
              properties:
                dayMinimum:
                  type: integer
                  description: Lowest HR during waking hours.
                dayMinimumDateTime:
                  description: Timestamp of `dayMinimum`; null when no data. Free-form — observed as a numeric epoch (and
                    null), not always an ISO string.
                dayMaximum:
                  type: integer
                dayMaximumDateTime:
                  description: Timestamp of `dayMaximum`; null when no data. Free-form (numeric epoch or null).
                nightMinimum:
                  type: integer
                  description: Lowest HR during sleep.
                nightMinimumDateTime:
                  description: Timestamp of `nightMinimum`; null when no data. Free-form (numeric epoch or null).
            highSessionTimelineList:
              type: array
              items: {}
              description: 'High-intensity periods within the day. Per the web UI: `{startTime, endTime}`. # TODO: verify'
            trainingTimelineList:
              type: array
              items: {}
              description: 'Training sessions within the day. Per the web UI: `{startTime, endTime}`. # TODO: verify'
        activityScoreData:
          type: object
          description: 'Time spent in each activity-intensity bucket, in **minutes** (the web

