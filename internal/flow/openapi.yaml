            schema:
              $ref: '#/components/schemas/FavoriteCreate'
      responses:
        '201':
          description: 'Created. Body is the new favorite id as a **bare string**

            (e.g. `81371573`), not a JSON object. Parse as integer.

            '
          content:
            text/plain:
              schema:
                type: string
              example: '81371573'
        '400':
          description: 'Field-keyed validation errors, e.g. `{"name":["error.required"]}`,

            `{"target.name":[<localized "unexpected problem">]}` (> 45 chars),

            `{"target.description":[…]}` (> 500 chars),

            `{"exerciseTargets[0].distance":["trainingTarget.unknownException"],…}`

            (no goal / non-positive goal), `{"exerciseTarget.duration":[…]}`

            (≥ 100 h), `{"exerciseTargets[0].phases":[…]}` (PHASED without phases).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Unknown `type` enum value. HTML error page.
