      description: 'Map of `YYYY-MM-DD` → `ActivityTimelineDay`. Returned by both

        `/api/activity-timeline/load` (one entry) and

        `/api/activity-timeline/loadFour` (four entries spanning `[day-2 …

        day+1]`). Object keys are explicit date strings, not array indices.

        '
      additionalProperties:
        $ref: '#/components/schemas/ActivityTimelineDay'
      example:
        '2026-05-26':
          dataPanelData:
            dailyActivityGoal: 0
            activeTime: 0
            distanceFromSteps: 0
            stepCount: 0
            kiloCalories: 0
            sleepDuration: 0
            inactivityAlertCount: 0
            sleepPlus: false
    SleepNight:
      type: object
      description: 'A single recorded night of sleep on a Polar device with `Sleep Plus Stages`

        support. Field semantics reconstructed from the Polar Flow JS bundle

        (`/flow-ui-mono/static/js/async/1608.16456f2f.js`) — no live capture with

        data was possible on the test account, so element shapes for nested arrays

        carry `# TODO: verify on a device-synced account`. The endpoint may also

        return entries with most fields null/zero for nights where the device was

        not worn.

        '
      required:
      - date
      - sleepStartTime
      - sleepEndTime
      - sleepStartOffset
      - sleepEndOffset
      properties:
        date:
          type: string
          format: date
          description: 'Calendar date the sleep is associated with — the morning the user

            woke up (Polar convention: a night that crosses midnight is bucketed

            under the wake-up date). Used by the JS as `moment.utc(date)` and

            then `.subtract(1, "days")` to anchor the previous evening.

            '
          example: '2026-05-26'
        sleepStartTime:
          type: string
          description: 'ISO datetime when the device detected sleep onset. The Polar bundle

            parses this with `jsonDatetimeAsMoment` — the exact format (zoneless

            vs UTC vs local) is TBD without a populated capture, but it is

            additive with `sleepStartOffset`.

            '
          example: '2026-05-25T23:14:00'
        sleepEndTime:
          type: string
          description: ISO datetime of wake-up. Paired with `sleepEndOffset`.
          example: '2026-05-26T07:02:00'
        sleepStartOffset:
          type: integer
          description: 'Offset in **seconds** added to `sleepStartTime` to get the "fell

            asleep" moment. Polar splits the bedtime / asleep-time distinction

            across these two fields.

            '
        sleepEndOffset:
          type: integer
          description: Offset in seconds added to `sleepEndTime` (wake-up offset).
        sleepScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 'Overall sleep score 0–100. The JS bundle treats `0` as "no score"

            (excluded from averages). Polar''s marketing calls this "Sleep Score".

            '
        sleepCycles:
          type: integer
          description: Count of detected sleep cycles. Used in the summary table.
          nullable: true
        continuityIndex:
          type: number
          description: 'Sleep continuity rating, 1–5. The UI renders it as `"<n>/5"`. Polar

            calls this "Sleep continuity". # TODO: verify exact bounds / precision.

            '
          nullable: true
        sleepRating:
          type: integer
          description: 'User-provided sleep rating (a "how well did I sleep?" star/number).

            Indexes into a localised label table in the UI. # TODO: enum once

            observed.

            '
          nullable: true
        sleepWakeStates:
          type: array
          description: 'Time-series of sleep-state transitions detected by the device.

            Element shape inferred from JS:

            `{sleepWakeState: 1|2|3|4|…, offsetFromStart: <seconds>, longInterruption?: boolean}`.

            The JS sorts/groups these into LIGHT (code 2 → `nonrem12`),

            DEEP (code 3 → `nonrem3`), REM (code 1 → `rem`), UNKNOWN (code 4),

            and INTERRUPTIONS (special path that toggles `longInterruption`).

            # TODO: verify codes against device documentation.

            '
          items:
            type: object
            properties:
              sleepWakeState:
                type: integer
                description: Stage code (1=REM, 2=light, 3=deep, 4=unknown — verified mapping).
              offsetFromStart:
                type: integer
                description: Seconds from the start of the night.
              longInterruption:
                type: boolean
                description: Set true on `INTERRUPTIONS`-state entries that exceeded the "long" threshold (Polar treats these
                  separately in the summary).
        stages:
          type: object
          description: 'Pre-grouped stage intervals — present only on accounts/devices with

            Sleep Plus Stages enabled. The JS bundle constructs this client-side

            from `sleepWakeStates`, but the same keys appear server-side in the

            response shape. # TODO: confirm server emits `stages` directly vs

            only `sleepWakeStates`.

            '
          properties:
            nonrem12:
              type: array
              description: Light sleep intervals.
              items:
                type: object
            nonrem3:
              type: array
              description: Deep sleep intervals.
              items:
                type: object
            rem:
              type: array
              description: REM intervals.
              items:
                type: object
            interrupt:
              type: array
              description: 'Wake/interruption intervals. Each carries an optional

                `longInterrupt: true` boolean.

                '
              items:
                type: object
            unknown:
              type: array
              description: Periods the device couldn't classify (sensor lost contact, etc.).
              items:
                type: object
    SportDistributionEntry:
      type: object
      description: 'One sport''s share of a metric (duration / session count / distance) within

        a progress-summary distribution list. Each entry has both `distribution*`

        (the underlying values) and `*ForChart` (Highcharts-friendly copies) — they

        are usually identical but kept separate to let Polar''s UI tweak labels

        for charting.

        '
      properties:
        sportName:
          type: string
          description: 'Localised sport name (e.g. `"Course à pied"`, `"Cyclisme"`). On a

            zero-session account, the API emits a placeholder

            `"Aucune donnée relative au sport"` (FR) / `"No sport-related data"` (EN).

            '
        distributionPercent:
          type: number
          format: float
          description: This sport's share of the metric, 0–100. Entries sum to 100.0.
        nameForChart:
          type: string
          description: Same as `sportName` (UI label override slot).
        percentForChart:
          type: number
          format: float
          description: Same as `distributionPercent` (chart label override slot).
        valueForChart:
          type: number
          format: float
          description: Raw value the percent was computed from (seconds, count, or metres depending on which metric list this
            is in).
    StandardDuration:
      type: object
      description: 'Polar''s Joda/JSR-310-style serialized duration. Carries the wall-clock

        breakdown plus a total `millis`. The breakdown fields are NOT additive with

        `millis` — they''re the same value expressed as `(d, h, m, s)`. Use `millis`

        as the canonical total.


        Note: this is yet another duration format on top of the API''s existing

        three (integer seconds, `HH:MM:SS` string, integer ms). Polar evidently

        glued several backends together — see CLAUDE.md.

        '
      required:
      - standardDays
      - standardHours
      - standardMinutes
      - standardSeconds
      - millis
      properties:
        standardDays:
          type: integer
          description: Days component (0+).
        standardHours:
          type: integer
          description: Hours component (0–23).
        standardMinutes:
          type: integer
          description: Minutes component (0–59).
        standardSeconds:
          type: integer
          description: Seconds component (0–59).
        millis:
          type: integer
          format: int64
          description: Canonical total duration in milliseconds.
    ProgressViewSummary:
      type: object
      description: 'Aggregated training totals over a date range. Returned by both

        `/progress/getProgressViewSummaryAsJson` (regular users) and

        `/progress/getSummaryDataAsJson` (Coach view — but both work on free

        accounts; the Coach gate is purely client-side in the JS bundle).


        Schema captured 2026-05-26 on an account with zero sessions —

        `captures/responses/16-progress-summary-empty.json`. Numeric fields are

        zero; distribution lists contain a single placeholder entry with

        `sportName: "Aucune donnée relative au sport"` (localised) and

        `distributionPercent: 100.0`. # TODO: verify shape on an account with

        recorded sessions — element shapes for the zone lists are likely

        `[{zoneIndex, durationMillis, percent}]` but the empty arrays don''t

        expose them.

        '
      properties:
        sportDistributions:
          type: object
          description: 'Per-metric sport-distribution breakdowns. Each entry is a list of

            `SportDistributionEntry` summing to 100% for that metric.

            '
          properties:
            duration:
              type: array
              items:
                $ref: '#/components/schemas/SportDistributionEntry'
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SportDistributionEntry'
            distance:
              type: array
              items:
                $ref: '#/components/schemas/SportDistributionEntry'
        trainingBenefitDistributionList:
          type: array
          description: 'Distribution of Polar''s "Training Benefit" categories

            (RECOVERY/STEADY_STATE/TEMPO/THRESHOLD/MAX/INTERVAL/…). On a

            zero-session account the list contains a single `{trainingBenefit: "NONE"}`

            placeholder. # TODO: enumerate values once a populated account is captured.

            '
          items:
            type: object
            properties:
              trainingBenefit:
                type: string
                description: Benefit category code, e.g. `"NONE"` (placeholder). Other values TBD.
              distributionPercent:
                type: number
                format: float
              trainingBenefitTotal:
                type: number
                format: float
                description: Raw value the percent was computed from (units depend on metric — likely seconds).
              nameForChart:
                type: string
              percentForChart:
                type: number
                format: float
        totalHeartRateZoneList:
          type: array
          description: Time spent in each HR zone across all sessions. Element shape TBD.
          items:
            type: object
        totalFitFatZonesList:
          type: array
          description: Time in fit/fat-burning zones. Element shape TBD.
          items:
            type: object
        totalPowerZoneList:
          type: array
          description: Time in cycling power zones. Element shape TBD.
          items:
            type: object
        totalSpeedZoneList:
          type: array
          description: Time in speed/pace zones. Element shape TBD.
          items:
            type: object
        totalTrainingSessionCount:
          type: integer
          description: Total number of training sessions in the date range.
        totalDistance:
          type: number
          format: float
          description: Total distance covered in **metres** (matches the rest of the API's metres convention).
        totalDuration:
          $ref: '#/components/schemas/StandardDuration'
        totalCalories:
          type: number
          format: float
          description: Total kcal burned across all sessions.
        totalAscent:
          type: number
          format: float
          description: Cumulative ascent in metres.
        totalDescent:
          type: number
          format: float
          description: Cumulative descent in metres.
  responses:
    Unauthorized:
      description: Session cookie missing or expired
