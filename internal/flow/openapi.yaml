    TrainingSessionEdit:
      type: object
      description: 'Request body for `PUT /api/training/editTraining/{id}` — the "Modifier la

        séance" form (`/training/edit/{id}`). Captured 2026-09-28.


        Looks like a full replace but per-field null/missing semantics differ

        (see each property). **Every out-of-range value is rejected with a bare

        `500` and an empty body** — no field name, no code — so validate before

        sending. Safe client pattern: read

        `GET /api/training/analysis/{id}/summary`, merge the changes, and send

        every field. The start date/time is not editable.

        '
      properties:
        sport:
          type: integer
          description: 'Sport id from `GET /api/sports/sports`. Unknown ids (`0`, `21`,

            `9999`) → 500. Missing/null → unchanged.

            '
          example: 1
          nullable: true
        duration:
          type: integer
          minimum: 0
          maximum: 359999
          description: 'Duration in **integer seconds** (same unit as

            `TrainingSessionCreate.duration`). `0`…`359999` (99:59:59); `0` is

            accepted and stored as `PT0S`. ≥ 360000 or negative → 500. A string

            (`"00:30:00"`) is silently ignored. Missing/null → unchanged.

            '
          example: 1800
          nullable: true
        distance:
          type: number
          minimum: 0
          maximum: 9999000
          description: 'Distance in **metres** (the form shows km). Fractional values

            accepted. > 9 999 000 or negative → 500. Missing/null → unchanged.

            '
          example: 5000
          nullable: true
        hrAverage:
          type: integer
          minimum: 0
          maximum: 240
          description: 'Average HR in bpm — a **number** here (the create endpoint sends a

            string). `0` = unset. > 240 or negative → 500. A numeric string

            (`"140"`) is also accepted. Missing/null → unchanged.

            '
          example: 140
          nullable: true
        hrMax:
          type: integer
          minimum: 0
          maximum: 240
          description: Max HR in bpm; `0` = unset. > 240 → 500. Not checked against hrAverage.
          example: 0
          nullable: true
        kiloCalories:
          type: integer
          minimum: 0
          maximum: 65535
          description: Kilocalories. `0`…`65535` (uint16); outside → 500.
          example: 300
          nullable: true
        speedAverage:
          type: number
          minimum: 0
          maximum: 399
          description: Average speed in **km/h**. `0`…`399`; outside → 500. Null → unchanged.
          example: null
          nullable: true
        feeling:
          type: string
          description: 'Perceived feeling on Polar''s **inverted** 0–1 scale, sent as a

            string: `"0.19"` = 5 "Au top" (best), `"0.39"` = 4 "Bien",

            `"0.59"` = 3 "Moyen", `"0.79"` = 2 "Pas terrible", `"0.99"` = 1

            "Mal" (worst). **null/missing → unchanged** (a feeling cannot be

            cleared back to null). Any number in `[0,1]` is stored verbatim;

            numbers outside → 500; non-numeric strings and `""` are stored as

            `0.0`.

            '
          example: '0.39'
          nullable: true
        note:
          type: string
          maxLength: 10000
          description: 'Free-text note, ≤ 10 000 chars (10 001 → 500). Missing →

            unchanged. ⚠ **`null` is stored as the literal string `"null"`** —

            never send null.

            '
          example: edited note
        trainingSessionName:
          type: string
          maxLength: 100
          description: 'Session title, `""`…100 chars (unicode counted as characters;

            101 → 500). ⚠ **Missing or null resets the title to the localized

            sport name** (e.g. `"Course à pied"`) — always send it.

            '
          example: probe-edit-renamed
        editedExerciseId:
          type: integer
          format: int64
          description: 'Always null in the captured (manual, single-sport) form. A bogus value

            (`1`) is ignored. Semantics for device-recorded / multi-sport sessions

            not verified. # TODO: verify

            '
          example: null
          nullable: true
        hrSamples:
          type: array
          description: 'Synthesized by the web UI — one sample per second of `duration`,

            every value equal to `hrAverage`. Optional: omitting it (or `[]`)

            yields the identical summary. Effect on a device-recorded session''s

            real HR trace is untested. # TODO: verify

            '
          items:
            type: integer
      example:
        sport: 1
        duration: 1800
        distance: 5000
        hrAverage: 140
        note: edited note
        trainingSessionName: probe-edit-renamed
        hrMax: 0
        kiloCalories: 300
        feeling: '0.39'
        editedExerciseId: null
        speedAverage: null
    TrainingSessionDataUpdate:
      type: object
      description: 'Request body for `PUT /api/training/analysis/updateTrainingData/{id}` —

        the session page''s inline note/feeling box. A true partial update: only

        `note` and `feeling` are read, every other key is silently ignored.

        Captured 2026-09-28.

        '
      properties:
        note:
          type: string
          maxLength: 10000
          description: 'New note, ≤ 10 000 chars (longer → 400). `""` clears it.

            Missing/null → unchanged.

            '
          example: inline note edit
          nullable: true
        feeling:
          type: string
          description: 'Same inverted scale as `TrainingSessionEdit.feeling` (`"0.19"` best …

            `"0.99"` worst). Numbers outside `[0,1]` → 400. ⚠ Unlike

            editTraining, **null here is stored as `0.0`** ("no feeling") —

            omit the key to leave the feeling unchanged.

            '
          example: '0.19'
          nullable: true
      example:
        note: inline note edit
    TargetFromFavoriteRequest:
      type: object
      description: 'Request body for `POST /training/target/createTargetFromFavourite` —

        the diary''s "+ Ajouter → Favoris" picker. Captured 2026-09-28.

        '
      required:
      - id
      - to
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: 'favoriteId (the UI sends it as a string; a JSON number is accepted

            too). Missing, non-numeric or non-existent → 500 HTML page; another

            user''s favorite → 400 `error.invalid.favorite`.

            '
          example: '83468869'
        to:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}[+-][0-9]{2}:[0-9]{2}$
          description: 'Target date+time as `YYYY-MM-DDTHH:MM:SS.sss±HH:MM` — milliseconds

            **and** a numeric offset are mandatory (`…Z`, date-only, tz-less →

            400). The **offset is ignored**: the wall-clock part is the local

            schedule time. **Exact midnight (`T00:00:00.000`) means "no time"**

            and schedules at the default **18:00** (the diary always sends

            midnight). If another target already occupies that minute, the new

            one is shifted +1 minute. Past dates are accepted.

            '
          example: '2026-10-20T09:30:00.000+00:00'
      example:
        id: '83468869'
        to: '2026-09-28T00:00:00.000+00:00'
    TargetFromFavorite:
      type: object
      description: 'Response of `POST /training/target/createTargetFromFavourite` — the

        newly scheduled training target in the `favoriteTargetsJson` element

        shape. ⚠ Served as **`text/plain`** even though the body is JSON.

        Yet another encoding set: `date` is `DD-MM-YYYY`, `time` `HH:MM`,

        `distance` a *string* of metres, `duration` a *string* of milliseconds.

        '
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
          description: The **new training-target id** (use with `/api/trainingtarget/{id}`).
          example: 1461116717
        name:
          type: string
          description: Copied from the favorite.
        sport:
          type: object
          description: Embedded sport object (same shape as `FavoriteSimple.sport`).
          properties:
            id:
              type: integer
            name:
              type: string
              description: UPPERCASE sport enum.
          nullable: true
        iconUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        date:
          type: string
          description: Scheduled date, `DD-MM-YYYY`.
          example: 28-09-2026
        time:
          type: string
          description: Scheduled local time, `HH:MM` (18:00 when `to` was midnight).
          example: '18:00'
        distance:
          type: string
          description: 'Total distance in metres as a string (`"2000.0"`); `"0"` when the

            favorite has no distance goal (verified 2026-09-28).

            '
          nullable: true
        duration:
          type: string
          description: 'Total duration in **milliseconds** as a string (`"600000"`,

            `"2700000"` for 45 min); `"0"` when the favorite has no duration.

            '
          nullable: true
        kiloCalories:
          type: string
          description: Target kcal as a **string** (`"450"`), or null when unset (verified 2026-09-28).
          nullable: true
        url:
          type: string
          description: Editor URL of the new target (`/target/{id}`).
      example:
        id: 1461116717
        name: probe-fav-src
        sport:
          id: 1
          name: RUNNING
        iconUrl: https://platform.cdn.polar.com/ecosystem/sport/icon/808d0882e97375e68844ec6c5417ea33-2024-04-16_06_01_39
        description: src desc
        date: 28-09-2026
        time: '18:00'
        distance: '2000.0'
        duration: '600000'
        kiloCalories: null
        url: /target/1461116717
    SleepNight:
      type: object
      description: 'A single recorded night of sleep on a Polar device with `Sleep Plus Stages`

        support. Field semantics reconstructed from the Polar Flow JS bundle

        (`/flow-ui-mono/static/js/async/1608.16456f2f.js`) — no live capture with

        data was possible on the test account, so element shapes for nested arrays

        carry `# TODO: verify on a device-synced account`. The endpoint may also

        return entries with most fields null/zero for nights where the device was

        not worn.

        '
      required:
      - date
      - sleepStartTime
      - sleepEndTime
      - sleepStartOffset
      - sleepEndOffset
      properties:
        date:
          type: string
          format: date
          description: 'Calendar date the sleep is associated with — the morning the user

            woke up (Polar convention: a night that crosses midnight is bucketed

            under the wake-up date). Used by the JS as `moment.utc(date)` and

            then `.subtract(1, "days")` to anchor the previous evening.

            '
          example: '2026-05-26'
        sleepStartTime:
          type: string
          description: 'ISO datetime when the device detected sleep onset. The Polar bundle

            parses this with `jsonDatetimeAsMoment` — the exact format (zoneless

            vs UTC vs local) is TBD without a populated capture, but it is

            additive with `sleepStartOffset`.

            '
          example: '2026-05-25T23:14:00'
        sleepEndTime:
          type: string
          description: ISO datetime of wake-up. Paired with `sleepEndOffset`.
          example: '2026-05-26T07:02:00'
        sleepStartOffset:
          type: integer
          description: 'Offset in **seconds** added to `sleepStartTime` to get the "fell

            asleep" moment (web UI: `jsonDatetimeAsMoment(sleepStartTime)

            .add(sleepStartOffset, "seconds")`, bundle read 2026-09-30).

            `sleepWakeStates[].offsetFromStart` counts from `sleepStartTime`,

            before this offset.

            '
          nullable: true
        sleepEndOffset:
          type: integer
          description: Offset in seconds added to `sleepEndTime` (wake-up offset).
          nullable: true
        sleepScore:
          type: number
          minimum: 0
          maximum: 100
          description: 'Overall sleep score 0–100 (a float, e.g. 72.5762). The JS bundle treats

            `0` as "no score" (excluded from averages). Polar calls this "Sleep Score".

            **Can be `null`** (seen live 2026-10-01 on a real account, within a

            365-day report — a strict decoder failed the whole report); treat like `0`.

            '
          nullable: true
        continuityClass:
          type: integer
          description: Bucketed class of `continuityIndex` (integer); null when no data.
          nullable: true
        sleepCycles:
          type: integer
          description: Count of detected sleep cycles. Used in the summary table.
          nullable: true
        continuityIndex:
          type: number
          description: 'Sleep continuity rating, 1–5. The UI renders it as `"<n>/5"`. Polar

            calls this "Sleep continuity". # TODO: verify exact bounds / precision.

            '
          nullable: true
        sleepRating:
          type: string
          description: 'User-provided sleep rating as a string enum (e.g.

            "SLEPT_NEITHER_BAD_NOR_WELL"); null when unset. Maps to a localised

            label in the UI.

            '
          nullable: true
        sleepWakeStates:
          type: array
          description: 'Time-series of sleep-state transitions detected by the device.

            Element shape inferred from JS:

            `{sleepWakeState: 1|2|3|4|…, offsetFromStart: <seconds>, longInterruption?: boolean}`.

            The JS sorts/groups these into LIGHT (code 2 → `nonrem12`),

            DEEP (code 3 → `nonrem3`), REM (code 1 → `rem`), UNKNOWN (code 4),

            and INTERRUPTIONS (code 0, carrying `longInterruption`). Each entry

            starts a segment lasting until the next entry (the last one until

            wake-up). Deep sleep only counts on a Sleep Plus Stages night (one with

            `sleepCycles` > 0 or any code 1/2 entry). Codes read from the web UI

            bundle 2026-09-30. # TODO: verify on a device-synced account.

            '
          items:
            type: object
            properties:
              sleepWakeState:
                type: integer
                description: Stage code (0=wake/interruption, 1=REM, 2=light, 3=deep, 4=unknown — from the web UI bundle).
              offsetFromStart:
                type: integer
                description: Seconds from the start of the night.
              longInterruption:
                type: boolean
                description: Set true on `INTERRUPTIONS`-state entries that exceeded the "long" threshold (Polar treats these
                  separately in the summary).
        stages:
          type: object
          description: 'Pre-grouped stage intervals — present only on accounts/devices with

            Sleep Plus Stages enabled. The JS bundle constructs this client-side

            from `sleepWakeStates`, but the same keys appear server-side in the

            response shape. # TODO: confirm server emits `stages` directly vs

            only `sleepWakeStates`.

            '
          properties:
            nonrem12:
              type: array
              description: Light sleep intervals.
              items:
                type: object
            nonrem3:
              type: array
              description: Deep sleep intervals.
              items:
                type: object
            rem:
              type: array
              description: REM intervals.
              items:
                type: object
            interrupt:
              type: array
              description: 'Wake/interruption intervals. Each carries an optional

                `longInterrupt: true` boolean.

                '
              items:
                type: object
            unknown:
              type: array
              description: Periods the device couldn't classify (sensor lost contact, etc.).
              items:
                type: object
    SportDistributionEntry:
      type: object
      description: 'One sport''s share of a metric (duration / session count / distance) within

        a progress-summary distribution list. Each entry has both `distribution*`

        (the underlying values) and `*ForChart` (Highcharts-friendly copies) — they

        are usually identical but kept separate to let Polar''s UI tweak labels

        for charting.

        '
      properties:
        sportName:
          type: string
          description: 'Localised sport name (e.g. `"Course à pied"`, `"Cyclisme"`). On a

            zero-session account, the API emits a placeholder

            `"Aucune donnée relative au sport"` (FR) / `"No sport-related data"` (EN).

            '
        distributionPercent:
          type: number
          format: float
          description: This sport's share of the metric, 0–100. Entries sum to 100.0.
        nameForChart:
          type: string
          description: Same as `sportName` (UI label override slot).
        percentForChart:
          type: number
          format: float
          description: Same as `distributionPercent` (chart label override slot).
        valueForChart:
          type: number
          format: float
          description: Raw value the percent was computed from (seconds, count, or metres depending on which metric list this
            is in).
      example:
        sportName: Course à pied
        distributionPercent: 100
        nameForChart: Course à pied
        percentForChart: 100
        valueForChart: 0
    StandardDuration:
      type: object
      description: 'Polar''s Joda/JSR-310-style serialized duration. Carries the wall-clock

        breakdown plus a total `millis`. The breakdown fields are NOT additive with

        `millis` — they''re the same value expressed as `(d, h, m, s)`. Use `millis`

        as the canonical total.


        Note: this is yet another duration format on top of the API''s existing

        three (integer seconds, `HH:MM:SS` string, integer ms). Polar evidently

        glued several backends together — see CLAUDE.md.

        '
      required:
      - standardDays
      - standardHours
      - standardMinutes
      - standardSeconds
      - millis
      properties:
        standardDays:
          type: integer
          description: Days component (0+).
        standardHours:
          type: integer
          description: Hours component (0–23).
        standardMinutes:
          type: integer
          description: Minutes component (0–59).
        standardSeconds:
          type: integer
          description: Seconds component (0–59).
        millis:
          type: integer
          format: int64
          description: Canonical total duration in milliseconds.
      example:
        standardDays: 0
        standardHours: 0
        standardMinutes: 30
        standardSeconds: 0
        millis: 1800000
    ProgressViewSummary:
      type: object
      description: 'Aggregated training totals over a date range. Returned by both

        `/progress/getProgressViewSummaryAsJson` (regular users) and

        `/progress/getSummaryDataAsJson` (Coach view — but both work on free

        accounts; the Coach gate is purely client-side in the JS bundle).


        Schema captured 2026-05-26 on an account with zero sessions —

        `captures/responses/16-progress-summary-empty.json`. Numeric fields are

        zero; distribution lists contain a single placeholder entry with

        `sportName: "Aucune donnée relative au sport"` (localised) and

        `distributionPercent: 100.0`. Re-checked 2026-10-02 with one manual

        session (avg HR only, no samples): distributions and totals fill in, the

        four zone lists stay `[]` — they need recorded HR/power/speed samples.

        # TODO: verify zone-list element shape (likely

        `[{zoneIndex, durationMillis, percent}]`); modeled as open maps until then.

        '
      properties:
        sportDistributions:
          type: object
          description: 'Per-metric sport-distribution breakdowns. Each entry is a list of

            `SportDistributionEntry` summing to 100% for that metric.

            '
          properties:
            duration:
              type: array
              items:
                $ref: '#/components/schemas/SportDistributionEntry'
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SportDistributionEntry'
            distance:
              type: array
              items:
                $ref: '#/components/schemas/SportDistributionEntry'
        trainingBenefitDistributionList:
          type: array
          description: 'Distribution of Polar''s "Training Benefit" categories

            (RECOVERY/STEADY_STATE/TEMPO/THRESHOLD/MAX/INTERVAL/…). On a

            zero-session account the list contains a single `{trainingBenefit: "NONE"}`

            placeholder. # TODO: enumerate values once a populated account is captured.

            '
          items:
            type: object
            properties:
              trainingBenefit:
                type: string
                description: Benefit category code, e.g. `"NONE"` (placeholder). Other values TBD.
              distributionPercent:
                type: number
                format: float
              trainingBenefitTotal:
                type: number
                format: float
                description: Raw value the percent was computed from (units depend on metric — likely seconds).
              nameForChart:
                type: string
              percentForChart:
                type: number
                format: float
        totalHeartRateZoneList:
          type: array
          description: Time spent in each HR zone across all sessions. Element shape TBD.
          items:
            type: object
            additionalProperties: true
        totalFitFatZonesList:
          type: array
          description: Time in fit/fat-burning zones. Element shape TBD.
          items:
            type: object
            additionalProperties: true
        totalPowerZoneList:
          type: array
          description: Time in cycling power zones. Element shape TBD.
          items:
            type: object
            additionalProperties: true
        totalSpeedZoneList:
          type: array
          description: Time in speed/pace zones. Element shape TBD.
          items:
            type: object
            additionalProperties: true
        totalTrainingSessionCount:
          type: integer
          description: Total number of training sessions in the date range.
        totalDistance:
          type: number
          format: float
          description: Total distance covered in **metres** (matches the rest of the API's metres convention).
        totalDuration:
          $ref: '#/components/schemas/StandardDuration'
        totalCalories:
          type: number
          format: float
          description: Total kcal burned across all sessions.
        totalAscent:
          type: number
          format: float
          description: Cumulative ascent in metres.
        totalDescent:
          type: number
          format: float
          description: Cumulative descent in metres.
      example:
        sportDistributions:
          duration:
          - sportName: Aucune donnée relative au sport
            distributionPercent: 100
            nameForChart: Aucune donnée relative au sport
            percentForChart: 100
            valueForChart: 0
          sessions:
          - sportName: Aucune donnée relative au sport
            distributionPercent: 100
            nameForChart: Aucune donnée relative au sport
            percentForChart: 100
            valueForChart: 0
          distance:
          - sportName: Aucune donnée relative au sport
            distributionPercent: 100
            nameForChart: Aucune donnée relative au sport
            percentForChart: 100
            valueForChart: 0
        trainingBenefitDistributionList:
        - trainingBenefit: NONE
          distributionPercent: 100
          trainingBenefitTotal: 0
          nameForChart: NONE
          percentForChart: 100
        totalHeartRateZoneList: []
        totalFitFatZonesList: []
        totalPowerZoneList: []
        totalSpeedZoneList: []
        totalTrainingSessionCount: 0
        totalDistance: 0
        totalDuration:
          standardDays: 0
          standardHours: 0
          standardMinutes: 0
          standardSeconds: 0
          millis: 0
        totalCalories: 0
        totalAscent: 0
        totalDescent: 0
    CalendarWeekSummary:
      type: object
      description: 'One week of the diary''s right-hand "week totals" strip, returned by

        `POST /training/getCalendarWeekSummary`.


        Captured 2026-10-02 on a week holding one manual session (30 min,

        250 kcal). The legacy calendar view (`Calendar.get.weekSummary`) reads

        only `week`, `durationMillis`, `distance` and `calories`, matching each

        entry to a calendar row by `week`; the units below for those four come

        from how it renders them (`getSecondsAsDuration(durationMillis / 1000)`,

        `metersToKm(distance)`, kcal). The 24/7 activity and sleep fields were

        all zero on this device-less account — their units are unverified.

        '
      required:
      - week
      - durationMillis
      - distance
      - calories
      - traininigSessionsCount
      properties:
        week:
          type: integer
          description: 'Week number — ISO 8601 for a Monday-first user (25–31 May 2026 →

            22). Carries no year, so a range spanning New Year yields e.g. 52

            then 1. # TODO: verify for a Sunday-first `firstDayOfWeek` user.

            '
          example: 22
        durationMillis:
          type: integer
          format: int64
          description: Total training duration of the week, **milliseconds**.
          example: 1800000
        distance:
          type: number
          format: double
          description: 'Total training distance of the week, **metres**. A session whose own

            `distance` is null counts as 0 (the observed manual session carried

            5000 m only at the exercise level and summed to `0.0`).

            '
          example: 0
        calories:
          type: integer
          description: Total training energy of the week, kcal.
          example: 250
        traininigSessionsCount:
          type: integer
          description: 'Number of training sessions in the week. The key is misspelled

            (`traininig`) on the wire — keep it verbatim.

            '
          example: 1
        exeCount:
          type: integer
          description: '`0` with one manual session recorded. # TODO: verify meaning

            (exercises recorded by a device?).

            '
          example: 0
        activeTime:
          type: integer
          description: 24/7 active time.
          example: 0
        inActiveTime:
          type: integer
          description: 24/7 inactive time.
          example: 0
        sleepTime:
          type: integer
          description: Sleep time.
          example: 0
        sleepQuality:
          type: number
          format: double
          description: Sleep quality.
          example: 0
        stepCount:
          type: integer
          description: Steps counted by a device over the week.
          example: 0
        distanceFromSteps:
          type: number
          format: double
          description: Distance estimated from steps.
          example: 0
        inactivityAlertCount:
          type: integer
          description: Inactivity alerts raised over the week.
          example: 0
        sleepPlus:
          type: boolean
          description: Whether Sleep Plus data backs the sleep fields.
          example: false
  responses:
    Unauthorized:
      description: 'Session cookie missing or expired. The body is a small JSON object with an `error` code and a `redirect`
        target (verified 2026-05-29 against `GET /api/account/users/current/user` with no valid session).


        ⚠ Distinct failure mode: an `/api/*` **write** sent without the `X-Requested-With: XMLHttpRequest` header is rejected
        by Play''s CSRF filter with **403** and an HTML `Unauthorized` body — not this JSON 401. Don''t conflate the two.

        '
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error code, e.g. `NotAuthenticated`.
              redirect:
                type: string
                description: Path the web app should redirect to (the login page).
            required:
            - error
          example:
            error: NotAuthenticated
            redirect: /
