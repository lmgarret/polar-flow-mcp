  /api/favoritetarget:
    post:
      summary: Create a favorite (training-target template)
      description: 'Creates a reusable training-target template. Body shape is identical

        to POST /api/trainingtarget minus the `datetime` field.


        **Saving an existing training target as a favorite** (target editor →

        "Ajouter aux favoris") has no endpoint of its own: the UI reads

        `GET /api/trainingtarget/{id}`, drops `datetime`, nulls each

        `exerciseTargets[].id` and the rolled-up `duration`, and POSTs the

        result here. The server assigns fresh phase ids; the source target is

        not linked to the favorite. Captured 2026-09-28.


        Validation (probed 2026-09-28): `name` 1–45 chars, `description`

        ≤ 500 chars (400 `ValidationError` otherwise). ⚠ Lenient spots:

        `exerciseTargets` missing or `[]` → 201 with a `FREE`-type favorite;

        an unknown or missing `sportId` → 201 stored verbatim / null. Invalid

        `type` enum → 500.

        '
      operationId: createFavorite
      tags:
      - favorites
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
