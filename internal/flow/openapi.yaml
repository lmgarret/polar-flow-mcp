  /api/sleep/report:
    get:
      summary: Sleep nights report
      description: "Returns one `SleepNight` per recorded night in the inclusive date range\n`[from, to]`. Lives on its own\
        \ subdomain — `https://sleep-api.flow.polar.com`\n— but reuses the `FLOW_SESSION` cookie via cross-origin credentials\n\
        (response carries `Access-Control-Allow-Credentials: true` and\n`Access-Control-Allow-Origin: https://flow.polar.com`).\n\
        \nBacked by the `getSleepNights` action in the Polar Flow JS bundle.\n\n### Range constraints (probed empirically\
        \ 2026-05-26)\n\n- `to - from` must be **≥ 30 days and ≤ 365 days**. Shorter or longer\n  ranges return `400` with\
        \ an empty body.\n- `from == to` (single day) → 400.\n- `from > to` → 400.\n\nThe 30-day floor is unusual — there's\
        \ no `/api/sleep/<date>` per-night\nendpoint (probed: 404), so to fetch a single night you must request the\nsurrounding\
        \ ≥30-day window and filter the response client-side.\n\n### Auth gotchas\n\n- Missing `X-Requested-With: XMLHttpRequest`\
        \ → 401 (the CSRF guard differs\n  from `flow.polar.com`'s — there 403, here 401).\n- The cross-origin CORS check\
        \ requires `Origin: https://flow.polar.com`,\n  which browsers set automatically when the calling page is on\n  `flow.polar.com`.\
        \ Non-browser clients must send it explicitly.\n- Empty body (`[]`) is the normal response on accounts with no synced\n\
        \  sleep-capable Polar device.\n"
      operationId: getSleepReport
      tags:
      - sleep
      servers:
      - url: https://sleep-api.flow.polar.com
        description: Sleep API (separate subdomain). Reuses FLOW_SESSION cookie via CORS.
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Inclusive start date (`YYYY-MM-DD`).
        example: '2026-02-25'
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Inclusive end date (`YYYY-MM-DD`). Must be ≥ 30 days and ≤ 365 days after `from`.
        example: '2026-05-26'
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: Array of sleep nights, one per night with recorded data. Empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SleepNight'
              example: []
        '400':
          description: 'Range invalid: too narrow (< 30 days inclusive), too wide (> 365 days),

            reversed (`from > to`), or malformed date format. Body is empty.

            '
        '401':
          description: 'Missing `X-Requested-With: XMLHttpRequest` header, missing/invalid

            `FLOW_SESSION` cookie, or CORS origin not whitelisted.

            '
  /progress/getProgressViewSummaryAsJson:
    post:
      summary: Training summary totals over a date range
      description: 'Returns aggregated training totals (sessions, distance, duration,

        calories, ascent/descent, zone time, sport distribution, training-benefit

        distribution) for the inclusive `[from, to]` date range.


        **Date format** here is `DD-MM-YYYY` with **dashes and leading zeros**

        (observed live: `{"from":"01-06-2026","to":"30-06-2026"}`) — note this

        differs from the dot-separated `D.M.YYYY` used by

        `/training/getCalendarWeekSummary` and `/training/getCalendarEvents`.

        The endpoint is lenient: it accepts malformed/missing dates without

        erroring on a zero-session account (it just returns zeros), so the

        dash form is what the UI sends rather than a hard requirement — strict

        validation behaviour on populated accounts is TBD.


        The Polar Flow JS bundle has a Coach-vs-free fork that picks

        `/progress/getSummaryDataAsJson` for Coach users and this URL for

        regular users — but **both URLs are reachable from a free account** and

        return the same schema. The "Coach gate" is purely client-side.

        '
      operationId: getProgressViewSummary
      tags:
      - progress
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              - to
              properties:
                from:
                  type: string
                  description: Inclusive start date, `DD-MM-YYYY` (dashes, leading zeros).
                  example: 01-06-2026
                to:
                  type: string
                  description: Inclusive end date, `DD-MM-YYYY` (dashes, leading zeros).
                  example: 30-06-2026
                group:
                  type: string
                  description: 'Time-bucket granularity for the breakdown — **not** a sport

                    filter (earlier guess was wrong). Observed live value:

                    `"MONTH"`. Other diary granularities (`DAY`/`WEEK`/`YEAR`)

                    are likely but unverified. # TODO: confirm full enum.

                    '
                  example: MONTH
                timeFrame:
                  type: string
                  description: 'Bucket size for the per-time-slice breakdowns. JS values

                    observed: `"6w"`, `"3m"`, `"1y"`. The server accepted

                    arbitrary strings (including empty / omitted) on the test

                    account, so it likely only influences how the breakdown is

                    grouped, not whether the request succeeds.

                    '
                  example: 6w
            examples:
              monthBucket:
                summary: Live-observed body from the diary report view.
                value:
                  from: 01-06-2026
                  to: 30-06-2026
                  group: MONTH
                  timeFrame: 6w
      responses:
        '200':
          description: Aggregated totals + distributions. Always returned with zeros on accounts with no recorded sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressViewSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /progress/getSummaryDataAsJson:
    post:
      summary: Training summary totals (Coach variant — same shape as getProgressViewSummaryAsJson)
      description: "Identical request/response shape to\n[POST /progress/getProgressViewSummaryAsJson](#operations-progress-getProgressViewSummary).\n\
        The Polar Flow JS bundle routes Coach users to this URL via:\n\n```js\nCommonHelpers.context.coach\n  ? \"/progress/getSummaryDataAsJson\"\
        \n  : \"/progress/getProgressViewSummaryAsJson\"\n```\n\nOn the free test account, both URLs return the same payload,\
        \ so the\nserver-side ACL (if any) is permissive. This alias is documented for\ncompleteness; clients should prefer\
        \ `getProgressViewSummaryAsJson`.\n"
      operationId: getSummaryData
      tags:
      - progress
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              - to
              properties:
                from:
                  type: string
                  description: Inclusive start, `DD-MM-YYYY` (dashes).
                  example: 01-06-2026
                to:
                  type: string
                  description: Inclusive end, `DD-MM-YYYY` (dashes).
                  example: 30-06-2026
                group:
                  type: string
                  description: Time-bucket granularity (e.g. `MONTH`), not a sport filter.
                  example: MONTH
                timeFrame:
                  type: string
                  example: 6w
      responses:
        '200':
          description: See `ProgressViewSummary`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressViewSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /training/getCalendarWeekSummary:
    post:
      summary: Weekly summary strip for the diary calendar
      description: "Returns one summary entry per ISO week intersecting `[from, to]`, used by\nthe right-hand \"week totals\"\
        \ strip in `/diary`. Backed by the legacy\n`Calendar.get.weekSummary` action in\n`static/13.318.0/javascript/views/diary/calendar.min.js`.\n\
        \n### Constraints (probed 2026-05-26)\n\n- Date format: **`D.M.YYYY`** strict (ISO 8601 rejected with\n  `content\
        \ of from (...) is not a valid date: Text '...' could not be\n  parsed at index 4`).\n- `to` must be ≥ `from` (reversed\
        \ → `400 from (...) date must be before\n  to (...) date`).\n- **`to - from ≤ 45 days`** (\"Maximum week aligned range\
        \ is 45,\n  requested N\" beyond that). Same-day and partial-week ranges are OK —\n  the \"week aligned\" label in\
        \ the error is misleading; the server does\n  not require Monday-aligned dates.\n\nReturns an array of week-summary\
        \ objects on success. Empty array (`[]`)\nwhen no sessions fall in the range — element shape on populated accounts\n\
        is TBD.\n"
      operationId: getCalendarWeekSummary
      tags:
      - calendar
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              - to
              properties:
                from:
                  type: string
                  description: Inclusive start date, `D.M.YYYY`.
                  example: 24.5.2026
                to:
                  type: string
                  description: Inclusive end date, `D.M.YYYY`. Must satisfy `to - from ≤ 45 days`.
                  example: 30.5.2026
      responses:
        '200':
          description: 'One entry per ISO week touched by the range. Empty array when no

            sessions are recorded. # TODO: capture a populated week to learn

            the element shape (likely

            `{weekNumber, totalDuration, totalDistance, totalCalories, …}`).

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example: []
        '400':
          description: 'Range invalid (reversed, > 45 days) or date format not `D.M.YYYY`.

            Body is a plain-text Play error message — not JSON.

            '
          content:
            text/plain:
              schema:
                type: string
              examples:
                tooWide:
                  value: Maximum week aligned range is 45, requested 365
                reversed:
                  value: from (2026-05-30) date must be before to (2026-05-24) date
                badFormat:
                  value: 'content of from (2026-05-24) is not a valid date: Text ''2026-05-24'' could not be parsed at index
                    4'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: FLOW_SESSION
      description: 'RS256 JWT session token issued by auth.polar.com after a successful

        SSO login. This is the **only** load-bearing cookie — PLAY_SESSION_FLOW,

        AWSALB, AWSALBCORS, timezone, PLAY_LANG are all optional (probed

        2026-05-25). JWT TTL ≈ 1h; refresh by following the silent OAuth

        re-auth flow documented in docs/auth.md.

        '
  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum:
        - XMLHttpRequest
        default: XMLHttpRequest
        example: XMLHttpRequest
      description: 'CSRF defense on /api/* write operations. Play''s CSRF filter is

        configured to whitelist requests carrying this header (browsers

        cannot set it on cross-origin form submissions). Without it: 403

        with an "Unauthorized" HTML body — easy to mistake for an auth

        failure. Must equal `XMLHttpRequest`.

        '
    TrainingTargetId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1454046259
      description: Training target numeric ID (e.g. 1454046259), as returned in the create response body.
    TrainingSessionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Training session numeric ID (e.g. 8346808740)
      example: 8346808740
    FavoriteId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 'Numeric favorite id (the `favoriteId` field in

        `GET /api/favorites.targets[]`). Distinct from `exerciseTargetId`.

        '
      example: 81371573
  schemas:
    PhaseLeaf:
      type: object
      description: 'A leaf training phase (no nested phases). A single PhaseLeaf placed directly in `exerciseTargets[].phases`
        is the idiomatic way to model a **continuous steady block** (e.g. a 45-min Z2 run) — no REPEAT wrapper is needed (verified
        via probe-C-steady-hrz.json). For repeated intervals, wrap leaves in a PhaseRepeat instead.

        '
      required:
      - phaseType
      - name
      - phaseChangeType
      - goalType
      - intensityType
      properties:
        id:
          type: number
          readOnly: true
          description: 'Phase id assigned by the server; present on read responses (`GET /api/trainingtarget/{id}`). Send
            nothing on create.

            '
          example: 2912772577
          nullable: true
        phaseType:
          type: string
          enum:
          - PHASE
          description: Constant `"PHASE"` discriminator for leaf phases.
        name:
          type: string
          description: 'Free-text phase label shown per-phase in the workout breakdown

            (e.g. `Warm-up`, `Work`, `Recovery`, `Cool-down` — verified on a live

            named-phase target). Independent of `intensityType`: a `NONE`-intensity

            phase still carries its own name. Required when `intensityType` is not

            HEART_RATE_ZONES (submission fails with "Ce champ est obligatoire."

            otherwise). For HR-zone phases an empty string is accepted.

            '
          example: Work
        phaseChangeType:
          type: string
          enum:
          - AUTOMATIC
          - MANUAL
          description: '"AUTOMATIC" — next phase starts automatically when the goal is reached.

            "MANUAL" — wait for user input (verified via capture 10-phased-manual.json).

            '
        goalType:
          type: string
          enum:
          - DISTANCE
          - DURATION
          description: '**Authoritative discriminator** for the phase goal. A client MUST read `goalType` to decide whether
            the phase is distance- or duration-based — do NOT infer it from "which of `distance`/`duration` is non-null".
            On `GET /api/trainingtarget/{id}` a `goalType: DISTANCE` leaf reads back with BOTH `distance` AND a phantom `duration:
            "00:00:00"` set (see those fields), so the field-presence heuristic gives the wrong answer and is the root cause
            of round-trip update bugs (verified 2026-06-08, probe-E-roundtrip-update.json).

            '
        distance:
          type: number
          description: 'Phase distance in **metres** (not km). On **create** it is non-null iff `goalType: DISTANCE` (null
            otherwise). On **read-back** the asymmetry is: `goalType: DURATION` leaves OMIT this field entirely, while `goalType:
            DISTANCE` leaves carry it. Always trust `goalType`, not this field''s presence.

            '
          example: 5000
          nullable: true
        duration:
          type: string
          description: 'Phase duration as `"HH:MM:SS"` (strict — partial `MM:SS` is rejected by the UI validator). On **create**
            it is non-null iff `goalType: DURATION`. **Read-back asymmetry:** a `goalType: DISTANCE` leaf reads back with
            a phantom `duration: "00:00:00"` *in addition to* its real `distance` (verified 2026-06-08, probe-E-roundtrip-update.json)
            — so a phase can have both `distance` and a non-null `duration` on read. The server ignores this phantom value
            when the body is fed back into an update (`distance` is preserved), so the GET body round-trips safely; just never
            use it to infer the goal. A genuine zero `"00:00:00"` on a `goalType: DURATION` leaf is also accepted and preserved
            (probe-B-zero-duration.json).

            '
          example: 00:45:00
          nullable: true
        intensityType:
          type: string
          enum:
          - HEART_RATE_ZONES
          - SPEED_ZONES
          - POWER_ZONES
          - NONE
          description: 'Intensity metric for the phase. All four values verified from captures.

            Toggling off "Utiliser les zones d''entraînement" in the UI sets this to

            "NONE" and nulls both zones. POWER_ZONES requires a power-capable sport

            (e.g. CYCLING, sportId 2) — verified via capture 11-phased-power.json.

            '
        lowerZone:
          type: number
          minimum: 0
          maximum: 5
          description: 'Lower zone bound (1–5) when `intensityType != NONE`. **Send/read asymmetry:** the create payload nulls
            both zones for `NONE` phases, but the server reads them back as `0` (a "no zone" sentinel — verified on a live
            named-phase target), not null. Accept both `0` and `null`.

            '
          nullable: true
        upperZone:
          type: number
          minimum: 0
          maximum: 5
          description: 'Upper zone bound (1–5) when `intensityType != NONE`. Same send/read asymmetry as `lowerZone`: `NONE`
            phases read back as `0`, not null.

            '
          nullable: true
      example:
        phaseType: PHASE
        name: Z2 steady
        phaseChangeType: AUTOMATIC
        goalType: DURATION
        distance: null
        duration: 00:45:00
        intensityType: HEART_RATE_ZONES
        lowerZone: 2
        upperZone: 2
    PhaseRepeat:
      type: object
      description: 'A repeat-group phase that loops a nested list of PHASE leaves `repeatCount` times. Used for interval blocks
        (e.g. "4 × 3 min hard"). The UI labels it "+ Répéter les phases".


        **Recovery is optional.** A REPEAT may contain a single work phase with no trailing recovery leaf — the server accepts
        it (verified via probe probe-D-no-recovery.json: a `repeatCount:4` group with one work phase returned 201 and rolled
        its nested duration into the exerciseTarget''s top-level `duration`, 4 × `"00:03:00"` → `"00:12:00"`). To add recovery
        between reps, append a second PHASE leaf (typically `intensityType:"NONE"`) inside `phases`.


        **To model a single continuous block, do NOT use a REPEAT with `repeatCount:1`** — use a bare `PhaseLeaf` directly
        in `exerciseTargets[].phases` instead (see PhaseLeaf example). A `repeatCount:1` REPEAT is accepted but the server
        silently unwraps it into a plain PHASE leaf on read-back (verified via probe-A-repeatcount1.json).


        Nesting is supported by the schema but rejected by the UI beyond depth 1.

        '
      required:
      - phaseType
      - repeatCount
      - phases
      properties:
        phaseType:
          type: string
          enum:
          - REPEAT
          description: Constant `"REPEAT"` discriminator for repeat groups.
        repeatCount:
          type: integer
          minimum: 1
          description: 'Number of times the nested phases are repeated. The **wire API accepts 1** and normalizes a single-rep
            group to a bare PHASE on read-back (probe probe-A-repeatcount1.json). The **UI** enforces a minimum of 2 — but
            that is a client-only constraint, not a server rule. Use ≥ 2 for real intervals; for a single block prefer a bare
            PhaseLeaf (no REPEAT wrapper).

            '
          example: 4
        phases:
          type: array
          minItems: 1
          description: 'Nested PHASE leaves looped `repeatCount` times. One leaf = a recovery-less interval; two leaves (work
            + rest) = a classic interval with recovery.

            '
          items:
            $ref: '#/components/schemas/PhaseLeaf'
        id:
          type: number
          readOnly: true
          description: 'Phase id assigned by the server. Absent on REPEAT groups in observed read-backs (only the nested leaves
            carry ids); send nothing on create.

            '
          nullable: true
      example:
        phaseType: REPEAT
        repeatCount: 4
        phases:
        - phaseType: PHASE
          name: work
          phaseChangeType: AUTOMATIC
          goalType: DURATION
          distance: null
          duration: 00:03:00
          intensityType: HEART_RATE_ZONES
          lowerZone: 4
          upperZone: 5
        - phaseType: PHASE
          name: recovery
          phaseChangeType: AUTOMATIC
          goalType: DURATION
          distance: null
          duration: 00:02:00
          intensityType: NONE
          lowerZone: null
          upperZone: null
    Phase:
      oneOf:
      - $ref: '#/components/schemas/PhaseLeaf'
      - $ref: '#/components/schemas/PhaseRepeat'
      discriminator:
        propertyName: phaseType
        mapping:
          PHASE: '#/components/schemas/PhaseLeaf'
          REPEAT: '#/components/schemas/PhaseRepeat'
      description: 'A single phase within a PHASED training target''s exerciseTarget.phases array.

        Verified from captured POST bodies for HEART_RATE_ZONES, SPEED_ZONES, POWER_ZONES,

        and NONE intensity variants and for both `phaseChangeType` values (AUTOMATIC,

        MANUAL). Repeat groups carry `phaseType:"REPEAT"` (NOT "GROUP" — the JS bundle''s

        internal constant `k.$l.REPEAT` is the wire value) and wrap nested PHASE objects

        with a `repeatCount` integer.

        '
      example:
        phaseType: PHASE
        name: Z2 steady
        phaseChangeType: AUTOMATIC
        goalType: DURATION
        distance: null
        duration: 00:45:00
        intensityType: HEART_RATE_ZONES
        lowerZone: 2
        upperZone: 2
    ExerciseTarget:
      type: object
      description: A single exercise block within a training target
      required:
      - sportId
      - phases
      properties:
        index:
          type: integer
          readOnly: true
          description: 'Server-assigned 0-based ordering index. Present only on read responses

            (`GET /api/trainingtarget/{id}`). Do not send on create.

            '
          example: 0
        sportId:
          type: integer
          description: Polar sport identifier. 1 = Course à pied (running).
          example: 1
        duration:
          type: string
          description: 'Target duration in HH:MM:SS format. On **create**: null for PHASED targets (each phase carries its
            own). On **read-back**: for PHASED targets the server **rolls up** the phase durations into this field, so it
            is non-null even though you sent null. Send it back unchanged on update — the server recomputes it and ignores
            what you send.

            '
          example: 01:00:00
          nullable: true
        distance:
          type: number
          description: 'Target distance in **metres** (the UI shows km but the wire value is metres — UI 5 km → payload 5000).
            Null when not distance-based on **create**; for PHASED targets the server **rolls up** the phase distances into
            this field on **read-back** (same as `duration`).

            '
          example: 5000
          nullable: true
        calories:
          type: number
          description: Target calorie burn (kcal). Null when not calorie-based.
          nullable: true
        phases:
          type: array
          description: 'Structured phases (e.g. warm-up / main / cool-down). Empty `[]` for VOLUME /

            STEADY_RACE_PACE targets; populated for PHASED targets.

            '
          items:
            $ref: '#/components/schemas/Phase'
        id:
          type: number
          description: Populated by the server on create; send null when creating.
          nullable: true
    TrainingTargetCreate:
      type: object
      description: Payload to create a new training target
      required:
      - type
      - name
      - datetime
      - exerciseTargets
      properties:
        type:
          type: string
          enum:
          - VOLUME
          - STEADY_RACE_PACE
          - PHASED
          description: "Target category, drives which `exerciseTargets[i]` fields are populated.\n- \"VOLUME\" — single-metric\
            \ target. Exactly one of `duration` / `distance` /\n  `calories` is non-null; `phases` is `[]`.\n- \"STEADY_RACE_PACE\"\
            \ — time-trial. Both `duration` and `distance` are\n  populated; pace is implicit (UI lets user enter any 2 of\
            \ 3).\n- \"PHASED\" — multi-phase workout. `phases` is populated; volume fields\n  on the exerciseTarget are null\
            \ (each phase carries its own).\nAll three values verified from captured POST bodies (2026-05-25).\n"
        name:
          type: string
          description: Display name shown in the diary
        description:
          type: string
          description: Free-text notes. The create form sends an empty string when not provided, but the server stores and
            returns `null` on read-back — so this must be nullable to decode a target created without a description.
          default: ''
          nullable: true
        datetime:
          type: string
          description: 'Local date-time of the planned workout, ISO 8601 without timezone offset

            (e.g. "2026-05-24T10:00"). The server applies the user''s timezone setting.

            '
          example: 2026-05-24T10:00
        exerciseTargets:
          type: array
          description: 'One entry per exercise block. Most targets have exactly one;

            multi-sport workouts (e.g. duathlon: run then bike) pass multiple

            entries — verified via capture 13-multisport.json. On read-back, the

            server assigns each entry a sequential `index` (0, 1, …) to preserve

            ordering.

            '
          minItems: 1
          items:
            $ref: '#/components/schemas/ExerciseTarget'
    ValidationError:
      type: object
      description: 'Field-keyed validation errors. Each key maps to an array of error code strings.

        '
      additionalProperties:
        type: array
        items:
          type: string
      example:
        time:
        - error.trainingTarget.twoTargetsForSameTime
    CalendarEvent:
      type: object
      description: 'A diary entry returned by /training/getCalendarEvents. The array is polymorphic by `type`: `TRAININGTARGET`
        (planned workout), `FITNESSDATA` (a fitness-test result), `EXERCISE` (a recorded session), etc. Different `type`s
        populate different subsets of these properties — e.g. only the `FITNESSDATA` variant carries the calendar-styling
        fields (`backgroundColor`/`borderColor`/`textColor`) and `index`/`timestamp`, while `TRAININGTARGET` carries the target
        rollups (`calories`/`distance`/ `duration`). Treat all properties below as optional per event.

        '
      properties:
        type:
          type: string
          description: Event category, e.g. "TRAININGTARGET", "FITNESSDATA", "EXERCISE"
          example: TRAININGTARGET
        ListItemId:
          type: integer
          description: Numeric ID of the underlying entity (use as {id} in /api/trainingtarget/{id}). **Casing quirk:** `TRAININGTARGET`
            events use Pascal-case `ListItemId`, but `FITNESSDATA` events use camel-case `listItemId` (see below) for the
            same concept.
          example: 1453744955
        listItemId:
          type: integer
          description: camelCase variant of `ListItemId` emitted by `FITNESSDATA` events. Same meaning (entity id); the inconsistent
            casing is server-side.
          example: 87794279
        title:
          type: string
          example: 60 min easy run
        description:
          type: string
          description: Free-text notes on the event. `TRAININGTARGET` events send an empty string when blank; `EXERCISE` (recorded
            session) events send `null` when absent — so nullable, not just empty (observed live 2026-07).
          nullable: true
        start:
          description: 'Event start. Polymorphic by event type: TRAININGTARGET events send an ISO 8601 UTC datetime string,
            while EXERCISE events send a numeric epoch (seconds, e.g. 1779872400). Left untyped (free-form) to accept either.'
          example: '2026-05-24T10:00:00.000Z'
        allDay:
          description: 'Whether the event spans the whole day. Polymorphic: the server sends a boolean (observed live) and
            historically a string ("true"/"false") for some event types — left untyped to accept either.'
        url:
          type: string
          description: Relative URL to the target detail page
          example: /target/1453744955
        className:
          type: string
          description: CSS class used by the Flow calendar to render the event icon.
          example: training-target-icon
        eventType:
          type: string
          description: Lower-camel event kind (e.g. `trainingTarget`).
          example: trainingTarget
        eventId:
          type: integer
          description: Secondary event id; null for training targets.
          nullable: true
        sourceProgramType:
          type: string
          description: Origin program of the event (e.g. `UNKNOWN`); null when not applicable.
          nullable: true
        isUserEditable:
          type: boolean
          description: True when the signed-in user may edit/delete the event.
        iconUrl:
          type: string
          format: uri
          description: Sport/event icon URL.
          nullable: true
        datetime:
          type: string
          description: Local datetime of the event (no timezone), e.g. `2026-06-02T09:00:00.000`.
          example: '2026-06-02T09:00:00.000'
          nullable: true
        calories:
          type: number
          description: Target calories (kcal), or null.
          nullable: true
        distance:
          type: number
          description: Target distance in metres. Present for distance-based targets; null otherwise.
          nullable: true
        duration:
          type: integer
          description: 'Target duration in **milliseconds**. Present for duration-based targets (and 0 for a zero-duration
            phase); **omitted entirely** for distance-goal targets that carry no rolled-up duration (verified via capture
            20-calendar-events.json).

            '
          nullable: true
        backgroundColor:
          type: string
          description: 'Calendar swatch background (hex). Emitted by `FITNESSDATA` events for diary rendering; absent on `TRAININGTARGET`.

            '
          example: '#E0F2F7'
        borderColor:
          type: string
          description: Calendar swatch border (hex). `FITNESSDATA` only.
          example: '#A9D0F5'
        textColor:
          type: string
          description: Calendar swatch text colour (hex). `FITNESSDATA` only.
          example: '#000'
        index:
          type: integer
          description: 'Per-day render ordering index for the diary view. Observed on `FITNESSDATA` events.

            '
          example: 47
        timestamp:
          type: integer
          description: 'Epoch-milliseconds form of `start`/`datetime`. Observed on `FITNESSDATA` events.

            '
          example: 1780299813000
      example:
        type: TRAININGTARGET
        ListItemId: 1453775725
        title: explore-phased
        description: ''
        start: '2026-06-02T09:00:00.000Z'
        allDay: 'false'
        url: /target/1453775725
        className: training-target-icon
        eventType: trainingTarget
        eventId: null
        sourceProgramType: UNKNOWN
        isUserEditable: true
        iconUrl: https://platform.cdn.polar.com/ecosystem/sport/icon/808d0882e97375e68844ec6c5417ea33-2024-04-16_06_01_39
        datetime: '2026-06-02T09:00:00.000'
        calories: null
        distance: 5000
        duration: 600000
      x-ogen-properties:
        listItemId:
          name: ListItemId1
