        hasRRsamples: false
        trimmed: false
    SampleBlock:
      type: object
      description: 'Per-exercise time-series samples, one entry per recorded metric. Each value is

        `null` until a device populates it (a manually-entered session has every metric

        null — verified via capture 23-analysis-details.json). The populated value shape

        is not yet captured — likely an array of numbers or an object

        `{samplingRate, values:[]}`. TODO: confirm with a device-uploaded session.

        '
      properties:
        HEART_RATE:
          description: Heart-rate samples (bpm), or null.
          nullable: true
        SPEED:
          description: Speed samples, or null.
          nullable: true
        DISTANCE:
          description: Cumulative distance samples, or null.
          nullable: true
        CADENCE:
          description: Cadence samples (rpm/spm), or null.
          nullable: true
        ALTITUDE:
          description: Altitude samples (m), or null.
          nullable: true
        POWER:
          description: Power samples (W), or null.
          nullable: true
        POWER_BALANCE:
          description: Left/right power balance samples, or null.
          nullable: true
        LEFT_PEDAL_CRANK_BASED_POSITIVE_FORCE:
          description: Left-pedal crank force samples, or null.
          nullable: true
        RIGHT_PEDAL_CRANK_BASED_POSITIVE_FORCE:
          description: Right-pedal crank force samples, or null.
          nullable: true
        STRIDE_LENGTH:
          description: Stride-length samples (m), or null.
          nullable: true
        TEMPERATURE:
          description: Ambient temperature samples (°C), or null.
          nullable: true
        BODY_TEMPERATURE:
          description: Body temperature samples (°C), or null.
          nullable: true
      example:
        HEART_RATE: null
        TEMPERATURE: null
        CADENCE: null
        RIGHT_PEDAL_CRANK_BASED_POSITIVE_FORCE: null
        STRIDE_LENGTH: null
        ALTITUDE: null
        SPEED: null
        BODY_TEMPERATURE: null
        POWER: null
        DISTANCE: null
        POWER_BALANCE: null
        LEFT_PEDAL_CRANK_BASED_POSITIVE_FORCE: null
    SessionDetails:
      type: object
      description: 'Response of GET /api/training/analysis/{id}/details. Time-series

        samples, laps, zones, etc. For a manual session all

        `samples[*][METRIC]` are null.

        '
      properties:
        id:
          type: integer
          format: int64
          description: Training session id (matches the `{id}` in the path).
          example: 8349588454
        periodDataUuid:
          type: string
          description: UUID of associated period data; null when none.
          nullable: true
        exercises:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SessionExercise'
        samples:
          type: object
          description: 'Object keyed by exerciseId, each containing a per-metric

            sample block. All metrics null for manual sessions.

            '
          additionalProperties:
            $ref: '#/components/schemas/SampleBlock'
        zones:
          type: object
          description: 'Time-in-zone distributions, keyed by exerciseId. Empty

            object for manual sessions; populated by device upload.

            Shape when populated TBD.

            '
          additionalProperties:
            type: object
            additionalProperties: true
        laps:
          type: object
          additionalProperties:
            type: object
            properties:
              automaticLaps:
                type: array
                items: {}
              manualLaps:
                type: array
                items: {}
        periodData:
          description: Opaque per-period payload; null when absent. Left untyped (free-form) so it accepts both null and an
            object, since ogen does not honour nullable on an empty object schema.
        swimDatas:
          type: object
          description: Per-exercise swim metrics; empty unless swim sport.
          additionalProperties: true
        pauseTimeData:
          description: Per-exercise pause-time arrays, keyed by exerciseId. Left untyped (free-form) because a key's value
            may be null (not an array) for some sessions.
        defaultHrZones:
          description: Per-exercise default HR zone arrays, keyed by exerciseId. Left untyped (free-form) because a key's
            value may be null (not an array) for some sessions.
        errors:
          type: object
          description: 'Parsing/quality issues, keyed by exerciseId. Empty when clean.

            '
          additionalProperties: true
        exerciseResultTargetData:
          type: object
          description: 'Comparison to a planned training target. Populated only when

            the session was linked to a target (`hasTrainingTarget=true`

            in the history listing).

            '
          additionalProperties: true
      example:
        id: 8349588454
        periodDataUuid: null
        exercises:
          '8379162593':
            id: 8379162593
            sport:
              id: 1
            startTime: '2026-05-28T08:00:00'
            stopTime: '2026-05-28T08:30:00'
            duration: PT30M
            distance: 5000
            calories: 350
            trainingStatistic:
              HEART_RATE:
                max: 0
                avg: 0
                min: null
            sportParent: RUNNING
            defaultSpeedViewSettings: PACE
        samples:
          '8379162593':
            HEART_RATE: null
            SPEED: null
            CADENCE: null
            ALTITUDE: null
            POWER: null
            DISTANCE: null
        zones:
          '8379162593': {}
        laps:
          '8379162593':
            automaticLaps: []
            manualLaps: []
        periodData: null
        swimDatas: {}
        pauseTimeData:
          '8379162593': []
        defaultHrZones:
          '8379162593': []
        errors: {}
        exerciseResultTargetData: {}
    RoutePoint:
      type: object
      description: One trackpoint of a route.
      required:
      - latitude
      - longitude
      - altitude
      - distance
      properties:
        latitude:
          type: number
          description: WGS84 latitude, degrees.
        longitude:
          type: number
          description: WGS84 longitude, degrees.
        altitude:
          type: number
          description: Elevation in metres above sea level. Use 0 if absent in source.
        distance:
          type: number
          description: '**Cumulative** distance from route start, in metres

            (haversine on lat/lon). The first point is `0`.

            '
      example:
        latitude: 48.8576
        longitude: 2.3532
        altitude: 36
        distance: 133.10381572631718
    RouteImport:
      type: object
      description: 'Request body for POST /api/favorites/trainingTargets/importRoute.

        Built client-side from a parsed GPX/TCX file. Each trackpoint

        carries its **cumulative** distance from the start, in metres.

        '
      required:
      - route
      - name
      - distance
      properties:
        route:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoutePoint'
        sport:
          type: integer
          description: 'sportId from /api/sports/sports, or null for sport-agnostic.

            '
          nullable: true
        name:
          type: string
          description: Route name (typically from `<gpx><metadata><name>`).
        distance:
          type: number
          description: 'Total route length in metres. Equals the last trackpoint''s

            cumulative `distance`.

            '
      example:
        route:
        - latitude: 48.8566
          longitude: 2.3522
          altitude: 35
          distance: 0
        - latitude: 48.8576
          longitude: 2.3532
          altitude: 36
          distance: 133.10381572631718
        sport: null
        name: doc-route
        distance: 532.4104430899847
    Waypoint:
      type: object
      description: 'Read-back waypoint shape. Field names differ from the upload

        `RoutePoint`: instead of cumulative `distance`, the server

        synthesizes a sequence `time` in milliseconds (1000ms per point

        regardless of original GPS sampling — for the watch''s navigation

        ordering, not for actual elapsed time).

        '
      required:
      - latitude
      - longitude
      - time
      properties:
        latitude:
          type: number
          description: WGS84 latitude, degrees.
        longitude:
          type: number
          description: WGS84 longitude, degrees.
        altitude:
          type: number
          description: Elevation in metres above sea level.
        time:
          type: integer
          description: 'Sequence index in milliseconds (0, 1000, 2000, …). NOT actual

            elapsed time, since the original GPX usually has no

            timestamps.

            '
      example:
        longitude: 2.3532
        latitude: 48.8576
        altitude: 36
        time: 1000
    GpsRoute:
      type: object
      description: 'Full route geometry. Returned by

        `GET /api/favorites/exerciseTarget/{exerciseTargetId}` for ROUTE

        favorites.

        '
      required:
      - waypoints
      - distance
      - startPoint
      properties:
        id:
          type: integer
          description: 'Internal route id — observed null in responses; Polar tracks

            routes by their parent exerciseTargetId.

            '
          nullable: true
        user:
          type: object
          description: Owner reference.
          required:
          - id
          properties:
            id:
              type: integer
              format: int64
              description: Owning user's numeric id.
        name:
          type: string
          description: Route name (from the imported file's metadata).
        parentRouteId:
          type: integer
          description: Parent route id for derived routes; null for top-level imports.
          nullable: true
        order:
          type: integer
          description: Ordering hint; observed null.
          nullable: true
        distance:
          type: number
          description: Total length, metres.
        startPoint:
          $ref: '#/components/schemas/Waypoint'
        waypoints:
          type: array
          description: Ordered track points. The server synthesizes `time` as a 1000ms sequence index.
          items:
            $ref: '#/components/schemas/Waypoint'
      example:
        id: null
        user:
          id: 11111111
        startPoint:
          longitude: 2.3522
          latitude: 48.8566
          altitude: 35
          time: 0
        name: doc-route
        order: null
        parentRouteId: null
        waypoints:
        - longitude: 2.3522
          latitude: 48.8566
          altitude: 35
          time: 0
        - longitude: 2.3532
          latitude: 48.8576
          altitude: 36
          time: 1000
        distance: 532.4104430899847
    FavoriteExerciseTarget:
      type: object
      description: 'Response of GET /api/favorites/exerciseTarget/{exerciseTargetId}.

        For ROUTE-type favorites this is the only place to read back the

        uploaded GPS waypoints.

        '
      properties:
        id:
          type: integer
          format: int64
          description: exerciseTargetId (the inner id — pass THIS, not favoriteId, in the URL).
          example: 1530890883
        type:
          type: string
          enum:
          - VOLUME
          - STEADY_RACE_PACE
          - PHASED
          - ROUTE
          description: Favorite kind. `ROUTE` carries GPS geometry in `gpsRoute`.
        distance:
          type: number
          description: Total distance in metres, or null.
          nullable: true
        duration:
          type: string
          description: HH:MM:SS or null. Null for ROUTE favorites.
          nullable: true
        kiloCalories:
          type: integer
          description: Target kcal, or null.
          nullable: true
        index:
          type: integer
          description: Position in a multi-target sequence (null for single targets).
          nullable: true
        modified:
          type: string
          description: Observed null even after edits — TBD.
          nullable: true
        created:
          type: string
          description: Creation timestamp; observed null in captures — TBD.
          nullable: true
        segmentId:
          type: integer
          description: Populated for Strava-segment favorites.
          nullable: true
        routeServiceRoute:
          description: Populated for Strava/Komoot-imported routes. Shape TBD.
        favoritePhases:
          type: array
          description: Populated only for PHASED favorites.
          items:
            $ref: '#/components/schemas/Phase'
        sport:
          description: 'Sport object when set, null otherwise. Shape per

            `FavoriteSimple.sport`.

            '
        gpsRoute:
          oneOf:
          - $ref: '#/components/schemas/GpsRoute'
          - type: 'null'
          description: GPS geometry. Present (non-null) for ROUTE type.
      example:
        distance: 532.4104430899847
        duration: null
        id: 1530890883
        index: null
        kiloCalories: null
        modified: null
        created: null
        type: ROUTE
        routeServiceRoute: null
        segmentId: null
        gpsRoute:
          id: null
          user:
            id: 11111111
          startPoint:
            longitude: 2.3522
            latitude: 48.8566
            altitude: 35
            time: 0
          name: doc-route
          order: null
          parentRouteId: null
          waypoints:
          - longitude: 2.3522
            latitude: 48.8566
            altitude: 35
            time: 0
          - longitude: 2.3532
            latitude: 48.8576
            altitude: 36
            time: 1000
          distance: 532.4104430899847
        favoritePhases: []
        sport: null
    FavoriteCreate:
      type: object
      description: 'Request body for POST /api/favoritetarget. Identical to

        TrainingTargetCreate minus the `datetime` field — a favorite is a

        date-less template.

        '
      required:
      - type
      - name
      - exerciseTargets
      properties:
        type:
          type: string
          enum:
          - VOLUME
          - STEADY_RACE_PACE
          - PHASED
          description: Favorite kind — see TrainingTargetCreate.type for the per-value field rules.
        name:
          type: string
          description: Favorite display name (required).
        description:
          type: string
          description: Free-text notes; send empty string when none.
        exerciseTargets:
          type: array
          description: 'One block per exercise; send `id: null` on each (server assigns).'
          items:
            $ref: '#/components/schemas/ExerciseTarget'
      example:
        type: VOLUME
        name: doc-fav-distance
        description: seed for capture
        exerciseTargets:
        - sportId: 1
          distance: 5000
          calories: null
          duration: null
          phases: []
          id: null
    Favorite:
      type: object
      description: 'Response body of GET /api/favoritetarget/{id} and request body of

        POST /api/favoritetarget/{id} (update). Adds `index` (and the

        existing `id`) fields to each exerciseTarget vs the create shape.

        '
      required:
      - type
      - name
      - exerciseTargets
      properties:
        type:
          type: string
          enum:
          - VOLUME
          - STEADY_RACE_PACE
          - PHASED
          description: Favorite kind (same set as a training target; no datetime).
        name:
          type: string
          description: Favorite display name.
        description:
          type: string
          description: Free-text notes; empty string when not set.
        exerciseTargets:
          type: array
          description: One block per exercise (multi-sport favorites have several).
          items:
            allOf:
            - $ref: '#/components/schemas/ExerciseTarget'
            - type: object
              properties:
                index:
                  type: integer
                  description: Position within the exerciseTargets array.
      example:
        name: doc-fav-distance
        description: seed for capture
        type: VOLUME
        exerciseTargets:
        - id: 1530890882
          duration: null
          distance: 5000
          calories: null
          index: 0
          sportId: 1
          phases: []
