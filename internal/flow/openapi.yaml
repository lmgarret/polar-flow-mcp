    SampleSeries:
      type: object
      description: 'One evenly-spaced time series of a session''s samples (captured from a

        device-recorded run 2026-10-07). `values[i]` was recorded at

        `i × interval` from the exercise''s `startTime`. A value is `null` where

        the sensor had no reading (e.g. the first seconds of altitude/cadence).

        Units are the metric''s: bpm (`HEART_RATE`), **km/h** (`SPEED`, even when

        the UI shows pace), cumulative metres (`DISTANCE`), metres (`ALTITUDE`),

        W (`POWER`), rpm/spm (`CADENCE`), °C (`TEMPERATURE`), kcal/min

        (`*_KCAL_PER_MIN`).

        '
      required:
      - samples
      properties:
        samples:
          type: object
          required:
          - values
          - interval
          properties:
            interval:
              type: string
              description: 'ISO 8601 duration between consecutive values. Observed `PT1S` (1 Hz)

                for sensor metrics and `PT30S` for the `*_KCAL_PER_MIN` series.

                '
              example: PT1S
            values:
              type: array
              description: Sample values, oldest first. A 1 h session at 1 Hz holds ~3 600.
              items:
                type: number
                nullable: true
      example:
        samples:
          interval: PT1S
          values:
          - 120
          - 122
          - 126
          - 129
    CoordinateSample:
      type: object
      description: One GPS fix of a recorded session.
      required:
      - latitude
      - longitude
      - time
      properties:
        latitude:
          type: number
          description: WGS84 latitude, decimal degrees.
          example: 48.838001
        longitude:
          type: number
          description: WGS84 longitude, decimal degrees.
          example: 2.440151
        altitude:
          type: number
          description: GPS altitude in metres (coarser than the barometric `ALTITUDE` series).
          example: 66.1
          nullable: true
        time:
          type: string
          description: 'Offset from the exercise''s `startTime` as an ISO 8601 duration

            (`PT4.013S`, `PT1H1M23.013S`). Fixes are roughly 1 s apart but not

            evenly spaced, so unlike `SampleSeries` each carries its own time.

            '
          example: PT4.013S
    CoordinateSeries:
      type: object
      description: 'The session''s GPS track. Unlike the other metrics it is a list of

        timestamped fixes rather than an evenly-spaced `{values, interval}` series.

        '
      required:
      - samples
      properties:
        samples:
          type: array
          items:
            $ref: '#/components/schemas/CoordinateSample'
    SampleBlock:
      type: object
      description: 'Per-exercise time series, one entry per metric. A metric is `null` when

        the device did not record it — every metric for a manually-entered

        session (capture 23-analysis-details.json). Populated metrics are a

        `SampleSeries` (`{samples: {values, interval}}`), except `COORDINATE`,

        which is a list of timestamped GPS fixes. Shapes confirmed 2026-10-07

        from a device-recorded run (`PT1S` sensors, `PT30S` energy series).

        This block is ~95% of the response (~500 KB for a 1 h run).

        '
      properties:
        HEART_RATE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Heart rate, bpm (1 Hz).
        SPEED:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Speed, **km/h** (1 Hz) — the UI's pace chart is derived from it.
        DISTANCE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Cumulative distance from the start, metres (1 Hz).
        CADENCE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Cadence, rpm / steps-per-minute (1 Hz).
        ALTITUDE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Barometric altitude, metres (1 Hz).
        POWER:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Power, W (1 Hz) — running power on a run.
        TEMPERATURE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Watch temperature, °C (1 Hz).
        FAT_KCAL_PER_MIN:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Energy from fat, kcal/min (`PT30S`).
        CARB_KCAL_PER_MIN:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Energy from carbohydrate, kcal/min (`PT30S`).
        PROTEIN_KCAL_PER_MIN:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Energy from protein, kcal/min (`PT30S`).
        POWER_BALANCE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Left/right power balance. Null in captures.
        LEFT_PEDAL_CRANK_BASED_POSITIVE_FORCE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Left-pedal crank force. Null in captures.
        RIGHT_PEDAL_CRANK_BASED_POSITIVE_FORCE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Right-pedal crank force. Null in captures.
        STRIDE_LENGTH:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Stride length, m. Null in captures.
        BODY_TEMPERATURE:
          oneOf:
          - $ref: '#/components/schemas/SampleSeries'
          - type: 'null'
          description: Body temperature, °C. Null in captures.
        COORDINATE:
          oneOf:
          - $ref: '#/components/schemas/CoordinateSeries'
          - type: 'null'
          description: GPS track (timestamped fixes); null without GPS.
      example:
        HEART_RATE:
          samples:
            interval: PT1S
            values:
            - 120
            - 122
            - 126
        SPEED:
          samples:
            interval: PT1S
            values:
            - 5.21
            - 6.31
            - 8.76
        DISTANCE:
          samples:
            interval: PT1S
            values:
            - 2.1
            - 13.5
            - 34.8
        POWER:
          samples:
            interval: PT1S
            values:
            - 147
            - 177
            - 241
        ALTITUDE:
          samples:
            interval: PT1S
            values:
            - null
            - 66.09
            - 66.33
        CADENCE:
          samples:
            interval: PT1S
            values:
            - null
            - 58
            - 75
        FAT_KCAL_PER_MIN:
          samples:
            interval: PT30S
            values:
            - 2.67
            - 2.92
        COORDINATE:
          samples:
          - latitude: 48.838001
            longitude: 2.440151
            altitude: 66.1
            time: PT4.013S
        TEMPERATURE: null
        STRIDE_LENGTH: null
        POWER_BALANCE: null
        BODY_TEMPERATURE: null
        LEFT_PEDAL_CRANK_BASED_POSITIVE_FORCE: null
        RIGHT_PEDAL_CRANK_BASED_POSITIVE_FORCE: null
    SessionZone:
      type: object
      description: 'Time spent in one zone of a recorded session. `lowerLimit`/`higherLimit`

        are the zone bounds in the list''s unit: bpm (`HEART_RATE`), **km/h**

        (`SPEED`), W (`POWER`) — the zones of the sport profile at recording time.

        '
      properties:
        lowerLimit:
          type: number
          description: Inclusive lower bound (bpm, km/h or W).
          example: 143
        higherLimit:
          type: number
          description: Exclusive upper bound (bpm, km/h or W).
          example: 162
        inZone:
          type: string
          description: Time in the zone as an ISO 8601 duration (`PT2138S`, `PT533.5S`).
          example: PT2138S
          nullable: true
        distance:
          type: number
          description: Metres covered in the zone. Set on `SPEED` zones only; null for HR/power.
          example: 1196.2
          nullable: true
        zoneIndex:
          type: integer
          description: 1-based zone number (1 = lowest).
          example: 3
        created:
          type: string
          description: Always null in captures.
          nullable: true
        modified:
          type: string
          description: Always null in captures.
          nullable: true
    SessionZones:
      type: object
      description: 'Per-metric time-in-zone lists of one exercise, five zones each, lowest

        first. Empty object for a manual session. Captured 2026-10-07 from a

        device-recorded run carrying HR, speed and power.

        '
      properties:
        HEART_RATE:
          type: array
          items:
            $ref: '#/components/schemas/SessionZone'
        SPEED:
          type: array
          items:
            $ref: '#/components/schemas/SessionZone'
        POWER:
          type: array
          items:
            $ref: '#/components/schemas/SessionZone'
    PeriodTime:
      type: object
      description: A wall-clock instant of a `PeriodData` node.
      properties:
        localDateTime:
          type: string
          description: '**Local** wall-clock time despite the trailing `Z`

            (`2026-01-15T10:00:00.696Z` for a 10:00 local start); add nothing.

            '
          example: '2026-01-15T10:00:00.696Z'
        timezoneOffsetInMilliseconds:
          type: integer
          description: The local UTC offset in ms (3 600 000 = UTC+1).
          example: 3600000
    PeriodValue:
      type: object
      description: A typed value inside `PeriodData.data`; exactly one of the two is set.
      properties:
        numValue:
          type: number
          nullable: true
        stringValue:
          type: string
          nullable: true
    PeriodData:
      type: object
      description: 'A node of the session''s period tree (captured 2026-10-07): the root is the

        `TRAINING_SESSION`, its child the `EXERCISE`, whose children are the

        detected `UPHILL` / `DOWNHILL` segments behind the altitude chart. Values

        sit in `data`, keyed by name. Observed on `EXERCISE`:

        `TOTAL_UPHILL_COUNT`, `TOTAL_DOWNHILL_COUNT`, `TOTAL_UPHILL_DISTANCE`,

        `TOTAL_DOWNHILL_DISTANCE` (m). On each hill segment: `UPHILL_NUMBER` /

        `DOWNHILL_NUMBER`, `DISTANCE` (m), **`DURATION` (ms)**, `ASCENT` /

        `DESCENT` (m), `START_ALTITUDE` / `END_ALTITUDE` (m), `AVG_INCLINE` (%),

        `AVG_SPEED` / `MAX_SPEED` (km/h), `AVG_HEART_RATE` / `MAX_HEART_RATE`,

        `AVG_POWER` / `MAX_POWER`, `AVG_CADENCE` / `MAX_CADENCE`. On the root:

        `READONLY_IS_TEST` (string `"false"`).

        '
      properties:
        type:
          type: string
          description: Node kind — observed `TRAINING_SESSION`, `EXERCISE`, `UPHILL`, `DOWNHILL`.
          example: UPHILL
        startTime:
          $ref: '#/components/schemas/PeriodTime'
        endTime:
          $ref: '#/components/schemas/PeriodTime'
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PeriodValue'
        subperiods:
          type: array
          items:
            $ref: '#/components/schemas/PeriodData'
    SessionStatistic:
      type: object
      description: Average / max / min of one metric over a span; any may be null.
      properties:
        avg:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        min:
          type: number
          nullable: true
        modified:
          type: string
          description: Always null in captures.
          nullable: true
    PhaseRepetitionResult:
      type: object
      description: 'The recorded result of one executed phase of a planned (PHASED) target —

        one element per phase **repetition**, in execution order. A

        `3 × (8 min work + 3 min walk)` repeat therefore yields six elements between

        the warm-up and cool-down. These are the numbered segments the web UI draws

        over the analysis charts. Durations are ISO 8601 strings, speeds **km/h**,

        distances metres.

        '
      properties:
        phaseIndex:
          type: integer
          description: 1-based index into `exercisePhaseModels` (which planned phase this was).
          example: 2
        repetitionIndex:
          type: integer
          description: 0-based position in execution order across the whole session.
          example: 3
        phaseRepetitionIndex:
          type: integer
          description: 1-based repetition number of this phase (2 = second time this phase ran).
          example: 2
        splitTime:
          type: string
          description: Elapsed time from the exercise start to the **end** of this repetition (ISO 8601 duration).
          example: PT32M12.388S
        duration:
          type: string
          description: Duration of this repetition (ISO 8601).
          example: PT8M
        splitDistance:
          type: number
          description: Metres covered in this repetition (equal to `distance` in captures).
          example: 1442.1
          nullable: true
        distance:
          type: number
          description: Metres covered in this repetition.
          example: 1442.1
          nullable: true
        inZone:
          type: string
          description: Time inside the phase's target zone (ISO 8601); null when the phase has no zone.
          example: PT392S
          nullable: true
        heartRateStatistic:
          $ref: '#/components/schemas/SessionStatistic'
        speedStatistic:
          $ref: '#/components/schemas/SessionStatistic'
        cadenceStatistic:
          $ref: '#/components/schemas/SessionStatistic'
        powerStatistic:
          $ref: '#/components/schemas/SessionStatistic'
        ascent:
          type: number
          description: Metres climbed in this repetition; null in captures.
          nullable: true
        descent:
          type: number
          description: Metres descended in this repetition; null in captures.
          nullable: true
        finished:
          type: boolean
          description: False when the athlete skipped/stopped before the phase's goal.
    PhaseResultModel:
      type: object
      description: One planned phase of the target the session executed (flattened, no repeat nesting).
      properties:
        phaseIndex:
          type: integer
          description: 1-based phase index, referenced by `PhaseRepetitionResult.phaseIndex`.
          example: 2
        name:
          type: string
          description: Phase name as planned.
          example: Work
          nullable: true
        zoneType:
          type: string
          description: Intensity basis — observed `HEART_RATE_ZONES` and `NONE`. Likely also the target's other intensity
            types.
          example: HEART_RATE_ZONES
          nullable: true
        lowerZone:
          type: integer
          description: Lower target zone (1–5); null when `zoneType` is `NONE`.
          example: 4
          nullable: true
        upperZone:
          type: integer
          description: Upper target zone (1–5); null when `zoneType` is `NONE`.
          example: 4
          nullable: true
    ExerciseTargetResult:
      type: object
      description: 'How an exercise went against the training target it was recorded for

        (captured 2026-10-07 from a PHASED interval target). Present only when the

        session was started from a target (`hasTrainingTarget=true` in the history

        listing).

        '
      properties:
        sportReference:
          type: object
          properties:
            id:
              type: integer
              description: Polar sport id.
        name:
          type: string
          description: Target name.
          nullable: true
        type:
          type: string
          description: Target type — `PHASED` observed; presumably also `VOLUME` / `STEADY_RACE_PACE`.
          example: PHASED
          nullable: true
        duration:
          type: string
          description: Planned duration for a VOLUME target; null for PHASED.
          nullable: true
        distance:
          type: number
          description: Planned distance (m) for a VOLUME target; null for PHASED.
          nullable: true
        kiloCalories:
          type: number
          description: Planned calories for a VOLUME target; null for PHASED.
          nullable: true
        targetReached:
          type: boolean
          description: Whether Flow considers the target achieved.
          nullable: true
        exercisePhaseRepetitionModels:
          type: array
          description: Recorded result of every executed phase repetition, in order.
          items:
            $ref: '#/components/schemas/PhaseRepetitionResult'
          nullable: true
        exercisePhaseModels:
          type: array
          description: The planned phases, by `phaseIndex`.
          items:
            $ref: '#/components/schemas/PhaseResultModel'
          nullable: true
        exerciseRacePaceResultData:
          description: Race-pace result; null for PHASED targets. Shape not captured.
        racePaceSpeed:
          type: number
          description: Race-pace target speed; null for PHASED targets.
          nullable: true
        completeRoundModels:
          description: Null in captures. Shape not captured.
        externalSourceIdentifier:
          type: string
          nullable: true
        onDemandTypeTarget:
          type: boolean
          nullable: true
    SessionDetails:
      type: object
      description: 'Response of GET /api/training/analysis/{id}/details — everything the

        web UI''s session-analysis charts draw: per-second samples, time in zones,

        laps, the hill segments, and (for a session started from a planned target)

        the per-phase results. Every per-exercise block is keyed by exerciseId.

        For a manual session all `samples[*][METRIC]` are null and `zones` is

        empty. Populated shapes captured 2026-10-07 from a device-recorded

        interval run (PHASED target, no laps pressed).

        '
      properties:
        id:
          type: integer
          format: int64
          description: Training session id (matches the `{id}` in the path).
          example: 8349588454
        periodDataUuid:
          type: string
          description: UUID of associated period data; null when none.
          nullable: true
        exercises:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SessionExercise'
        samples:
          type: object
          description: 'Object keyed by exerciseId, each containing a per-metric

            sample block. All metrics null for manual sessions.

            '
          additionalProperties:
            $ref: '#/components/schemas/SampleBlock'
        zones:
          type: object
          description: 'Time-in-zone distributions, keyed by exerciseId. Empty

            object for manual sessions.

            '
          additionalProperties:
            $ref: '#/components/schemas/SessionZones'
        laps:
          type: object
          description: 'Laps keyed by exerciseId. Empty on a device session whose segments

            came from a planned target (those are in `exerciseResultTargetData`).

            Element shape not captured yet. # TODO: capture a session with laps

            '
          additionalProperties:
            type: object
            properties:
              automaticLaps:
                type: array
                items: {}
              manualLaps:
                type: array
                items: {}
        periodData:
          description: The session's period tree (session → exercise → hill segments); null when absent.
          oneOf:
          - $ref: '#/components/schemas/PeriodData'
          - type: 'null'
        swimDatas:
          type: object
          description: Per-exercise swim metrics; empty unless swim sport.
          additionalProperties: true
        pauseTimeData:
          description: Per-exercise pause-time arrays, keyed by exerciseId. Left untyped (free-form) because a key's value
            may be null (not an array) for some sessions.
        defaultHrZones:
          description: Per-exercise default HR zone arrays, keyed by exerciseId. Left untyped (free-form) because a key's
            value may be null (not an array) for some sessions.
        errors:
          type: object
          description: 'Parsing/quality issues, keyed by exerciseId. Empty when clean.

            '
          additionalProperties: true
        exerciseResultTargetData:
          type: object
          description: 'Result against the planned training target, keyed by exerciseId.

            Empty unless the session was started from a target

            (`hasTrainingTarget=true` in the history listing). For a PHASED

            target this carries per-repetition splits — the numbered segments

            of the analysis charts.

            '
          additionalProperties:
            $ref: '#/components/schemas/ExerciseTargetResult'
      example:
        id: 8349588454
        periodDataUuid: null
        exercises:
          '8379162593':
            id: 8379162593
            sport:
              id: 1
            startTime: '2026-05-28T08:00:00'
            stopTime: '2026-05-28T08:30:00'
            duration: PT30M
            distance: 5000
            calories: 350
            trainingStatistic:
              HEART_RATE:
                max: 0
                avg: 0
                min: null
            sportParent: RUNNING
            defaultSpeedViewSettings: PACE
        samples:
          '8379162593':
            HEART_RATE: null
            SPEED: null
            CADENCE: null
            ALTITUDE: null
            POWER: null
            DISTANCE: null
        zones:
          '8379162593': {}
        laps:
          '8379162593':
            automaticLaps: []
            manualLaps: []
        periodData: null
        swimDatas: {}
        pauseTimeData:
          '8379162593': []
        defaultHrZones:
          '8379162593': []
        errors: {}
        exerciseResultTargetData: {}
    RoutePoint:
      type: object
      description: One trackpoint of a route.
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: 'WGS84 latitude, degrees. The key must be `latitude` (`lat` → 500).

            Out-of-range points are silently dropped by the server.

            '
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 longitude, degrees (`lon` → 500). Out-of-range points are silently dropped.
        altitude:
          type: number
          description: 'Elevation in metres. When the source has none, the web UI sends `0`

            for GPX and `null` for TCX; both are accepted (null reads back as

            null). May be omitted.

            '
          nullable: true
        distance:
          type: number
          description: '**Cumulative** distance from route start, in metres. GPX: haversine

            on lat/lon with Earth radius 6 371 000 m (UI-verified). TCX: the

            file''s `<DistanceMeters>` verbatim. The first point is `0`. Not

            persisted per point (only the total is), and may be omitted.

            '
        time:
          type: string
          description: 'Only sent by the UI for TCX *Activity* files

            (`2026-01-01T10:00:00.000Z`); ignored by the server.

            '
      example:
        latitude: 48.8576
        longitude: 2.3532
        altitude: 36
        distance: 133.10381572631718
    RouteImport:
      type: object
      description: 'Request body for POST /api/favorites/trainingTargets/importRoute.

        Built client-side from a parsed GPX/TCX file. Each trackpoint

        carries its **cumulative** distance from the start, in metres.

        '
      required:
      - route
      - name
      - distance
      properties:
        route:
          type: array
          minItems: 1
          description: 'Ordered trackpoints. Empty → 400. A single point is accepted as

            long as `distance` > 0 (degenerate route). Points with an

            out-of-range latitude/longitude are silently dropped server-side.

            5 000 points were accepted and read back intact.

            '
          items:
            $ref: '#/components/schemas/RoutePoint'
        sport:
          type: integer
          description: 'sportId from /api/sports/sports, or null for sport-agnostic.

            '
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 45
          description: 'Route name. The web UI takes the first `<trk><name>` (GPX),

            `<rte><name>`, or `<Course><Name>` (TCX), else a localized

            placeholder ("Itinéraire 1"). Must contain a non-whitespace

            character (400). ⚠ Longer than 45 chars is **silently truncated**

            to 45, not rejected.

            '
        distance:
          type: number
          exclusiveMinimum: true
          description: 'Total route length in metres — the last trackpoint''s cumulative

            `distance`. `0` → 400. ⚠ Not cross-checked against the points

            (any positive value is stored verbatim).

            '
          minimum: 0
      example:
        route:
        - latitude: 48.8566
          longitude: 2.3522
          altitude: 35
          distance: 0
        - latitude: 48.8576
          longitude: 2.3532
          altitude: 36
          distance: 133.10381572631718
        sport: null
        name: doc-route
        distance: 532.4104430899847
    Waypoint:
      type: object
      description: 'Read-back waypoint shape. Field names differ from the upload

        `RoutePoint`: instead of cumulative `distance`, the server

        synthesizes a sequence `time` in milliseconds (1000ms per point

        regardless of original GPS sampling — for the watch''s navigation

        ordering, not for actual elapsed time).

        '
      required:
      - latitude
      - longitude
      - time
      properties:
        latitude:
          type: number
          description: WGS84 latitude, degrees.
        longitude:
          type: number
          description: WGS84 longitude, degrees.
        altitude:
          type: number
          description: Elevation in metres above sea level; null when the upload had none.
          nullable: true
        time:
          type: integer
          description: 'Sequence index in milliseconds (0, 1000, 2000, …). NOT actual

            elapsed time, since the original GPX usually has no

            timestamps.

            '
      example:
        longitude: 2.3532
        latitude: 48.8576
        altitude: 36
        time: 1000
    GpsRoute:
      type: object
      description: 'Full route geometry. Returned by

        `GET /api/favorites/exerciseTarget/{exerciseTargetId}` for ROUTE

        favorites.

        '
      required:
      - waypoints
      - distance
      - startPoint
      properties:
        id:
          type: integer
          description: 'Internal route id — observed null in responses; Polar tracks

            routes by their parent exerciseTargetId.

            '
          nullable: true
        user:
          type: object
          description: Owner reference.
          required:
          - id
          properties:
            id:
              type: integer
              format: int64
              description: Owning user's numeric id.
        name:
          type: string
          description: Route name (from the imported file's metadata).
        parentRouteId:
          type: integer
          description: Parent route id for derived routes; null for top-level imports.
          nullable: true
        order:
          type: integer
          description: Ordering hint; observed null.
          nullable: true
        distance:
          type: number
          description: Total length, metres.
        startPoint:
          $ref: '#/components/schemas/Waypoint'
        waypoints:
          type: array
          description: Ordered track points. The server synthesizes `time` as a 1000ms sequence index.
          items:
            $ref: '#/components/schemas/Waypoint'
      example:
        id: null
        user:
          id: 11111111
        startPoint:
          longitude: 2.3522
          latitude: 48.8566
          altitude: 35
          time: 0
        name: doc-route
        order: null
        parentRouteId: null
        waypoints:
        - longitude: 2.3522
          latitude: 48.8566
          altitude: 35
          time: 0
        - longitude: 2.3532
          latitude: 48.8576
          altitude: 36
          time: 1000
        distance: 532.4104430899847
    FavoriteExerciseTarget:
      type: object
      description: 'Response of GET /api/favorites/exerciseTarget/{exerciseTargetId}.

        For ROUTE-type favorites this is the only place to read back the

        uploaded GPS waypoints.

        '
      properties:
        id:
          type: integer
          format: int64
          description: exerciseTargetId (the inner id — pass THIS, not favoriteId, in the URL).
          example: 1530890883
        type:
          type: string
          enum:
          - VOLUME
          - STEADY_RACE_PACE
          - PHASED
          - ROUTE
          - FREE
          description: Favorite kind. `ROUTE` carries GPS geometry in `gpsRoute`.
        distance:
          type: number
          description: Total distance in metres, or null.
          nullable: true
        duration:
          type: string
          description: HH:MM:SS or null. Null for ROUTE favorites.
          nullable: true
        kiloCalories:
          type: integer
          description: Target kcal, or null.
          nullable: true
        index:
          type: integer
          description: Position in a multi-target sequence (null for single targets).
          nullable: true
        modified:
          type: string
          description: Observed null even after edits — TBD.
          nullable: true
        created:
          type: string
          description: Creation timestamp; observed null in captures — TBD.
          nullable: true
        segmentId:
          type: integer
          description: Populated for Strava-segment favorites.
          nullable: true
        routeServiceRoute:
          description: Populated for Strava/Komoot-imported routes. Shape TBD.
        favoritePhases:
          type: array
          description: Populated only for PHASED favorites.
          items:
            $ref: '#/components/schemas/Phase'
        sport:
          description: 'Sport object when set, null otherwise. Shape per

            `FavoriteSimple.sport`.

            '
        gpsRoute:
          oneOf:
          - $ref: '#/components/schemas/GpsRoute'
          - type: 'null'
          description: GPS geometry. Present (non-null) for ROUTE type.
      example:
        distance: 532.4104430899847
        duration: null
        id: 1530890883
        index: null
        kiloCalories: null
        modified: null
        created: null
        type: ROUTE
        routeServiceRoute: null
        segmentId: null
        gpsRoute:
          id: null
          user:
            id: 11111111
          startPoint:
            longitude: 2.3522
            latitude: 48.8566
            altitude: 35
            time: 0
          name: doc-route
          order: null
          parentRouteId: null
          waypoints:
          - longitude: 2.3522
            latitude: 48.8566
            altitude: 35
            time: 0
          - longitude: 2.3532
            latitude: 48.8576
            altitude: 36
            time: 1000
          distance: 532.4104430899847
        favoritePhases: []
        sport: null
    FavoriteCreate:
      type: object
      description: 'Request body for POST /api/favoritetarget. Identical to

        TrainingTargetCreate minus the `datetime` field — a favorite is a

        date-less template.

        '
      required:
      - type
      - name
      - exerciseTargets
      properties:
        type:
          type: string
          enum:
          - VOLUME
          - STEADY_RACE_PACE
          - PHASED
          description: Favorite kind — see TrainingTargetCreate.type for the per-value field rules.
        name:
          type: string
          minLength: 1
          maxLength: 45
          description: 'Favorite display name, 1–45 chars counted as UTF-16 code units

            (Java `String.length()`: 44 letters + one emoji = 46 → 400; probed

            2026-09-28/29: 46 → 400 `{"target.name":[…]}`). Same limit as the

            training-target name.

            '
        description:
          type: string
          maxLength: 500
          description: Free-text notes, ≤ 500 chars; send empty string when none.
        exerciseTargets:
          type: array
          description: 'One block per exercise; send `id: null` on each (server assigns).'
          items:
            $ref: '#/components/schemas/ExerciseTarget'
      example:
        type: VOLUME
        name: doc-fav-distance
        description: seed for capture
        exerciseTargets:
        - sportId: 1
          distance: 5000
          calories: null
          duration: null
          phases: []
          id: null
    FavoriteExerciseTargetEntry:
      type: object
      description: 'One `exerciseTargets[]` entry of a favorite (`GET`/`POST

        /api/favoritetarget/{id}`). Same fields as `ExerciseTarget`, but

        `sportId` is **nullable**: ROUTE favorites, `FREE` favorites and

        favorites whose sport was cleared (saveSport without a sport) read back

        with `sportId: null`.

        '
      required:
      - phases
      properties:
        id:
          type: integer
          format: int64
          description: 'Server-assigned exerciseTargetId. Send it back on update — an entry

            with `id: null` is silently not updated.

            '
          example: 1539651421
          nullable: true
        index:
          type: integer
          description: Position within the exerciseTargets array (read-only).
          example: 0
          nullable: true
        sportId:
          type: integer
          description: 'Sport id from `/api/sports/sports`. ⚠ Not validated by the server —

            `9999` is stored verbatim. Null for ROUTE / FREE favorites.

            '
          example: 1
          nullable: true
        duration:
          type: string
          description: '`HH:MM:SS`, ≤ `99:59:59`. For PHASED favorites the read-back value is

            rolled up from the phases.

            '
          example: 00:30:00
          nullable: true
        distance:
          type: number
          description: Metres (0 < d ≤ 9 999 000). Rolled up from phases on read-back for PHASED.
          example: 5000
          nullable: true
        calories:
          type: number
          description: Target kcal (≥ 0), or null.
          nullable: true
        phases:
          type: array
          description: Populated for PHASED favorites; `[]` otherwise.
          items:
            $ref: '#/components/schemas/Phase'
    Favorite:
      type: object
      description: 'Response body of GET /api/favoritetarget/{id} and request body of

        POST /api/favoritetarget/{id} (update). Adds `index` (and the

        existing `id`) fields to each exerciseTarget vs the create shape.

        '
      required:
      - type
      - name
      - exerciseTargets
      properties:
        type:
          type: string
          enum:
          - VOLUME
          - STEADY_RACE_PACE
          - PHASED
          - ROUTE
          - FREE
          description: 'Favorite kind (same set as a training target; no datetime), plus

            `ROUTE` for imported GPX/TCX routes and `FREE` — what a favorite

            created with an empty/missing `exerciseTargets` reads back as

            (probed 2026-09-28). Only VOLUME / STEADY_RACE_PACE / PHASED are

            valid on write.

            '
        name:
          type: string
          minLength: 1
          maxLength: 45
          description: Favorite display name, 1–45 chars (longer → 400 on write).
        description:
          type: string
          maxLength: 500
          description: Free-text notes (≤ 500 chars); empty string when not set, null for ROUTE favorites.
          nullable: true
        exerciseTargets:
          type: array
          description: One block per exercise (multi-sport favorites have several).
          items:
            $ref: '#/components/schemas/FavoriteExerciseTargetEntry'
      example:
        name: doc-fav-distance
        description: seed for capture
        type: VOLUME
        exerciseTargets:
        - id: 1530890882
          duration: null
          distance: 5000
          calories: null
          index: 0
          sportId: 1
          phases: []
    FavoriteListing:
      type: object
      description: 'One element of `GET /api/favorites.targets[]`. Uses a different

        unit convention from `GET /api/favorites/favoriteTargetsJson`

        (duration here is milliseconds; there it''s HH:MM:SS string).

        '
      properties:
        favoriteId:
          type: integer
          format: int64
          description: The id used in `/api/favoritetarget/{id}` URLs.
        exerciseTargetId:
          type: integer
          format: int64
          description: Inner exercise-target id (distinct from favoriteId).
        sportName:
          type: string
          description: 'UPPERCASE sport enum (e.g. `"RUNNING"`), NOT the locale-resolved

            display string. Map to localized name via /api/sports/sports. Null for

            ROUTE favorites (sport-agnostic).

            '
          nullable: true
        sportId:
          type: integer
          description: Numeric sport id. Null for ROUTE favorites.
          nullable: true
        type:
          type: string
          enum:
          - VOLUME
          - STEADY_RACE_PACE
          - PHASED
          - ROUTE
          - FREE
          description: 'Favorite kind. `ROUTE` is only present for entries created via

            `POST /api/favorites/trainingTargets/importRoute`. `FREE` appears for

            a favorite created without exercise targets.

            '
        favoriteName:
          type: string
          description: User-given favorite name.
        favoriteDescription:
          type: string
          description: Free-text notes. Empty string for training targets; null for ROUTE favorites.
          nullable: true
        duration:
          type: integer
          description: 'Duration in **milliseconds** (or null). NB: differs from

            FavoriteSimple where duration is `HH:MM:SS` string.

            '
          nullable: true
        distance:
          type: number
          description: Metres, or null.
          nullable: true
        calories:
          type: integer
          description: Target kcal, or null.
          nullable: true
        segmentId:
          type: integer
          description: Strava segment id; populated only for Strava-segment favorites.
          nullable: true
        segmentType:
          type: string
          description: Strava segment type; null for non-segment favorites.
          nullable: true
        routeSource:
          type: string
          description: 'Origin of a ROUTE favorite. `"FLOW_FILE_IMPORT"` for GPX/TCX uploads; null for non-route favorites.
            Strava/Komoot route imports use other values (TBD).

            '
          example: FLOW_FILE_IMPORT
          nullable: true
        externalRouteIdentifier:
