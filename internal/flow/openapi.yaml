    ZoneLimit:
      type: object
      description: "One training zone as a half-open range `[lowerLimit, higherLimit)`.\nZones are contiguous: each zone's\
        \ `lowerLimit` equals the previous zone's\n`higherLimit` (the server rejects a gap or overlap with 400). Units depend\n\
        on the list the zone sits in:\n\n- `heartRateZones` — **bpm**, integers. Valid range [15, 240]. The top\n  zone's\
        \ `higherLimit` is the maximum heart rate the zones were derived from.\n- `speedZones` — **km/h**, floats (even on\
        \ pace-view sports; `speedView`\n  only changes how the watch displays it). Valid range [1.0, 399.0]. The top\n  zone's\
        \ `higherLimit` is the **sentinel `399.0`** (\"no ceiling\").\n- `powerZones` — **watts**, integers. Valid range [0,\
        \ 2000]. The top zone's\n  `higherLimit` is the **sentinel `2000`** (\"no ceiling\").\n\nEvery zone must span at least\
        \ 2 units (`higherLimit - lowerLimit >= 2`).\nNote the legacy `/settings/sports/edit` HTML renders the same zones\
        \ with an\ninclusive upper bound (`95 - 113` for `[95, 114)`).\n"
      required:
      - lowerLimit
      - higherLimit
      properties:
        lowerLimit:
          type: number
          description: Inclusive lower bound (bpm, km/h or W — see the containing list).
          example: 133
        higherLimit:
          type: number
          description: Exclusive upper bound (bpm, km/h or W — see the containing list).
          example: 152
    SportProfileZoneLimits:
      type: object
      description: 'The heart-rate, speed/pace and power **training zones** of one sport

        profile — the zones a Polar device uses for that sport, and therefore what

        `intensityType: HEART_RATE_ZONES | SPEED_ZONES | POWER_ZONES` +

        `lowerZone`/`upperZone` (1–5) on a training-target phase resolve to.


        Each list holds **exactly 5** zones, index 0 = zone 1 (lowest). A list is

        `[]` when the sport does not support that zone type (e.g. SWIMMING and

        STRENGTH_TRAINING only have heart-rate zones; CYCLING has all three).


        **Default zones** (`*_SETTING_SOURCE_DEFAULT`) are derived server-side

        (observed 2026-09-29, test account with no measured HRmax/MAS):


        | Type | Basis | Zone boundaries |

        |------|-------|-----------------|

        | Heart rate | HRmax (age-estimated when `physicalInfo.maximumHeartRate` is null — 190 bpm at age 30) | 50 / 60 /
        70 / 80 / 90 / 100 % HRmax |

        | Speed, running-type sports | MAS (`maximumAerobicSpeed`) — `SPEED_ZONE_CALCULATION_METHOD_MAS_BASED` | 55 / 70 /
        85 / 100 / 115 % MAS, top open (399) |

        | Speed, other sports | fixed per-sport table — `SPEED_ZONE_CALCULATION_METHOD_SPORT_SPECIFIC_PREDEFINED` | CYCLING
        10/20/30/40/50 km/h, HIKING 1/2/4/6/8 km/h |

        | Power, running | MAP (`maximumAerobicPower`) — `POWER_ZONE_CALCULATION_METHOD_MAP_BASED` | 55 / 70 / 85 / 100 /
        115 % MAP, top open (2000) |

        | Power, cycling | FTP (`functionalThresholdPower`) — `POWER_ZONE_CALCULATION_METHOD_FTP_BASED` | 55 / 75 / 90 / 105
        / 120 % FTP, top open (2000) |


        `*_SETTING_SOURCE_FREE` means the user typed the limits in by hand.

        '
      properties:
        heartRateZones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneLimit'
          description: Heart-rate zones in **bpm** (5 entries, or `[]`).
        speedZones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneLimit'
          description: Speed zones in **km/h** (5 entries, or `[]` when the sport has no speed zones).
        powerZones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneLimit'
          description: Power zones in **watts** (5 entries, or `[]` when the sport has no power zones).
        heartRateSettingSource:
          type: string
          description: 'Observed: `HEART_RATE_ZONE_SETTING_SOURCE_DEFAULT` (derived from HRmax),

            `HEART_RATE_ZONE_SETTING_SOURCE_FREE` (user-entered limits). Left as an

            open string: other values (e.g. threshold-based) may exist. # TODO: verify

            '
        speedSettingSource:
          type: string
          description: 'Observed: `SPEED_ZONE_SETTING_SOURCE_DEFAULT` (computed, see `speedZoneCalculationMethod`), `SPEED_ZONE_SETTING_SOURCE_FREE`
            (user-entered). Open string.'
        powerSettingSource:
          type: string
          description: 'Observed: `POWER_ZONE_SETTING_SOURCE_DEFAULT` (computed, see `powerZoneCalculationMethod`), `POWER_ZONE_SETTING_SOURCE_FREE`
            (user-entered). Open string.'
        speedZoneCalculationMethod:
          type: string
          description: 'How default speed zones were computed. Observed:

            `SPEED_ZONE_CALCULATION_METHOD_MAS_BASED`,

            `SPEED_ZONE_CALCULATION_METHOD_SPORT_SPECIFIC_PREDEFINED`,

            `SPEED_ZONE_CALCULATION_METHOD_UNKNOWN` (sport has no speed zones).

            Open string.

            '
        powerZoneCalculationMethod:
          type: string
          description: 'How default power zones were computed. Observed:

            `POWER_ZONE_CALCULATION_METHOD_MAP_BASED`,

            `POWER_ZONE_CALCULATION_METHOD_FTP_BASED`,

            `POWER_ZONE_CALCULATION_METHOD_UNKNOWN` (sport has no power zones).

            Open string.

            '
    SportProfileThreshold:
      type: object
      description: 'A per-sport threshold the default zones are derived from. Exactly one of

        `speed` (km/h, for `maximumAerobicSpeed`) or `power` (W, for

        `maximumAerobicPower` / `functionalThresholdPower`) is set.

        '
      properties:
        speed:
          type: number
          description: Maximum aerobic speed (MAS) in **km/h**.
          example: 17.183771
        power:
          type: integer
          description: Power threshold (MAP or FTP) in **watts**.
          example: 250
        source:
          type: string
          description: 'Where the value comes from. Observed: `MAS_SOURCE_ESTIMATED`,

            `MAP_SOURCE_ESTIMATED`, `FTP_SOURCE_ESTIMATED` (estimated from physical

            info / the account''s `functionalThresholdPower`). Measured/user-set

            variants likely exist. # TODO: verify

            '
          example: FTP_SOURCE_ESTIMATED
    SportProfileBody:
      type: object
      description: 'The `profile` payload of a sport profile: the sport, its device settings

        (including the **training zones** under `settings.zoneLimits`) and the

        thresholds the default zones derive from.


        On `GET /api/sports/profiles` (list) this is a **slim** object with only

        `sportId`, `productSettings`, `subProfileUuids` — read the profile by uuid

        (or call `recalculate`) to get `settings` and the thresholds.

        '
      additionalProperties: true
      required:
      - sportId
      properties:
        sportId:
          type: integer
          description: Sport id (same id space as `GET /api/sports/sports`).
          example: 1
        settings:
          type: object
          additionalProperties: true
          description: 'Device settings for this sport. Only `zoneLimits` is modeled in detail;

            the rest are passed through.

            '
          properties:
            zoneLimits:
              $ref: '#/components/schemas/SportProfileZoneLimits'
            speedView:
              type: string
              description: 'How the watch shows speed: `SPEED_VIEW_PACE` (running-type sports

                default) or `SPEED_VIEW_SPEED`. Display only — `speedZones` are

                always km/h.

                '
              example: SPEED_VIEW_PACE
            powerView:
              type: string
              example: POWER_VIEW_WATT
            hrZoneLockAvailable:
              type: boolean
            speedZoneLockAvailable:
              type: boolean
            powerZoneLockAvailable:
              type: boolean
            sensorBroadcastingHr:
              type: boolean
            volume:
              type: object
              properties:
                volume:
                  type: integer
                  example: 60
            trainingReminder:
              type: object
              properties:
                type:
                  type: string
                  example: TRAINING_REMINDER_TYPE_OFF
                text:
                  type: string
            strideSpeedSource:
              type: string
              example: STRIDE_SPEED_SOURCE_STRIDE
            swimmingUnits:
              type: string
              example: SWIMMING_UNITS_METERS
            remoteButtonActions:
              type: array
              items: {}
        sportFactor:
          type: number
          description: Per-sport energy/load factor (RUNNING 1.4, CYCLING 0.9 observed). Absent from `recalculate` output.
          example: 1.4
        productSettings:
          type: array
          description: Per-device settings. `[]` without a paired device.
          items: {}
        subProfileUuids:
          type: array
          items:
            type: string
        maximumAerobicSpeed:
          $ref: '#/components/schemas/SportProfileThreshold'
        maximumAerobicPower:
          $ref: '#/components/schemas/SportProfileThreshold'
        functionalThresholdPower:
          $ref: '#/components/schemas/SportProfileThreshold'
    SportProfile:
      type: object
      description: 'A user''s **sport profile** ("Profil sportif") — the per-sport configuration

        a Polar device uses when you start a session in that sport, including the

        heart-rate / speed / power **training zones** (`profile.settings.zoneLimits`).

        Captured 2026-09-29.


        Every account has at least one profile once any is created (the server

        refuses to delete the last one). Creating a profile through either

        `POST /api/sports/profiles/create/{sportId}` or the legacy

        `POST /settings/sports/add` lands here; `legacyId` on the create response

        is the numeric id the legacy `/settings/sports/*` controller uses.

        '
      additionalProperties: true
      required:
      - uuid
      - profile
      properties:
        uuid:
          type: string
          description: 'Profile id. Polar''s structured UUID, **not** a random v4: the first

            group is a domain (`0f000000`) and the last group is the **sport id in

            hex** (`0f000000-0080-0000-0000-000000000001` = RUNNING,

            `…-000000000002` = CYCLING). The server rejects uuids whose domain is

            unknown or whose sport segment is 0.

            '
          example: 0f000000-0080-0000-0000-000000000001
        userId:
          type: string
          description: 'Owner''s numeric user id, **as a string**. ⚠ `GET /api/sports/profiles/{id}`

            returns `"0"` here while the list and create responses return the real id.

            '
          example: '11111111'
        created:
          type: string
          format: date-time
          example: '2026-09-29T09:09:24Z'
        modified:
          type: string
          format: date-time
          description: Last-modified time. Writes must send a **newer** `modified` (else 409 OUTDATED).
          example: '2026-09-29T09:09:24Z'
        profile:
          $ref: '#/components/schemas/SportProfileBody'
        legacyProfiles:
          type: object
          additionalProperties: true
          description: Legacy per-device profile blobs. `{}` without a paired device.
        legacyId:
          type: string
          description: 'Numeric id of the same profile in the legacy `/settings/sports/*`

            controller. Only observed on the create response.

            '
          example: '453171842'
    SportProfileWriteRequest:
      type: object
      description: 'Body of `POST /api/sports/profiles/{id}/recalculate` and

        `POST /api/sports/profiles/{id}/update-zones` — the web UI wraps the

        profile''s `profile` object in the envelope below.

        '
      required:
      - uuid
      - userId
      - profile
      properties:
        uuid:
          type: string
          description: 'Must equal the `{id}` in the URL (else 400 `Profile UUID in the request

            body does not match the UUID in the URL`). Same structure rules as

            `SportProfile.uuid`.

            '
          example: 0f000000-0080-0000-0000-000000000001
        userId:
          type: integer
          description: 'The signed-in user''s id (`GET /api/account/users/current/user` →

            `user.id`). Required (missing → 400 `must be >= 1`) and must match the

            session user (else 400 `Profile userId (…) does not match request

            userId (…)`). Sent as a number by the UI; a numeric string is accepted too.

            '
          example: 11111111
        modified:
          type: string
          format: date-time
          description: 'Client timestamp (the UI sends `new Date().toISOString()`). Required by

            `update-zones`, where it must be newer than the stored profile''s

            `modified` (else **409** OUTDATED). Ignored by `recalculate`.

            '
          example: '2026-09-29T09:14:28.000Z'
        profile:
          $ref: '#/components/schemas/SportProfileBody'
    SportProfileListCatalog:
      type: object
      description: 'The ordered list(s) of sport profiles shown on the device. The account''s

        first profile creates it; each list holds profile uuids in display order.

        '
      properties:
        uuid:
          type: string
          example: 10000000-0080-0000-0000-000000a98ac7
        userId:
          type: string
          example: '11111111'
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        activeSportProfileListIndex:
          type: integer
          example: 1
        lists:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                example: 1
              sportProfileUuids:
                type: array
                items:
                  type: string
                example:
                - 0f000000-0080-0000-0000-000000000001
    SportProfileAddResponse:
      type: object
      description: 'Response of `POST /settings/sports/add` — the newly created sport profile''s

        summary. Sent as `text/plain` but the body is JSON. Captured 2026-06-01.

        '
      properties:
        success:
          type: string
          description: Localized success message (account language), e.g. "Profil sport ajouté".
          example: Profil sport ajouté
        sport:
          type: object
          description: The created profile's summary card data.
          properties:
            id:
              type: string
              description: 'New sport-profile id (numeric, returned as a string). Use it as the

                map key in `POST /settings/sports/save` and as `sportProfileId` in

                the training-display endpoints.

                '
              example: '987654321'
            sportId:
              type: string
              description: The sport this profile is for (echoes the posted `sportId`).
              example: '115'
            icon:
              type: string
              format: uri
              description: Sport icon URL.
            date:
              type: string
              description: Creation date as `D-M-YYYY` (account locale).
              example: 1-6-2026
            time:
              type: string
              description: Creation time as `HH:mm`.
              example: '19:50'
      example:
        success: Profil sport ajouté
        sport:
          id: '987654321'
          sportId: '115'
          icon: https://platform.cdn.polar.com/ecosystem/sport/icon/da3071ff2b4d598b6ce0f213bff4e4cd-2024-04-16_06_01_42
          date: 1-6-2026
          time: '19:50'
    TrainingSettingsBlock:
      type: object
      description: General per-profile device settings.
      required:
      - name
      - settings
      properties:
        name:
          type: string
          enum:
          - TrainingSettings
        settings:
          type: array
          description: 'List of `{name, value}` setting pairs. Observed names/values

            (non-exhaustive — other settings appear in the `/settings/sports/edit`

            form; # TODO: enumerate full set + allowed values):

            - `autoLapType`: `LOCATION` (also likely `OFF`/`DISTANCE`/`DURATION`)

            - `volume`: `LOUD` (also likely `OFF`/`SOFT`)

            - `trainingReminderType`: `OFF`

            '
          items:
            type: object
            required:
            - name
            - value
            properties:
              name:
                type: string
                example: autoLapType
              value:
                type: string
                example: LOCATION
    TrainingDisplaysBlock:
      type: object
      description: 'Watch-screen layout for this profile on a given device. Same shape as a

        `TrainingDisplayList` element (see that schema): `displays` is the

        ordered list of screens, each an array of field ids from the

        training-display-items catalog.

        '
      required:
      - name
      - productId
      - displays
      properties:
        name:
          type: string
          enum:
          - TrainingDisplays
        productId:
          type: integer
          description: Polar device/watch model id.
          example: 268
        displays:
          type: array
          items:
            type: array
            items:
              type: integer
          example:
          - - 32
            - 3
            - 27
          - - 108
    SportProfileSaveRequest:
      type: object
      description: 'Body for `POST /settings/sports/save` — updates one or more sport profiles''

        settings and watch-screen layout in a single call. Captured 2026-06-01 from

        a device-paired account.

        '
      required:
      - sports
      properties:
        sports:
          type: object
          description: 'Map keyed by **sport-profile id** (the numeric id, as a string — the

            same id returned by `POST /settings/sports/add` and used as

            `sportProfileId` in the training-display endpoints). Each value is an

            array of configuration **blocks**, discriminated by `name`. The observed

            save sent two blocks: `TrainingSettings` and `TrainingDisplays`. Only the

            blocks you include are updated.

            '
          additionalProperties:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/TrainingSettingsBlock'
              - $ref: '#/components/schemas/TrainingDisplaysBlock'
            example:
            - name: TrainingSettings
              settings:
              - name: autoLapType
                value: LOCATION
              - name: volume
                value: LOUD
              - name: trainingReminderType
                value: 'OFF'
            - name: TrainingDisplays
              productId: 268
              displays:
              - - 32
                - 3
                - 27
              - - 108
      example:
        sports:
          '987654321':
          - name: TrainingSettings
            settings:
            - name: autoLapType
              value: LOCATION
            - name: volume
              value: LOUD
            - name: trainingReminderType
              value: 'OFF'
          - name: TrainingDisplays
            productId: 268
            displays:
            - - 32
              - 3
              - 27
            - - 108
      $defs:
        TrainingSettingsBlock:
          type: object
          description: General per-profile device settings.
          required:
          - name
          - settings
          properties:
            name:
              type: string
              enum:
              - TrainingSettings
            settings:
              type: array
              description: 'List of `{name, value}` setting pairs. Observed names/values

                (non-exhaustive — other settings appear in the `/settings/sports/edit`

                form; # TODO: enumerate full set + allowed values):

                - `autoLapType`: `LOCATION` (also likely `OFF`/`DISTANCE`/`DURATION`)

                - `volume`: `LOUD` (also likely `OFF`/`SOFT`)

                - `trainingReminderType`: `OFF`

                '
              items:
                type: object
                required:
                - name
                - value
                properties:
                  name:
                    type: string
                    example: autoLapType
                  value:
                    type: string
                    example: LOCATION
        TrainingDisplaysBlock:
          type: object
          description: 'Watch-screen layout for this profile on a given device. Same shape as a

            `TrainingDisplayList` element (see that schema): `displays` is the

            ordered list of screens, each an array of field ids from the

            training-display-items catalog.

            '
          required:
          - name
          - productId
          - displays
          properties:
            name:
              type: string
              enum:
              - TrainingDisplays
            productId:
              type: integer
              description: Polar device/watch model id.
              example: 268
            displays:
              type: array
              items:
                type: array
                items:
                  type: integer
              example:
              - - 32
                - 3
                - 27
              - - 108
    TrainingDisplayCatalog:
      type: object
      description: 'Catalog of **available training-display fields** a given Polar device

        (`productId`) can show on screen for a given sport profile, grouped by

        category. This is the *palette* the watch-screen layout editor draws from;

        the user''s chosen layout is returned separately by

        `GET /settings/sports/training-display-lists/{productId}/{sportProfileId}`

        (each configured screen is a list of these item `id`s).


        Captured 2026-06-01 from a device-paired account (productId 268, running

        profile). The exact item set varies by `productId`/`sportId`.

        '
      properties:
        productId:
          type: integer
          description: The Polar device/watch model id this catalog is for.
          example: 268
        sportId:
          type: integer
          description: Sport this profile is for (same id space as `/api/sports/sports`; 1 = RUNNING).
          example: 1
        data:
          type: array
          description: Field categories, each holding its selectable display items.
          items:
            type: object
            properties:
              categoryKey:
                type: string
                description: 'Category grouping. Observed values: `POWER`, `HR`, `TIME`,

                  `SPEED`, `CAD_STRIDE`, `DIST`, `FULLSCREEN`, `BARO_GPS`.

                  `FULLSCREEN` items are whole-screen views (graphs, map, watch

                  face); the others are data fields that can be combined on one

                  screen.

                  '
                example: HR
              items:
                type: array
                description: Selectable display fields in this category.
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: 'Numeric field id. **These ids are what populate the

                        `displays` arrays** in the training-display-lists response.

                        '
                      example: 20
                    key:
                      type: string
                      description: Stable enum name for the field (e.g. `CURRENT_HEART_RATE`).
                      example: CURRENT_HEART_RATE
      example:
        productId: 268
        sportId: 1
        data:
        - categoryKey: HR
          items:
          - id: 20
            key: CURRENT_HEART_RATE
          - id: 21
            key: AVERAGE_HEART_RATE
          - id: 22
            key: MAXIMUM_HEART_RATE
          - id: 32
            key: ZONE_POINTER
          - id: 27
            key: CALORIES
        - categoryKey: SPEED
          items:
          - id: 41
            key: SPEED_OR_PACE
          - id: 42
            key: SPEED_OR_PACE_AVERAGE
        - categoryKey: DIST
          items:
          - id: 37
            key: DISTANCE
        - categoryKey: TIME
          items:
          - id: 3
            key: STOPWATCH
        - categoryKey: FULLSCREEN
          items:
          - id: 115
            key: POWER_GRAPH
          - id: 121
            key: HILL_SPLITTER
          - id: 123
            key: GEOGRAPHIC_MAP
    TrainingDisplayList:
      type: object
      description: 'One configured set of **training-display screens** for a sport profile on a

        given device — i.e. the watch-screen layout the user sees during a session.

        Returned (wrapped in an array) by

        `GET /settings/sports/training-display-lists/{productId}/{sportProfileId}`.

        '
      properties:
        displays:
          type: array
          description: 'Ordered list of **screens**. Each screen is an array of display-field

            `id`s drawn from the catalog

            (`GET /settings/sports/training-display-items/{productId}/{sportProfileId}`).

            A multi-field screen combines several data fields (e.g.

            `[32, 37, 41, 3]` = zone pointer + distance + speed/pace + stopwatch);

            a single-element screen is usually a `FULLSCREEN` view (e.g. `[115]` =

            power graph). Field count per screen is constrained by the device. #

            TODO: verify max fields per screen and max screen count per device.

            '
          items:
            type: array
            items:
              type: integer
            description: One screen — an ordered list of display-field ids.
          example:
          - - 32
            - 37
            - 41
            - 3
          - - 115
          - - 121
          - - 123
        name:
          type: string
          description: Display-list name. Observed constant `TrainingDisplays`.
          example: TrainingDisplays
        productId:
          type: integer
          description: The Polar device/watch model id.
          example: 268
      example:
        displays:
        - - 32
          - 37
          - 41
          - 3
        - - 115
        - - 121
        - - 123
        name: TrainingDisplays
        productId: 268
    TrainingSessionCreate:
      type: object
      description: 'Payload for manual session entry via POST /api/training/create.

        ⚠ Multiple inconsistencies with TrainingTargetCreate — see

        docs/endpoints/training-sessions.md.

        '
      required:
      - date
      - sport
      - duration
      - distance
      - hrAverage
      - note
      - trainingSessionName
      - speedAverage
      - kiloCalories
      - hrMax
      - feeling
      - interpolatedHeartRateSamples
      - saveHeartRateSamples
      properties:
        date:
          type: string
          description: 'ISO 8601 local datetime **with timezone offset** (note: training-target

            uses tz-less form). Format: `YYYY-MM-DDTHH:MM±ZZZZ`.

            '
          example: 2026-05-25T08:48+0200
        sport:
          type: integer
          description: 'Sport id (note: field name is `sport` here, **not** `sportId` like in

            training-target body). See GET /api/sports/sports.

            '
          example: 1
        duration:
          type: integer
          description: Duration in **seconds** (not ms, not HH:MM:SS).
          example: 1800
        distance:
          type: integer
          description: Distance in **metres**. Use 0 when not provided.
          example: 0
        hrAverage:
          type: string
          description: 'Average heart rate (bpm). Sent as **empty string `""`** when not

            provided — not null or 0. Integer when provided.

            '
          example: ''
        note:
          type: string
          description: Free-text note. Empty string when blank.
          default: ''
        trainingSessionName:
          type: string
          description: Display name for the session.
        speedAverage:
          type: number
          description: Average speed in km/h, or null.
          nullable: true
        kiloCalories:
          type: integer
          description: Kilocalories burned. Use 0 when not provided.
          example: 0
        hrMax:
          type: string
          description: Max heart rate. Empty string when not provided (same convention as `hrAverage`).
          example: ''
        feeling:
          type: string
          description: 'Subjective feeling ("Mon ressenti pendant l''entraînement"), on an

            **inverted** 0–1 scale sent as a string: `"0.19"` best … `"0.39"`,

            `"0.59"`, `"0.79"`, `"0.99"` worst. Null when not selected. Verified

            2026-09-28 (read back as the number `0.19`).

            '
          nullable: true
        interpolatedHeartRateSamples:
          type: array
          description: 'Interpolated HR samples. Always empty `[]` for manual entries.

            Element schema TODO.

            '
          items: {}
        saveHeartRateSamples:
          type: boolean
          description: Whether to persist HR samples server-side.
          default: false
    TrainingSessionSummary:
      type: object
      description: 'One entry in the array returned by POST /api/training/history.

        ⚠ `duration` is **milliseconds** here, but **seconds** in the

        TrainingSessionCreate body.

        '
      required:
      - id
      - duration
      - sportId
      - startDate
      properties:
        id:
          type: integer
          format: int64
          description: Session ID — use as `{id}` in /api/training/analysis/{id}/* and DELETE.
          example: 8346808740
        duration:
          type: integer
          description: Duration in **milliseconds**.
          example: 1800000
        distance:
          type: number
          description: Distance in metres, or null. Server returns floats for GPS-tracked sessions.
          nullable: true
        hrAvg:
          type: integer
          description: Average HR (bpm), or null. Note the camelCase differs from create's `hrAverage`.
          nullable: true
        calories:
          type: integer
          description: Kilocalories, or null. Note the field name differs from create's `kiloCalories`.
          nullable: true
        note:
          type: string
          description: 'Free-text note. Observed as `" "` (single space) when the form note

            was blank — quirk of the create flow.

            '
        sportName:
          type: string
          description: Localised sport name (depends on user locale).
          example: Course à pied
        sportId:
          type: integer
          description: Numeric sport id (map via /api/sports/sports).
          example: 1
        startDate:
          type: string
          description: 'Session start time, format `YYYY-MM-DD HH:MM:SS.fff` (space separator,

            no timezone — note: differs from create''s ISO 8601 with offset).

            '
          example: '2026-05-25 08:48:00.000'
        recoveryTime:
          type: integer
          description: Recovery time, or null. Unit TODO (likely seconds).
          nullable: true
        iconUrl:
          type: string
          format: uri
          description: Sport icon URL.
        trainingLoadHtml:
          type: string
          description: Pre-rendered HTML for the UI (not for programmatic consumption). Empty for manual sessions.
        hasTrainingTarget:
          type: boolean
          description: True if the session was recorded against a planned training target.
        swimmingSport:
          type: boolean
          description: True for swimming sports (enables pool-specific fields).
        swimmingPoolUnits:
          type: string
          enum:
          - METERS
          description: Pool length unit for swimming sessions.
        trainingLoadProHtml:
          type: string
          description: Pre-rendered Training Load Pro HTML (premium). Empty on free accounts.
        periodDataUuid:
          type: string
          description: UUID linking to period data; null when none.
          nullable: true
        isTest:
          type: boolean
          description: True for fitness-test sessions.
    SessionExercise:
      type: object
      description: 'One exercise within a session (a session can have several if

        multi-sport). Same shape appears in both /summary and /details

        responses.

        '
      properties:
        id:
          type: integer
          format: int64
        sport:
          type: object
          description: Sport reference; only `id` is populated here.
          properties:
            id:
              type: integer
        startTime:
          type: string
          description: ISO 8601 without timezone.
        stopTime:
          type: string
        duration:
          type: string
          description: ISO 8601 duration (`PTxxM`).
        distance:
          type: number
          description: Metres.
          nullable: true
        calories:
          type: integer
          nullable: true
        fatPercentage:
          type: number
          nullable: true
        carboPercentage:
          type: number
          nullable: true
        proteinPercentage:
          type: number
          nullable: true
        recoveryTime:
          type: string
          description: Returned as a string by the /details endpoint (type is `string|null`).
          nullable: true
        trainingLoad:
          type: number
          nullable: true
        trainingLoadDescriptionKey:
          type: string
          description: Localisation key for a human-readable load description.
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        ascent:
          type: number
          description: Metres.
          nullable: true
        descent:
          type: number
          nullable: true
        timezoneOffset:
          type: integer
          nullable: true
        runningIndex:
          type: integer
          description: Polar's running-fitness metric.
          nullable: true
        normalizedPower:
          type: number
          description: Cycling normalized power, watts.
          nullable: true
        trainingStatistic:
          type: object
          description: 'Per-metric min/avg/max. Observed only `HEART_RATE` for a

            manual entry; populated metrics depend on device upload.

            '
          additionalProperties:
            type: object
            properties:
              max:
                type: number
                nullable: true
              avg:
                type: number
                nullable: true
              min:
                type: number
                nullable: true
        sportParent:
          type: string
          description: Top-level sport family (e.g. `"RUNNING"`, `"CYCLING"`).
        defaultSpeedViewSettings:
          type: string
          enum:
          - PACE
          - SPEED
          description: '⚠ Plural here (`defaultSpeedViewSettings`). Note: the same

            concept is **singular** (`defaultSpeedViewSetting`) inside the

            `sport` object on /api/favorites/favoriteTargetsJson.

            '
        sprintCount:
          type: integer
          nullable: true
        trainingStressScore:
          type: number
          description: Cycling TSS.
          nullable: true
        intensityFactor:
          type: number
          description: Cycling IF.
          nullable: true
      example:
        id: 8379162593
        sport:
          id: 1
        startTime: '2026-05-28T08:00:00'
        stopTime: '2026-05-28T08:30:00'
        duration: PT30M
        distance: 5000
        calories: 350
        recoveryTime: null
        trainingLoad: null
        trainingStatistic:
          HEART_RATE:
            max: 0
            avg: 0
            min: null
        sportParent: RUNNING
        defaultSpeedViewSettings: PACE
        sprintCount: null
        trainingStressScore: null
        intensityFactor: null
    ClubModel:
      type: object
      description: 'Group-class (Polar Club) gamification metadata attached to a training session.

        All-false / nulls / zeros for solo sessions (verified via capture

        22-analysis-summary.json on a non-club account).

        '
      properties:
        clubTrainingSession:
          type: boolean
          description: True if this session was part of a Polar Club class.
        sessionName:
          type: string
          description: Club class name; null for solo sessions.
          nullable: true
        sportName:
          type: string
          description: Club class sport name; null for solo sessions.
          nullable: true
        instructorName:
          type: string
          description: Class instructor's name; null when not a club session.
          nullable: true
        clubName:
          type: string
          description: Club name; null when not a club session.
          nullable: true
        clubAddress:
          type: string
          description: Club venue address; null when not a club session.
          nullable: true
        cooldownChampion:
          type: boolean
          description: Gamification badge — best cool-down in the class.
        zoneMate:
          type: boolean
          description: Gamification badge — stayed in the target zone alongside peers.
        rangeRuler:
          type: boolean
          description: Gamification badge — widest effective HR range.
        zoneMaster:
