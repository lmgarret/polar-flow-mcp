openapi: 3.0.3
info:
  title: Polar Flow Web API (unofficial)
  description: 'Unofficial reverse-engineered API for flow.polar.com.

    Built by observing browser network traffic — NOT based on the official AccessLink API.

    Use a test account only. No warranty.

    '
  version: 0.0.1
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Reverse-engineering project
servers:
- url: https://flow.polar.com
  description: Production (use test account only)
security:
- sessionCookie: []
tags:
- name: training-targets
  description: Training target (workout plan) management
- name: training-sessions
  description: Completed training sessions (manual entry + history)
- name: calendar
  description: Calendar event queries
- name: account
  description: Current user profile, settings, and physical info
- name: favorites
  description: Favorite training-target templates and route favorites
- name: activity
  description: Activity / steps / inactivity rollups
- name: sleep
  description: Sleep nights (lives on sleep-api.flow.polar.com subdomain)
- name: progress
  description: Aggregated progress / report totals (weekly, monthly, yearly)
- name: sport-profiles
  description: Per-sport device configuration ("Profils sportifs"); device-synced, read/delete only on the web API
paths:
  /api/trainingtarget:
    post:
      summary: Create a training target
      description: "Create a planned workout (training target). The `type` field selects the\nshape:\n\n- **VOLUME** — one\
        \ metric only: set exactly one of `duration` / `distance` /\n  `calories` on the single exerciseTarget; leave `phases`\
        \ empty (`[]`).\n- **STEADY_RACE_PACE** — a time-trial: set both `duration` and `distance`\n  (pace is implicit);\
        \ `phases` empty.\n- **PHASED** — a structured workout: populate `exerciseTargets[].phases`.\n\n### Modelling phases\
        \ (PHASED)\n\nA phase is either a **PhaseLeaf** (`phaseType: \"PHASE\"`) or a **PhaseRepeat**\n(`phaseType: \"REPEAT\"\
        `) that loops nested leaves. Guidance below is verified\nagainst the live API (probe captures in `captures/post-bodies/probe-*.json`):\n\
        \n- **Steady / continuous block** → use a single bare PhaseLeaf directly in\n  `phases` (see the `steadyBlock` example).\
        \ Do **not** wrap it in a REPEAT.\n- **Intervals** → use a REPEAT with `repeatCount` ≥ 2 (see `phasedRepeat`).\n-\
        \ **`repeatCount`**: the **server accepts 1** but silently unwraps a\n  single-rep REPEAT into a plain PHASE on read-back,\
        \ so it is pointless — the\n  Flow UI enforces a minimum of 2. Prefer a bare PhaseLeaf for one block.\n- **Recovery\
        \ is optional**: a REPEAT may hold just one work phase with no\n  trailing rest leaf (verified — the server rolls\
        \ the nested duration into\n  the exerciseTarget's top-level `duration`). To add recovery between reps,\n  append\
        \ a second leaf (typically `intensityType: \"NONE\"`).\n- **`duration`** uses strict `\"HH:MM:SS\"`; `\"00:00:00\"\
        ` is accepted but\n  meaningless. Set on a leaf iff `goalType: \"DURATION\"`; set `distance`\n  (metres) iff `goalType:\
        \ \"DISTANCE\"`.\n- **Multi-sport**: pass multiple `exerciseTargets` entries (see `multisport`);\n  the server assigns\
        \ each a sequential read-only `index`.\n\nWrites require the `X-Requested-With: XMLHttpRequest` header (CSRF defense).\n"
      operationId: createTrainingTarget
      tags:
      - training-targets
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingTargetCreate'
            examples:
              volumeDuration:
                summary: VOLUME — duration target (Durée)
                value:
                  type: VOLUME
                  name: 60 min easy run
                  description: ''
                  datetime: 2026-05-29T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: null
                    calories: null
                    phases: []
                    duration: 01:00:00
                    id: null
              volumeDistance:
                summary: VOLUME — distance target (Distance), distance in METRES
                value:
                  type: VOLUME
                  name: 5km easy
                  description: ''
                  datetime: 2026-05-30T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: 5000
                    calories: null
                    phases: []
                    duration: null
                    id: null
              volumeCalories:
                summary: VOLUME — calorie target (Calories)
                value:
                  type: VOLUME
                  name: 500 kcal burn
                  description: ''
                  datetime: 2026-05-31T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: null
                    calories: 500
                    phases: []
                    duration: null
                    id: null
              steadyRacePace:
                summary: STEADY_RACE_PACE — time-trial (Fonction contre la montre)
                value:
                  type: STEADY_RACE_PACE
                  name: 5km in 30:00
                  description: ''
                  datetime: 2026-07-01T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: 5000
                    calories: null
                    phases: []
                    duration: 00:30:00
                    id: null
              phasedHrZones:
                summary: PHASED — 2 phases, heart-rate-zone intensity (Par phases)
                value:
                  type: PHASED
                  name: interval session
                  description: ''
                  datetime: 2026-06-02T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: null
                    calories: null
                    duration: null
                    id: null
                    phases:
                    - phaseType: PHASE
                      name: main
                      phaseChangeType: AUTOMATIC
                      goalType: DISTANCE
                      distance: 5000
                      duration: null
                      intensityType: HEART_RATE_ZONES
                      lowerZone: 1
                      upperZone: 3
                    - phaseType: PHASE
                      name: cooldown
                      phaseChangeType: AUTOMATIC
                      goalType: DURATION
                      distance: null
                      duration: 00:10:00
                      intensityType: HEART_RATE_ZONES
                      lowerZone: 1
                      upperZone: 3
              phasedNoIntensity:
                summary: PHASED — single phase, "Utiliser les zones" unchecked → intensityType NONE
                value:
                  type: PHASED
                  name: open phase
                  description: ''
                  datetime: 2026-06-04T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: null
                    calories: null
                    duration: null
                    id: null
                    phases:
                    - phaseType: PHASE
                      name: open
                      phaseChangeType: AUTOMATIC
                      goalType: DISTANCE
                      distance: 5000
                      duration: null
                      intensityType: NONE
                      lowerZone: null
                      upperZone: null
              steadyBlock:
                summary: PHASED — single continuous Z2 block (steady). One bare PhaseLeaf, no REPEAT wrapper. Verified via
                  probe-C-steady-hrz.json (201).
                value:
                  type: PHASED
                  name: 45 min Z2
                  description: ''
                  datetime: 2026-06-10T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: null
                    calories: null
                    duration: null
                    id: null
                    phases:
                    - phaseType: PHASE
                      name: Z2 steady
                      phaseChangeType: AUTOMATIC
                      goalType: DURATION
                      distance: null
                      duration: 00:45:00
                      intensityType: HEART_RATE_ZONES
                      lowerZone: 2
                      upperZone: 2
              phasedRepeat:
                summary: 'PHASED — interval block: REPEAT (4×) work + recovery. repeatCount ≥ 2.'
                value:
                  type: PHASED
                  name: 4x3min intervals
                  description: ''
                  datetime: 2026-06-23T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: null
                    calories: null
                    duration: null
                    id: null
                    phases:
                    - phaseType: REPEAT
                      repeatCount: 4
                      phases:
                      - phaseType: PHASE
                        name: work
                        phaseChangeType: AUTOMATIC
                        goalType: DURATION
                        distance: null
                        duration: 00:03:00
                        intensityType: HEART_RATE_ZONES
                        lowerZone: 4
                        upperZone: 5
                      - phaseType: PHASE
                        name: recovery
                        phaseChangeType: AUTOMATIC
                        goalType: DURATION
                        distance: null
                        duration: 00:02:00
                        intensityType: NONE
                        lowerZone: null
                        upperZone: null
              phasedManual:
                summary: PHASED — phaseChangeType MANUAL (advance on user button press). From capture 10-phased-manual.json.
                value:
                  type: PHASED
                  name: manual-advance phase
                  description: ''
                  datetime: 2026-06-05T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: null
                    calories: null
                    duration: null
                    id: null
                    phases:
                    - phaseType: PHASE
                      name: warmup
                      phaseChangeType: MANUAL
                      goalType: DURATION
                      distance: null
                      duration: 00:10:00
                      intensityType: HEART_RATE_ZONES
                      lowerZone: 1
                      upperZone: 2
              phasedPower:
                summary: PHASED — POWER_ZONES on a power-capable sport (cycling, sportId 2). From capture 11-phased-power.json.
                value:
                  type: PHASED
                  name: power intervals
                  description: ''
                  datetime: 2026-06-06T09:00
                  exerciseTargets:
                  - sportId: 2
                    distance: null
                    calories: null
                    duration: null
                    id: null
                    phases:
                    - phaseType: PHASE
                      name: threshold
                      phaseChangeType: AUTOMATIC
                      goalType: DURATION
                      distance: null
                      duration: 00:20:00
                      intensityType: POWER_ZONES
                      lowerZone: 3
                      upperZone: 4
              multisport:
                summary: Multi-sport — two exerciseTargets (run then bike). Server assigns a sequential `index` per entry.
                  From capture 13-multisport.json.
                value:
                  type: PHASED
                  name: brick session
                  description: ''
                  datetime: 2026-06-07T09:00
                  exerciseTargets:
                  - sportId: 1
                    distance: null
                    calories: null
                    duration: null
                    id: null
                    phases:
                    - phaseType: PHASE
                      name: run
                      phaseChangeType: AUTOMATIC
                      goalType: DURATION
                      distance: null
                      duration: 00:30:00
                      intensityType: HEART_RATE_ZONES
                      lowerZone: 2
                      upperZone: 3
                  - sportId: 2
                    distance: null
                    calories: null
                    duration: null
                    id: null
                    phases:
                    - phaseType: PHASE
                      name: bike
                      phaseChangeType: AUTOMATIC
                      goalType: DURATION
                      distance: null
                      duration: 00:45:00
                      intensityType: POWER_ZONES
                      lowerZone: 2
                      upperZone: 3
      responses:
        '201':
          description: 'Created successfully. Response body is the new training-target id

            as a bare string (e.g. `1453858954`) — not JSON, not empty.

            Same shape as `POST /api/favoritetarget`.

            '
          content:
            text/plain:
              schema:
                type: string
                pattern: ^[0-9]+$
              example: '1453858954'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                timeConflict:
                  summary: Two targets at the same time
                  value:
                    time:
                    - error.trainingTarget.twoTargetsForSameTime
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/trainingtarget/{id}:
    parameters:
    - $ref: '#/components/parameters/TrainingTargetId'
    get:
      summary: Read a training target
      description: "Returns the server-normalized training-target object. Discovered during\nupdate-endpoint probing 2026-05-26\
        \ — same URL as `updateTrainingTarget`.\n\n**The read-back shape is NOT identical to the create payload.** The server\n\
        normalizes the stored shape, and a client that feeds this body back into\n`updateTrainingTarget` must account for\
        \ these read/send asymmetries\n(all verified 2026-06-08, probe-E-roundtrip-update.json):\n\n- `exerciseTargets[].duration`\
        \ / `.distance` are **rolled up** from the\n  phases on PHASED targets (e.g. a 4×3-min loop → `duration: \"00:12:00\"\
        `),\n  so they are non-null on read even though create sends them null.\n- `exerciseTargets[].index` is server-assigned\
        \ (0, 1, …) and read-only.\n- Each PHASE leaf reads back with `goalType` as the **authoritative** goal\n  discriminator.\
        \ A `goalType: DISTANCE` leaf reads back with BOTH its real\n  `distance` AND a phantom `duration: \"00:00:00\"`;\
        \ a `goalType: DURATION`\n  leaf omits `distance`. Do not infer the goal from field presence.\n- `intensityType: NONE`\
        \ phases read back `lowerZone`/`upperZone` as `0`\n  (zero-sentinel), not the `null` that create sends.\n\nNone of\
        \ these break a round-trip — the server tolerates all of them on\nupdate (see `updateTrainingTarget`). They only break\
        \ a *client* that\nre-derives goal/volume from field presence instead of the explicit\n`goalType` / `type` fields.\n"
      operationId: getTrainingTarget
      tags:
      - training-targets
      responses:
        '200':
          description: The training target as JSON. Shape mirrors the create payload plus server-assigned ids and rolled-up
            totals.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/TrainingTargetCreate'
                - type: object
                  description: Extra read-only fields the server adds on read-back.
                  properties:
                    sourceProgramType:
                      type: string
                      description: Origin program of the target (e.g. `UNKNOWN`).
                      example: UNKNOWN
                    isUserEditable:
                      type: boolean
                      description: True when the signed-in user may edit/delete this target.
              examples:
                steadyBlock:
                  summary: Single-phase steady block read-back (from probe-C-steady-hrz.json)
                  value:
                    datetime: 2026-06-10T09:00
                    sourceProgramType: UNKNOWN
                    isUserEditable: true
                    name: probe-c-steady
                    exerciseTargets:
                    - id: 1530890858
                      duration: 00:45:00
                      distance: null
                      calories: null
                      index: 0
                      sportId: 1
                      phases:
                      - id: 2912772577
                        lowerZone: 2
                        upperZone: 2
                        intensityType: HEART_RATE_ZONES
                        phaseChangeType: AUTOMATIC
                        goalType: DURATION
                        duration: 00:45:00
                        name: Z2 steady
                        phaseType: PHASE
                    description: ''
                    type: PHASED
                intervalRolledUp:
                  summary: REPEAT block read-back — top-level duration is rolled up (4 × 00:03:00 → 00:12:00). From probe-D-no-recovery.json.
                  value:
                    datetime: 2026-06-10T12:00
                    sourceProgramType: UNKNOWN
                    isUserEditable: true
                    name: probe-d-norecovery
                    exerciseTargets:
                    - id: 1530890861
                      duration: 00:12:00
                      distance: null
                      calories: null
                      index: 0
                      sportId: 1
                      phases:
                      - repeatCount: 4
                        phaseType: REPEAT
                        phases:
                        - id: 2912772580
                          lowerZone: 4
                          upperZone: 5
                          intensityType: HEART_RATE_ZONES
                          phaseChangeType: AUTOMATIC
                          goalType: DURATION
                          duration: 00:03:00
                          name: work
                          phaseType: PHASE
                    description: ''
                    type: PHASED
                namedPhases:
                  summary: 'Custom per-phase names (the "rename phase" feature). Each phase carries a free-text `name` shown
                    in the workout breakdown; names are independent of `intensityType` (here `NONE`, no training zones). Structure:
                    a warm-up leaf, a 7× work/recovery REPEAT group, then a cool-down leaf — the top-level `duration` (00:12:30)
                    is rolled up from all phases.'
                  value:
                    datetime: 2026-06-01T08:00
                    sourceProgramType: UNKNOWN
                    isUserEditable: true
                    name: Mobility routine
                    exerciseTargets:
                    - id: 1531113664
                      duration: 00:12:30
                      distance: null
                      calories: null
                      index: 0
                      sportId: 57
                      phases:
                      - id: 2913183561
                        lowerZone: 0
                        upperZone: 0
                        intensityType: NONE
                        phaseChangeType: AUTOMATIC
                        goalType: DURATION
                        duration: 00:01:00
                        name: Warm-up
                        phaseType: PHASE
                      - repeatCount: 7
                        phaseType: REPEAT
                        phases:
                        - id: 2913183562
                          lowerZone: 0
                          upperZone: 0
                          intensityType: NONE
                          phaseChangeType: AUTOMATIC
                          goalType: DURATION
                          duration: 00:01:15
                          name: Work
                          phaseType: PHASE
                        - id: 2913183563
                          lowerZone: 0
                          upperZone: 0
                          intensityType: NONE
                          phaseChangeType: AUTOMATIC
                          goalType: DURATION
                          duration: 00:00:15
                          name: Recovery
                          phaseType: PHASE
                      - id: 2913183564
                        lowerZone: 0
                        upperZone: 0
                        intensityType: NONE
                        phaseChangeType: AUTOMATIC
                        goalType: DURATION
                        duration: 00:01:00
                        name: Cool-down
                        phaseType: PHASE
                    description: ''
                    type: PHASED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No training target with that id (or it belongs to another user).
    post:
      summary: Update a training target (full replace)
      description: "Replaces the training target with the supplied body. **POST**, not PUT\nor PATCH — sending PUT returns\
        \ 404. The body shape is identical to\n`POST /api/trainingtarget` (create), with two requirements for\nsuccessful\
        \ field updates:\n\n1. Include the **existing `exerciseTargets[].id`** from\n   `GET /api/trainingtarget/{id}`. Sending\
        \ `id: null` is accepted\n   (returns 200) but **silently no-ops the exerciseTarget update** —\n   only top-level\
        \ fields (`name`, `description`, `datetime`) land.\n2. Same field semantics as create (distance in metres, datetime\
        \ without\n   timezone, phaseType `PHASE`/`REPEAT`, etc.).\n\nReturns **200 with an empty body** on success — note\
        \ this differs from\n`POST /api/trainingtarget` (create), which returns the new id as a\nbare string.\n\n**The GET\
        \ read-back round-trips safely.** You can take the\n`GET /api/trainingtarget/{id}` body, change what you want, and\
        \ POST it\nstraight back — the server tolerates every field the read adds that create\nomits: the rolled-up `exerciseTargets[].duration`/`.distance`,\
        \ the\nread-only `index`, the phantom `duration: \"00:00:00\"` on DISTANCE phases,\nthe `0` zone-sentinels on NONE\
        \ phases, and the server-assigned phase `id`s\n(all verified 2026-06-08). The **only** hard requirement is keeping\
        \ each\n`exerciseTargets[].id` (sending `id: null` no-ops that entry — see below).\nA client should NOT add pre-flight\
        \ validation that rejects these fields;\ndoing so produces a \"valid request refused before it is sent\" bug while\
        \ the\nAPI would have accepted it.\n\n**No date validation on update.** A `datetime` in the past or future is\naccepted\
        \ (200) — unlike `POST /api/training/create` (a *different*\nendpoint) which 400s on future dates. Do not guard update\
        \ calls on the\nclock.\n\nRe-read via `GET /api/trainingtarget/{id}` to confirm the change\nlanded (especially when\
        \ modifying exerciseTargets).\n"
      operationId: updateTrainingTarget
      tags:
      - training-targets
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingTargetCreate'
            example:
              type: VOLUME
              name: Renamed run
              description: updated description
              datetime: 2026-08-16T10:30
              exerciseTargets:
              - sportId: 2
                distance: 8000
                duration: null
                calories: null
                phases: []
                id: 1530729599
      responses:
        '200':
          description: Updated successfully. Empty body.
        '400':
          description: Validation error (e.g. time conflict). Same envelope as create.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /training/target/{id}:
    delete:
      summary: Delete a training target
      description: 'Delete a planned training target by id.


        ⚠ Note the **inconsistent path prefix**: this endpoint lives under

        `/training/target/{id}`, NOT `/api/trainingtarget/{id}` (which is used for

        create/read/update). There is **no trailing slash** (unlike session delete,

        `DELETE /api/training/deleteTrainingSession/{id}/`, which requires one).


        Returns 200 with an empty body. Idempotent in practice — deleting an

        already-gone id still returns 200.

        '
      operationId: deleteTrainingTarget
      tags:
      - training-targets
      parameters:
      - $ref: '#/components/parameters/TrainingTargetId'
      responses:
        '200':
          description: Deleted successfully. Response body is empty.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /training/getCalendarEvents:
    get:
      summary: List calendar events (includes training targets)
      description: 'Returns all diary events (training sessions, targets, etc.) for a date range.

        The response is polymorphic by `type`: training targets appear with `type: "TRAININGTARGET"`; fitness-test results
        appear with `type: "FITNESSDATA"` (different field set — carries calendar-styling colours and `index`/`timestamp`,
        and uses camelCase `listItemId` instead of `ListItemId`). See `CalendarEvent` for the per-type field notes.

        Date format: D.M.YYYY (no leading zeros).

        '
      operationId: getCalendarEvents
      tags:
      - calendar
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
        description: Start date in D.M.YYYY format (e.g. 27.4.2026)
        example: 27.4.2026
      - name: end
        in: query
        required: true
        schema:
          type: string
        description: End date in D.M.YYYY format (e.g. 7.6.2026)
        example: 7.6.2026
      responses:
        '200':
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/sports/sports:
    get:
      summary: List all sports with their numeric IDs
      description: 'Returns a flat object mapping numeric sport ID (as string key) to the

        internal sport name constant. Use these IDs as `sportId` in training

        target requests. This endpoint requires no auth — observed to load

        without a session cookie during form initialisation.

        '
      operationId: getSports
      tags:
      - training-targets
      security: []
      responses:
        '200':
          description: Map of sport ID → sport name constant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsMap'
              example:
                '1': RUNNING
                '2': CYCLING
                '3': WALKING
                '38': ROAD_BIKING
        '404':
          description: Not found
        '500':
          description: Server error
  /api/sports/profiles:
    get:
      summary: List the user's sport profiles
      description: 'Returns the signed-in user''s **sport profiles** ("Profils sportifs",

        reached in the web UI via *Compte → Profils sportifs*, served by the

        server-rendered `/settings/sports` page).


        Sport profiles are the per-sport device configuration (training views,

        auto-lap, zones, sensor/GPS settings). **Create/update is NOT on this

        `/api/sports/*` resource** (`POST`/`PUT`/`PATCH` here all 404). It lives on

        the legacy `/settings/sports/*` controller instead:

        **create = `POST /settings/sports/add`**, **update =

        `POST /settings/sports/save`** (verified 2026-06-01 from a device-paired

        account — see `docs/endpoints/sport-profiles.md`).


        Note those settings endpoints key profiles by a **numeric** id, whereas

        this `/api/sports/profiles/{id}` resource validates a **UUID** — the two id

        systems are not yet reconciled.


        **Empty on a device-less account.** On the free test account this returns

        `[]`, and `GET /api/account/users/current/user` likewise reports

        `sportProfiles: []`. A populated element shape could not be captured — see

        `SportProfile` for the partially-inferred element schema and TODOs.


        A `sportId` query parameter is accepted but had no visible effect on the

        empty account (still `[]`).

        '
      operationId: listSportProfiles
      tags:
      - sport-profiles
      parameters:
      - name: sportId
        in: query
        required: false
        schema:
          type: integer
        description: 'Optional sport filter (same id space as `GET /api/sports/sports`).

          Accepted on the empty test account but its filtering effect could not

          be confirmed. # TODO: verify against a populated account.

          '
        example: 1
      responses:
        '200':
          description: Array of the user's sport profiles (empty on a device-less account).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportProfile'
              examples:
                empty:
                  summary: Device-less / free account
                  value: []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/sports/profiles/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 'The sport profile''s **UUID** (the `id` field from

        `GET /api/sports/profiles`, **not** the numeric `sportId`). A non-UUID

        value returns `400 Invalid UUID: <value>` (plain text).

        '
      example: 7ae78bae-6ee6-47aa-9128-a2ee5cd0a138
    get:
      summary: Read a single sport profile
      description: 'Returns one sport profile by its UUID.


        **Not exercised against a real profile.** The test account has no synced

        sport profiles, so this could not be observed returning `200`. Probing

        with arbitrary UUIDs returned `400` with a plain-text

        `Invalid request: Invalid UUID: <value>` body — meaning either the id

        must match an existing profile, or Polar uses a stricter/custom id

        encoding than a canonical v4 UUID. # TODO: verify the success shape and the

        exact id format using an account with a device-synced profile.

        '
