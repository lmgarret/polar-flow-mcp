  /api/sports/profiles/{id}/recalculate:
    parameters:
    - $ref: '#/components/parameters/SportProfileUuid'
    post:
      summary: Compute a sport's zones and thresholds (no write)
      description: "**Pure computation — nothing is persisted** (the stored profile's\n`modified` is unchanged afterwards).\
        \ The web UI calls it while the user\nedits zones/thresholds to preview the derived limits. Captured 2026-09-29.\n\
        \nReturns the posted envelope with `profile.settings.zoneLimits` filled in\nfor every zone type whose `*SettingSource`\
        \ is `…_DEFAULT` (types with no\nsource set come back `[]`), plus the thresholds the defaults derive from\n(`maximumAerobicSpeed`,\
        \ `maximumAerobicPower`,\n`functionalThresholdPower` — only those relevant to the sport).\n\n**Works without a stored\
        \ profile**: the `{id}` need not exist, only be a\nwell-formed profile uuid (domain `0f000000`, non-zero last group\
        \ — the\nserver rejects `…-000000000000` with `UUID has invalid sport ID: 0`).\nThis is the way to read a sport's\
        \ **default zones** on an account that\nhas no profile for that sport. Minimal body that yields all three zone\ntypes:\n\
        \n```json\n{\"userId\": 11111111, \"uuid\": \"0f000000-0080-0000-0000-000000000002\",\n \"profile\": {\"sportId\"\
        : 2, \"settings\": {\"zoneLimits\": {\n   \"heartRateSettingSource\": \"HEART_RATE_ZONE_SETTING_SOURCE_DEFAULT\",\n\
        \   \"speedSettingSource\": \"SPEED_ZONE_SETTING_SOURCE_DEFAULT\",\n   \"powerSettingSource\": \"POWER_ZONE_SETTING_SOURCE_DEFAULT\"\
        }}}}\n```\n\n`userId` must be the session user's (see `SportProfileWriteRequest`), so\nthis cannot read another account's\
        \ thresholds. Requires\n`X-Requested-With: XMLHttpRequest`.\n"
      operationId: recalculateSportProfile
      tags:
      - sport-profiles
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportProfileWriteRequest'
      responses:
        '200':
          description: The envelope with computed zones/thresholds (no `created`/`modified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportProfile'
              example:
                uuid: 0f000000-0080-0000-0000-000000000001
                userId: '11111111'
                profile:
                  sportId: 1
                  settings:
                    zoneLimits:
                      heartRateZones:
                      - lowerLimit: 95
                        higherLimit: 114
                      - lowerLimit: 114
                        higherLimit: 133
                      - lowerLimit: 133
                        higherLimit: 152
                      - lowerLimit: 152
                        higherLimit: 171
                      - lowerLimit: 171
                        higherLimit: 190
                      speedZones:
                      - lowerLimit: 9.451075
                        higherLimit: 12.02864
                      - lowerLimit: 12.02864
                        higherLimit: 14.606206
                      - lowerLimit: 14.606206
                        higherLimit: 17.183771
                      - lowerLimit: 17.183771
                        higherLimit: 19.761337
                      - lowerLimit: 19.761337
                        higherLimit: 399
                      powerZones:
                      - lowerLimit: 221
                        higherLimit: 283
                      - lowerLimit: 283
                        higherLimit: 343
                      - lowerLimit: 343
                        higherLimit: 403
                      - lowerLimit: 403
                        higherLimit: 464
                      - lowerLimit: 464
                        higherLimit: 2000
                      heartRateSettingSource: HEART_RATE_ZONE_SETTING_SOURCE_DEFAULT
                      powerSettingSource: POWER_ZONE_SETTING_SOURCE_DEFAULT
                      speedSettingSource: SPEED_ZONE_SETTING_SOURCE_DEFAULT
                      powerZoneCalculationMethod: POWER_ZONE_CALCULATION_METHOD_MAP_BASED
                      speedZoneCalculationMethod: SPEED_ZONE_CALCULATION_METHOD_MAS_BASED
                    remoteButtonActions: []
                  productSettings: []
                  subProfileUuids: []
                  maximumAerobicSpeed:
                    speed: 17.183771
                    source: MAS_SOURCE_ESTIMATED
                  maximumAerobicPower:
                    power: 403
                    source: MAP_SOURCE_ESTIMATED
                legacyProfiles: {}
        '400':
          description: 'Bad uuid (unknown domain / sport segment 0), body uuid ≠ URL uuid,

            or `userId` missing / not the session user. Plain text naming the field.

            '
          content:
            text/plain:
              schema:
                type: string
              example: Profile UUID in the request body does not match the UUID in the URL
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/sports/profiles/{id}/update-zones:
    parameters:
    - $ref: '#/components/parameters/SportProfileUuid'
    post:
      summary: Save a sport profile's training zones
      description: 'Persists the profile''s zones — the UI''s "Zones d''entraînement" editor.

        Send the full `profile` read from `GET /api/sports/profiles/{id}` with

        `settings.zoneLimits` edited; set a list''s `*SettingSource` to `…_FREE`

        to keep hand-entered limits, or `…_DEFAULT` to go back to computed ones.

        **200, empty body.** Captured 2026-09-29. Changes reach the watch on its

        next sync.


        Server-side validation (400, plain text listing every error as

        `profile.settings.zone_limits.<list>[i]: <reason>`):

        - exactly **5** zones per non-empty list;

        - contiguous: zone *i*''s `lowerLimit` = zone *i-1*''s `higherLimit`;

        - each zone spans ≥ 2 units;

        - ranges: HR [15, 240] bpm, speed [1.0, 399.0] km/h, power [0, 2000] W.


        Probed 2026-09-30: only `settings.zoneLimits` is read — other settings

        are kept even when omitted. All three `*SettingSource` fields are

        required (a missing one → 400 `… setting source is missing from profile

        settings`), so send every list, not just the edited one. A `…_DEFAULT`

        source makes the server recompute that list and ignore the limits sent.

        HR and power limits must be integers (`2000.5` → 400 `Not an int32

        value`); speed may be fractional and has no minimum zone span. A `…_FREE`

        power list reads back with calculation method `…_UNKNOWN`. The stored

        `modified` is the server''s write time, reported truncated to the second

        — send at least stored + 1 s, or a write right after create can 409.


        ⚠ `modified` must be **newer** than the stored profile''s `modified`,

        else **409** `A newer profile exists: Incoming sport profile is older

        than what is stored`. `userId` must be the session user. Requires

        `X-Requested-With: XMLHttpRequest`.

        '
      operationId: updateSportProfileZones
      tags:
      - sport-profiles
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportProfileWriteRequest'
      responses:
        '200':
          description: Saved. Empty body — re-read the profile.
        '400':
          description: Validation failed (see above) or bad uuid/userId. Plain text.
          content:
            text/plain:
              schema:
                type: string
              example: 'Invalid update sport profile request for user 11111111 with uuid 0f000000-0080-0000-0000-000000000002.
                Service replied status INVALID_REQUEST with message ''Invalid request: Profile validation failed with 1 error(s):
                profile.settings.zone_limits.speed_zones[1]: Speed zone lower limit should be equal to previous zone''s higher
                limit. Previous zone higher limit: 20.0, current zone lower limit: 21.0'''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`modified` is not newer than the stored profile. Plain text.'
          content:
            text/plain:
              schema:
                type: string
  /api/sports/profiles/create/{sportId}:
