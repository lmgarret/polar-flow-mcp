              type: number
              description: Progress towards the daily activity goal, in **percent** (the web UI renders it as `<n>%`).
            activeTime:
              type: integer
              description: Active time in **minutes** (the web UI passes it as `durationMinutes`; bundle read 2026-09-30).
            distanceFromSteps:
              type: number
              format: float
              description: Distance from steps in **metres** (the web UI feeds it to its metre-based `toDistance`; bundle
                read 2026-09-30).
            stepCount:
              type: integer
            kiloCalories:
              type: integer
