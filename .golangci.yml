version: "2"

run:
  build-tags:
    - polartest

linters:
  enable:
    - gocyclo
    - godot
    - misspell
    - noctx
  settings:
    gocyclo:
      min-complexity: 15
    errcheck:
      check-type-assertions: true

issues:
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - godot
