# polar-flow-mcp docker-compose example
#
# This server is single-user — one container per Polar Flow account.
# Credentials are loaded from a secrets file bind-mounted at /.env so they
# never appear in docker inspect, Portainer's UI, or the container environment.
#
# Setup:
#   sudo mkdir -p /etc/polar-flow
#   sudo tee /etc/polar-flow/secrets.env <<'EOF'
#   POLAR_EMAIL=you@example.com
#   POLAR_PASSWORD=yourpassword
#   EOF
#   sudo chmod 600 /etc/polar-flow/secrets.env
#
# See https://lmgarret.github.io/polar-flow-mcp for full setup instructions.

services:
  polar-flow-mcp:
    image: ghcr.io/lmgarret/polar-flow-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Secrets file — contains POLAR_EMAIL and POLAR_PASSWORD.
      # chmod 600, owned by root. Never put credentials in the environment
      # block below; they would be visible in docker inspect and Portainer.
      - /etc/polar-flow/secrets.env:/.env:ro

      # Cookie jar — keep on a named volume so sessions survive restarts.
      - polar-data:/data
    environment:
      COOKIE_JAR_PATH: "/data/polar-cookies.json"
      TRANSPORT: "http"

      # BIND_ADDRESS must be 0.0.0.0 inside the container so the port
      # is reachable from the host via the mapping above.
      BIND_ADDRESS: "0.0.0.0"

      # OPTIONAL: logging.
      # LOG_LEVEL: "info"
      # LOG_FILE: ""

volumes:
  polar-data:
