# polar-flow-mcp docker-compose example
#
# This server is single-user — one container per Polar Flow account.
# The server refuses to start unless POLAR_EMAIL and POLAR_PASSWORD are set.
# See https://lmgarret.github.io/polar-flow-mcp for setup instructions.

services:
  polar-flow-mcp:
    image: ghcr.io/lmgarret/polar-flow-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - polar-data:/data
    environment:
      # REQUIRED: Polar Flow account credentials.
      # Use a TEST account where possible. The password is held in memory
      # only — never written to disk by this server.
      POLAR_EMAIL: ""
      POLAR_PASSWORD: ""

      # Cookie jar path (chmod 600). Keep on the named volume so the cookies
      # survive container restarts.
      COOKIE_JAR_PATH: "/data/polar-cookies.json"

      # OPTIONAL: bind address inside the container. Keep loopback unless
      # you understand the security implications — this server has no
      # built-in authentication.
      # BIND_ADDRESS: "0.0.0.0"

      # OPTIONAL: transport. Use "stdio" only if you launch the container
      # via `docker compose run` from an MCP client.
      # TRANSPORT: "http"

      # OPTIONAL: logging.
      # LOG_LEVEL: "info"
      # LOG_FILE: ""

volumes:
  polar-data:
