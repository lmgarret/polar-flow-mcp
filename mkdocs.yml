site_name: polar-flow-mcp
site_url: https://lmgarret.github.io/polar-flow-mcp
site_description: Single-user MCP server driving the reverse-engineered Polar Flow web API
repo_url: https://github.com/lmgarret/polar-flow-mcp
repo_name: lmgarret/polar-flow-mcp

theme:
  name: readthedocs
  palette:
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Deployment:
    - Docker Compose: deployment/docker-compose.md
    - Exposing Securely (OAuth): deployment/exposing-securely.md
  - Usage: usage.md
  - Reference:
    - Environment Variables: reference/env-vars.md
    - MCP Tools: reference/mcp-tools.md
    - HTTP Endpoints: reference/http-endpoints.md
  - Security: security.md
  - Contributing: contributing.md
