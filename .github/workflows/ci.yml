name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# Least privilege by default; jobs that push images or releases widen it.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: CGO_ENABLED=0 go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` and the semver ladder are owned by tagged releases (see
          # release.yml). Main-branch builds publish the rolling `edge` tag plus
          # the exact commit SHA.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=0.0.0-edge+${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}

  edge-release:
    name: Edge release
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialise so two quick merges can't race on deleting/recreating `edge`.
    concurrency:
      group: edge-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compose release notes
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          SHORT="${GITHUB_SHA::7}"
          # Only `v*` tags count as releases; `edge` itself must never match.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}HEAD"
          {
            echo "Rolling pre-release of \`main\` at ${GITHUB_SHA}. Replaced on every merge — not a stable release."
            echo ""
            echo "### Docker image"
            echo ""
            echo '```'
            echo "${IMAGE}:edge          # this build (moves with main)"
            echo "${IMAGE}:sha-${SHORT}   # immutable, this exact commit"
            echo '```'
            echo ""
            echo "### Changes since ${PREV:-the first commit}"
            echo ""
            echo '```'
            git log --oneline --no-merges "$RANGE"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish rolling edge release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Drop the previous edge release and its tag, then recreate both at
          # this commit. Tags pushed with GITHUB_TOKEN don't trigger workflows,
          # and `edge` doesn't match release.yml's `v*` filter anyway.
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true
          gh release create edge \
            --target "$GITHUB_SHA" \
            --title "edge" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease \
            --latest=false

  docker-pr:
    name: Docker (PR preview)
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Only build for PRs from the same repo (owner branches), not forks
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=0.0.0-pr.${{ github.event.pull_request.number }}+${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}

  docker-pr-cleanup:
    name: Docker (PR cleanup)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      packages: write
    steps:
      - name: Delete PR image from GHCR
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          OWNER="${{ github.repository_owner }}"
          PACKAGE="polar-flow-mcp"

          # Find versions tagged pr-{number} and delete them
          gh api "users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags | map(test(\"^pr-${PR_NUMBER}$\")) | any) | .id" \
          | while read -r version_id; do
              echo "Deleting version ${version_id} (pr-${PR_NUMBER})"
              gh api -X DELETE "users/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}"
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

