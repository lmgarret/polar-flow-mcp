name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  D2_VERSION: v0.7.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # astro-d2 shells out to the D2 binary at build time to render ```d2 blocks.
      - name: Install D2
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo install "d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version

      - run: npm ci

      - run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          publish_branch: gh-pages
          force_orphan: true

      - id: gotifacts-publish
        uses: lmgarret/gotifacts-publish@e817890d6449a9593a4efaec5b35933b5f813f10 # v1.1.0
        with:
          url: ${{ secrets.GOTIFACTS_URL }}
          api-key: ${{ secrets.GOTIFACTS_API_KEY }}
          path: ./docs/dist    # single .html file, a dir, or a .tar.gz
          slug: polar-flow-mcp
          group: docs
          title: Polar Flow MCP
      - run: echo "Published to ${{ steps.gotifacts-publish.outputs.url }}"
